    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <script>
      /* ── 滑块填充 ──────────────────────────────────────────────────────
         轨道的已填充部分由 --slider-value 驱动。骨架始终同步这个变量，
         因而只使用滑块的页面不依赖条件内联的组件行为 JS。 */
      (function () {
        function sync(el) {
          var min = Number(el.min || 0),
            max = Number(el.max === "" ? 100 : el.max);
          var pct =
            max === min ? 0 : ((Number(el.value) - min) / (max - min)) * 100;
          el.style.setProperty("--slider-value", pct + "%");
        }
        document.querySelectorAll('input[type="range"]').forEach(sync);
        /* 事件委托：后插进来的滑块也照样跟着走 */
        document.addEventListener("input", function (e) {
          if (e.target.matches && e.target.matches('input[type="range"]'))
            sync(e.target);
        });
      })();
    </script>
    <script>
      /* ── 代码工具条：换行 / 复制 ──
         给每个 pre > code 注入两个按钮。工具条带 data-md-skip，导出 Markdown 时不出现。
         复制走 navigator.clipboard，失败时退回 execCommand；反馈先行，不等 promise。 */
      (function () {
        function mk(label, title) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.setAttribute("data-variant", "outline");
          b.title = title;
          b.textContent = label;
          return b;
        }
        function copyText(text) {
          try {
            return navigator.clipboard.writeText(text);
          } catch (e) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
            } catch (e2) {}
            ta.remove();
          }
        }
        document.querySelectorAll("pre > code").forEach(function (code) {
          var pre = code.parentNode;
          if (pre.querySelector(".code-tools")) return;
          var bar = document.createElement("div");
          bar.className = "code-tools";
          bar.setAttribute("data-md-skip", "");
          var wrap = mk("换行", "切换自动换行");
          wrap.setAttribute("aria-pressed", "false");
          wrap.addEventListener("click", function () {
            var on = pre.dataset.wrap !== "on";
            pre.dataset.wrap = on ? "on" : "off";
            wrap.setAttribute("aria-pressed", String(on));
          });
          var copy = mk("复制", "复制代码");
          copy.addEventListener("click", function () {
            copy.textContent = "已复制";
            setTimeout(function () {
              copy.textContent = "复制";
            }, 1600);
            copyText(code.textContent.replace(/\n$/, ""));
          });
          bar.appendChild(wrap);
          bar.appendChild(copy);
          pre.appendChild(bar);
        });
      })();
    </script>
    <script>
      /* ── 主题三态切换 ── */
      (function () {
        var root = document.documentElement;
        var mq = matchMedia("(prefers-color-scheme: dark)");
        function apply(t) {
          root.dataset.theme = t;
          root.classList.toggle(
            "dark",
            t === "dark" || (t === "system" && mq.matches)
          );
          document.querySelectorAll("[data-theme-set]").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.themeSet === t));
          });
        }
        document.querySelectorAll("[data-theme-set]").forEach(function (b) {
          b.addEventListener("click", function () {
            var t = b.dataset.themeSet;
            try {
              t === "system"
                ? localStorage.removeItem("show-me-theme")
                : localStorage.setItem("show-me-theme", t);
            } catch (e) {}
            apply(t);
          });
        });
        mq.addEventListener("change", function () {
          if (root.dataset.theme === "system") apply("system");
        });
        apply(root.dataset.theme || "system");
      })();

      /* ── 复制为 Markdown ──
   遍历 #doc（或 [data-md-root]）生成 GFM。跳过 [data-md-skip] / [hidden] / 脚本 / 弹层。 */
      (function () {
        var SKIP = new Set([
          "SCRIPT",
          "STYLE",
          "TEMPLATE",
          "DIALOG",
          "NOSCRIPT",
          "SVG",
          "CANVAS",
        ]);
        var INLINE_ONLY = new Set([
          "A",
          "CODE",
          "STRONG",
          "B",
          "EM",
          "I",
          "DEL",
          "S",
          "SPAN",
          "KBD",
          "SMALL",
          "ABBR",
          "MARK",
          "SUP",
          "SUB",
          "BR",
          "IMG",
          "TIME",
          "MATH",
          "U",
          "Q",
          "LABEL",
          "OUTPUT",
        ]);

        function skipped(el) {
          return (
            SKIP.has(el.tagName.toUpperCase()) ||
            el.hasAttribute("data-md-skip") ||
            el.hasAttribute("hidden") ||
            el.getAttribute("aria-hidden") === "true"
          );
        }
        function txt(s) {
          return (s || "").replace(/\s+/g, " ");
        }

        function inline(node) {
          var out = "";
          node.childNodes.forEach(function (n) {
            if (n.nodeType === 3) {
              out += txt(n.nodeValue);
              return;
            }
            if (n.nodeType !== 1 || skipped(n)) return;
            var t = n.tagName.toUpperCase(),
              inner = inline(n);
            if (t === "MATH") {
              /* 公式导出 LaTeX 源：build 编译时留下的 annotation；没有就退回可读文本 */
              var ann = n.querySelector(
                'annotation[encoding="application/x-tex"]'
              );
              var tex = ann
                ? ann.textContent.trim()
                : txt(n.textContent).trim();
              out +=
                n.getAttribute("display") === "block"
                  ? "\n\n$$" + tex + "$$\n\n"
                  : "$" + tex + "$";
              return;
            }
            if (t === "BR") out += "  \n";
            else if (t === "IMG")
              out +=
                "![" +
                (n.alt || "") +
                "](" +
                (n.getAttribute("src") || "") +
                ")";
            else if (
              t === "CODE" ||
              t === "KBD" ||
              n.classList.contains("badge") ||
              n.classList.contains("kbd")
            )
              out += inner.trim() ? "`" + inner.trim() + "`" : "";
            else if (t === "A") {
              var href = n.getAttribute("href") || "";
              out +=
                href && !href.startsWith("#")
                  ? "[" + inner.trim() + "](" + href + ")"
                  : inner;
            } else if (t === "STRONG" || t === "B")
              out += inner.trim() ? "**" + inner.trim() + "**" : "";
            else if (t === "EM" || t === "I")
              out += inner.trim() ? "*" + inner.trim() + "*" : "";
            else if (t === "DEL" || t === "S")
              out += inner.trim() ? "~~" + inner.trim() + "~~" : "";
            else out += inner;
          });
          return out;
        }

        function cell(el) {
          return inline(el).trim().replace(/\|/g, "\\|").replace(/\n/g, " ");
        }

        function table(el) {
          var rows = Array.from(el.querySelectorAll("tr")).filter(function (r) {
            return !skipped(r);
          });
          if (!rows.length) return "";
          /* 没有表头行的表：全部行当数据，列名留空占位 ——
             否则第一行数据会被当成表头，语义就错了 */
          var hasTh = !!rows[0].querySelector("th");
          var head = rows[0],
            body = hasTh ? rows.slice(1) : rows;
          var cols = Array.from(head.children).map(function (c, i) {
            return hasTh ? cell(c) : "列" + (i + 1);
          });
          var out =
            "| " +
            cols.join(" | ") +
            " |\n|" +
            cols
              .map(function () {
                return " --- ";
              })
              .join("|") +
            "|\n";
          body.forEach(function (r) {
            out += "| " + Array.from(r.children).map(cell).join(" | ") + " |\n";
          });
          return out;
        }

        function list(el, depth) {
          var ordered = el.tagName === "OL",
            i = 0,
            out = "";
          Array.from(el.children).forEach(function (li) {
            if (li.tagName !== "LI" || skipped(li)) return;
            i++;
            var marker = ordered ? i + ". " : "- ";
            var pad = "  ".repeat(depth);
            var sub = "";
            var own = document.createElement("div");
            Array.from(li.childNodes).forEach(function (n) {
              if (
                n.nodeType === 1 &&
                (n.tagName === "UL" || n.tagName === "OL")
              )
                /* 深层嵌套拍平到本级：GFM 对超过 4–5 层的子列表解析不稳，保内容齐整优先 */
                sub += list(n, depth < 6 ? depth + 1 : depth);
              else own.appendChild(n.cloneNode(true));
            });
            var text = inline(own).trim();
            if (text) out += pad + marker + text + "\n";
            out += sub;
          });
          return out;
        }

        function block(el, depth) {
          var out = "";
          Array.from(el.children).forEach(function (n) {
            if (skipped(n)) return;
            var t = n.tagName.toUpperCase();
            if (t === "SUMMARY")
              return; /* DETAILS 分支已单独输出，这里再走一遍会裸文本重复 */
            if (/^H[1-6]$/.test(t)) {
              out += "\n" + "#".repeat(+t[1]) + " " + inline(n).trim() + "\n\n";
            } else if (t === "P") {
              var s = inline(n).trim();
              if (s) out += s + "\n\n";
            } else if (t === "UL" || t === "OL") {
              out += list(n, 0) + "\n";
            } else if (t === "PRE") {
              var code = n.querySelector("code");
              var lang =
                (code &&
                  (code.className.match(/language-([\w+-]+)/) || [])[1]) ||
                "";
              out +=
                "```" +
                lang +
                "\n" +
                /* 取 code 的文本而不是 pre 的：pre 里还有骨架注入的工具条 */
                ((code || n).textContent || "").replace(/\n+$/, "") +
                "\n```\n\n";
            } else if (t === "TABLE") {
              out += table(n) + "\n";
            } else if (t === "MATH") {
              var ann2 = n.querySelector(
                'annotation[encoding="application/x-tex"]'
              );
              out +=
                "$$" +
                (ann2 ? ann2.textContent.trim() : txt(n.textContent).trim()) +
                "$$\n\n";
            } else if (t === "HR") {
              out += "---\n\n";
            } else if (t === "BLOCKQUOTE" || n.classList.contains("alert")) {
              out +=
                block(n, depth)
                  .trim()
                  .split("\n")
                  .map(function (l) {
                    return l ? "> " + l : ">";
                  })
                  .join("\n") + "\n\n";
            } else if (n.classList.contains("tabs")) {
              /* Markdown 没有标签页：每个标签导出成小标题 + 它的面板，隐藏的面板也要出。 */
              n.querySelectorAll('[role="tablist"] > [role="tab"]').forEach(
                function (tab) {
                  out += "**" + inline(tab).trim() + "**\n\n";
                  var panel = document.getElementById(
                    tab.getAttribute("aria-controls")
                  );
                  if (panel) out += block(panel, depth);
                }
              );
            } else if (t === "DETAILS") {
              var sum = n.querySelector("summary");
              if (sum) out += "**" + inline(sum).trim() + "**\n\n";
              out += block(n, depth);
            } else if (t === "DL") {
              Array.from(n.children).forEach(function (d) {
                if (d.tagName === "DT")
                  out += "**" + inline(d).trim() + "** — ";
                else if (d.tagName === "DD") out += inline(d).trim() + "\n\n";
              });
            } else if (
              n.children.length === 0 ||
              Array.from(n.children).every(function (c) {
                return INLINE_ONLY.has(c.tagName);
              })
            ) {
              var s2 = inline(n).trim();
              if (s2) out += s2 + "\n\n";
            } else {
              out += block(n, depth);
            }
          });
          return out;
        }

        function toMarkdown() {
          var root =
            document.querySelector("[data-md-root]") ||
            document.getElementById("doc") ||
            document.body;
          var md = block(root, 0)
            .replace(/\n{3,}/g, "\n\n")
            .trim();
          var title = document.title;
          /* 正文里只要有一级标题就不再拼 <title>：否则 eyebrow 段落排在 h1 前时，
             导出会得到两个「# 」（anti-patterns.md #2）。 */
          var hasH1 = /^# /m.test(md);
          return (hasH1 ? "" : "# " + title + "\n\n") + md + "\n";
        }

        /* 暴露给页面用：需要「下载 .md」之类的额外入口时调用它，不要另写一份转换器。 */
        window.showMeMarkdown = toMarkdown;

        document.querySelectorAll("[data-copy-md]").forEach(function (btn) {
          var icons = btn.querySelectorAll("svg, i");
          btn.addEventListener("click", async function () {
            var md = toMarkdown();
            /* 反馈先行：剪贴板图标换成对勾 1.6s。不等待 writeText —— 权限 pending 时它可能永不 settle。
         SVG 没有 hidden 反射属性，必须操作属性本身 */
            if (icons.length >= 2) {
              icons[0].setAttribute("hidden", "");
              icons[1].removeAttribute("hidden");
            }
            btn.setAttribute("data-variant", "secondary");
            setTimeout(function () {
              if (icons.length >= 2) {
                icons[0].removeAttribute("hidden");
                icons[1].setAttribute("hidden", "");
              }
              btn.setAttribute("data-variant", "outline");
            }, 1600);
            try {
              await navigator.clipboard.writeText(md);
            } catch (e) {
              var ta = document.createElement("textarea");
              ta.value = md;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand("copy");
              } catch (e2) {}
              ta.remove();
            }
          });
        });
      })();

      /* ── 右侧目录：扫描 #doc 的 h2/h3 生成条目，指示条随滚动滑动到当前节。
   移植自 VitePress 的 outline：scroll（throttle 100ms）+ 标题绝对位置比较。
   标题加 data-toc-skip 可豁免；点击时立即定位指示条，平滑滚动途中不跟跳。 ── */
      (function () {
        var doc = document.getElementById("doc");
        var aside = document.querySelector(".toc");
        if (!doc || !aside) return;
        var list = aside.querySelector(".toc-list");
        var marker = aside.querySelector(".toc-marker");
        var headings = Array.from(doc.querySelectorAll("h2, h3")).filter(
          function (h) {
            /* 组件容器内的标题不是节标题：卡片头的 h3、折叠面板的标题都不得进目录。
               否则统计数字写成标题时会产出「7」「91 → 39」这类孤儿条目（anti-patterns.md #1）。 */
            return (
              !h.closest("[data-toc-skip]") &&
              !h.closest("[data-md-skip]") &&
              !h.closest(
                ".card, .fig-box, .alert, .item, .accordion, .dialog, .empty"
              )
            );
          }
        );
        if (headings.length < 2) return;

        /* h3 嵌进前一个 h2 的子列表；没有前置 h2 的 h3 按顶层处理 */
        var n = 0,
          sub = null;
        headings.forEach(function (h) {
          if (!h.id) h.id = "toc-" + ++n;
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.className = "toc-link";
          a.href = "#" + h.id;
          a.textContent = a.title = h.textContent.trim();
          li.appendChild(a);
          if (h.tagName === "H2" || !sub) {
            list.appendChild(li);
            sub = null;
            if (h.tagName === "H2") {
              sub = document.createElement("ul");
              sub.className = "toc-list nested";
              li.appendChild(sub);
            }
          } else {
            sub.appendChild(li);
          }
        });
        document.body.classList.add("has-toc");

        var mq = matchMedia("(min-width: 80rem)");
        var prev = null,
          skipOnce = false;

        function topOf(el) {
          var t = 0;
          while (el !== document.body) {
            if (el === null)
              return NaN; /* display:none 的元素拿不到位置，自然被过滤 */
            t += el.offsetTop;
            el = el.offsetParent;
          }
          return t;
        }

        function activate(hash) {
          if (prev) prev.classList.remove("active");
          prev = null;
          if (hash) {
            var links = list.querySelectorAll("a");
            for (var i = 0; i < links.length; i++) {
              if (links[i].getAttribute("href") === hash) {
                prev = links[i];
                break;
              }
            }
          }
          if (prev) {
            prev.classList.add("active");
            /* 链接的 offsetParent 是 .toc-list，指示条的参照是 .toc-inner，两者原点要补齐 */
            marker.style.top =
              prev.offsetTop +
              (prev.offsetParent ? prev.offsetParent.offsetTop : 0) +
              (prev.offsetHeight - marker.offsetHeight) / 2 +
              "px";
            marker.style.opacity = "1";
          } else {
            marker.style.top = "";
            marker.style.opacity = "0";
          }
        }

        var geom =
          null; /* 缓存的标题几何：resize 后失效，滚动时不再逐个读 offsetTop */
        function measure() {
          geom = headings
            .map(function (h) {
              return {
                id: h.id,
                top: topOf(h),
                sm: parseFloat(getComputedStyle(h).scrollMarginTop) || 0,
              };
            })
            .filter(function (x) {
              return !isNaN(x.top);
            })
            .sort(function (a, b) {
              return a.top - b.top;
            });
        }

        function setActive() {
          if (!mq.matches) return;
          if (skipOnce) {
            skipOnce = false;
            return;
          }
          if (!geom) measure();
          var items = geom;
          if (!items.length) return activate(null);
          if (scrollY < 1) return activate(null); /* 页顶：无激活项 */
          if (
            Math.ceil(scrollY + innerHeight) >=
            document.documentElement.scrollHeight
          )
            return activate(
              "#" + items[items.length - 1].id
            ); /* 页底：激活最后一项 */
          var active = null;
          for (var i = 0; i < items.length; i++) {
            if (items[i].top > scrollY + items[i].sm + 4) break;
            active = items[i].id;
          }
          activate(active ? "#" + active : null);
        }

        aside.addEventListener("click", function (e) {
          var a = e.target instanceof Element ? e.target.closest("a") : null;
          if (a && a.hash) {
            skipOnce = true;
            activate(a.hash);
          }
        });
        var ticking = false;
        addEventListener(
          "scroll",
          function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {
              ticking = false;
              setActive();
            });
          },
          { passive: true }
        );
        addEventListener("resize", function () {
          geom = null;
          setActive();

          "load",
          setActive
        ); /* 等浏览器恢复滚动位置后再定位一次 */
        mq.addEventListener("change", setActive);
        setActive();
      })();

    <script>

        // ════ G3 · Chunky Bars ════
        (() => {

          const D = [

          reveal($("c3"), (s) => {

                x: x - W / 2,
                y: base - h,
                width: W,
                height: h,
                rx: W / 2,
                fill: ri === 0 ? HERO : LAD[ri],
                class: "rise",

              txt(
                s,
                {
                  x,
                  y: base - h - 12,
                  "font-size": 13,
                  "font-weight": 600,
                  fill: ri === 0 ? HERO : INK,

                  "font-weight": 600,

        })();

        // ════ G4 · Dot Waffle ════
        (() => {
          // 点阵华夫：一点 = 1%，从左上读起；饼图的默认替代。主角 = 最大来源。

        // ════ G5 · Pictorial Bar ════
        (() => {
          // 象形柱：一棵树 = 一万棵。整树可数，末尾按余数裁一棵；淡树 = 尚未种到的容量。

            const x0 = 56,
              SW = 19,
              SH = 24,
              y0 = (i) => 18 + i * 58;
            years.forEach((yr, i) => {
              const y = y0(i),

        // ════ G6 · Circular Graph ════
        (() => {
          // 小环形网络：十个团队围成环，弧线 = 共享项目，线宽 = 数量。hover 一个节点只留它的邻接。
          const teams = [
            ["Product", 52],
            ["Design", 38],
            ["Frontend", 46],
            ["Backend", 44],
            ["Data", 30],
            ["Growth", 34],
            ["Support", 22],
            ["Ops", 18],
            ["Legal", 9],
            ["Finance", 12],
          ];
          const links = [
            [0, 1, 9],
            [0, 2, 8],
            [0, 3, 7],
            [1, 2, 9],
            [2, 3, 6],
            [3, 4, 7],
            [0, 5, 6],
            [5, 4, 5],
            [5, 6, 4],
            [6, 2, 3],
            [7, 3, 4],

          reveal($("circular"), (s) => {

              const p = el(gl, "path", {

              p.dataset.a = a;
              p.dataset.b = b;
              return p;
            });
            teams.forEach(([n, v], i) => {
              const [x, y] = P[i];
              const g = el(gn, "g", { class: "net-node", tabindex: 0 });
              g.dataset.i = i;
              el(g, "circle", {
                cx: x,
                cy: y,

                class: "pop",
                style: `animation-delay:${i * 0.06}s`,
              });
              const c = Math.cos((-90 + i * 36) * D2R);
              txt(
                g,
                {
                  x: x + c * (Math.sqrt(v) * 1.6 + 6),
                  y:
                    y +
                    Math.sin((-90 + i * 36) * D2R) * (Math.sqrt(v) * 1.6 + 6) +

                    "hot",

                      links.some(
                        ([a, b]) =>
                          (a === i && b === +o.dataset.i) ||
                          (b === i && a === +o.dataset.i)
                      )
                  )
                );
              };
              const blur = () => {
                s.classList.remove("focused");
                s.querySelectorAll(".hot").forEach((o) =>
                  o.classList.remove("hot")
                );
              };
              g.addEventListener("mouseenter", focus);
              g.addEventListener("focus", focus);
              g.addEventListener("mouseleave", blur);
              g.addEventListener("blur", blur);

        // ════ G7 · Tree LR ════
        (() => {

                cx: X1,
                cy: by,
                r: 4,
                fill: shade,
                class: "pop",

        // ════ G8 · Rainfall Dual Area ════
        (() => {
          // 雨落双面积：上半从顶往下落的是投放（因），下半从底往上长的是注册（果）。同一根时间轴。
          const flow = [

            txt(

              {

                  x: x(i),

                  "text-anchor": "middle",

              )
            );
            txt(
              s,
              {
                x: X0,
                y: TOP + RH + 14,

                fill: I30,

        // ════ G9 · Scatter Morph ════
        (() => {
          // 同一批点三种视图轮播：散点（价格 × 满意度）→ 排名（收入）→ 环（份额）。点靠 transform 过渡飞行。
          const P12 = [
            ["Editor", 12, 9.1, 486],
            ["Boards", 18, 8.4, 391],
            ["Forms", 9, 8.8, 274],
            ["Docs", 15, 8.0, 318],
            ["Chat", 7, 7.2, 182],

          reveal($("morph"), (s, { keep, motion }) => {
            const order = [...P12]
              .map((d, i) => [d[3], i])
              .sort((a, b) => b[0] - a[0])
              .map((d) => d[1]);
            const shade = (i) =>
              L[Math.min(5, Math.floor(order.indexOf(i) / 2))];
            const total = P12.reduce((a, d) => a + d[3], 0);
            const guides = el(s, "g", { class: "morph-guides" });
            const items = P12.map((d, i) => {
              const g = el(s, "g", { class: "morph-item" });
              const c = el(g, "circle", {
                r: Math.sqrt(d[3]) * 0.7,
                fill: shade(i),
              });
              tip(c, `${d[0]} — $${d[1]} · CSAT ${d[2]} · $${d[3]}K`);
              const t = txt(
                g,
                {
                  y: -Math.sqrt(d[3]) * 0.7 - 5,
                  "font-size": 8.5,
                  fill: MUTED,
                  "text-anchor": "middle",
                },
                d[0]
              );
              return { g, c, t };
            });
            const VIEWS = [
              {
                name: "PRICE × CSAT",
                place: (i) => {
                  const d = P12[i];
                  return [
                    40 + ((d[1] - 5) / 21) * 320,
                    270 - ((d[2] - 6) / 3.6) * 220,
                  ];
                },
                guide: () => {
                  el(guides, "line", {
                    x1: 40,
                    y1: 270,
                    x2: 360,
                    y2: 270,
                    stroke: GRID,
                  });
                  el(guides, "line", {
                    x1: 40,
                    y1: 270,
                    x2: 40,
                    y2: 50,
                    stroke: GRID,
                  });
                  txt(
                    guides,

          const hubs = [["Core API", 52, 0]];
          const apps = [
            ["Slack", 34, 1],
            ["GitHub", 30, 1],
            ["Figma", 22, 1],
            ["Notion", 26, 1],

            ["Drive", 16, 1],

              H = 320,

                n,
                v,
                t,
                r: 4 + Math.sqrt(v) * 1.4,
                x: W / 2 + Math.cos(i) * (i ? 90 : 0),
                y: H / 2 + Math.sin(i) * (i ? 90 : 0),
                vx: 0,
                vy: 0,
              }));
            const L2 = [
              ...apps.map((a, i) => [i + 1, 0, 60 + (2 - a[2]) * 10]),
              [1, 2, 70],
              [2, 5, 70],
              [3, 4, 70],
              [11, 9, 70],
            ];
            const gl = el(s, "g", {}),
              gn = el(s, "g", {});
            const les = L2.map(([a, b]) =>
              el(gl, "line", {
                stroke: I30,
                "stroke-width": b === 0 ? Math.max(0.8, nodes[a].v * 0.06) : 1,
                opacity: 0.6,

            const ns = nodes.map((d, i) => {
              const g = el(gn, "g", { class: "force-node", tabindex: 0 });
              el(g, "circle", {
                r: d.r,
                fill: d.t === 0 ? HERO : d.t === 1 ? INK : I45,

              tip(g, `${d.n} — ${d.v}k syncs/mo`);
              txt(
                g,
                {
                  x: d.r + 5,
                  y: 3.5,
                  "font-size": d.t === 0 ? 10.5 : 9,
                  "font-weight": 600,
                  fill: d.t === 0 ? INK : I60,
                },
                d.n
              );
              return g;
            });
            const step = () => {
              // 斥力 ∝ 1/d²（沿单位向量），软化半径 20px；向心 + 弹簧；限速防爆
              nodes.forEach((a, i) => {
                nodes.forEach((b, j) => {
                  if (j <= i) return;
                  let dx = b.x - a.x,
                    dy = b.y - a.y;
                  const d2 = dx * dx + dy * dy + 400,
                    f = 8000 / (d2 * Math.sqrt(d2));
                  dx *= f;
                  dy *= f;
                  a.vx -= dx;
                  a.vy -= dy;
                  b.vx += dx;
                  b.vy += dy;
                });
                a.vx += (W / 2 - a.x) * 0.02;
                a.vy += (H / 2 - a.y) * 0.02;
              });
              L2.forEach(([a, b, len]) => {
                const A = nodes[a],
                  B = nodes[b],
                  dx = B.x - A.x,
                  dy = B.y - A.y,
                  d = Math.hypot(dx, dy) || 1,
                  f = (d - len) * 0.03;
                A.vx += (dx / d) * f;
                A.vy += (dy / d) * f;
                B.vx -= (dx / d) * f;
                B.vy -= (dy / d) * f;
              });
              nodes.forEach((n) => {
                if (n.drag) return;
                n.vx *= 0.8;
                n.vy *= 0.8;
                const sp = Math.hypot(n.vx, n.vy);
                if (sp > 10) {
                  n.vx *= 10 / sp;
                  n.vy *= 10 / sp;
                }
                n.x = Math.min(W - 20, Math.max(20, n.x + n.vx));
                n.y = Math.min(H - 20, Math.max(20, n.y + n.vy));
              });
            };
            const draw = () => {
              les.forEach((l, k) => {
                const [a, b] = L2[k];
                l.setAttribute("x1", nodes[a].x);
                l.setAttribute("y1", nodes[a].y);
                l.setAttribute("x2", nodes[b].x);
                l.setAttribute("y2", nodes[b].y);
              });
              ns.forEach((g, i) =>
                g.setAttribute(
                  "transform",
                  `translate(${nodes[i].x.toFixed(1)} ${nodes[i].y.toFixed(1)})`
                )
              );
            };
            let it = 0;
            const loop = () => {
              step();
              draw();
              if (++it < 240 || nodes.some((n) => n.drag))
                keep(requestAnimationFrame(loop));
            };
            if (motion) keep(requestAnimationFrame(loop));
            else {
              for (let k = 0; k < 300; k++) step();
              draw();
            }
            // 拖拽：pointer 事件，拖动中冻结该节点，松手继续松弛
            const pt = s.createSVGPoint();
            const toSvg = (e) => {
              pt.x = e.clientX;
              pt.y = e.clientY;
              return pt.matrixTransform(s.getScreenCTM().inverse());
            };
            ns.forEach((g, i) => {
              g.style.cursor = "grab";
              g.addEventListener("pointerdown", (e) => {
                nodes[i].drag = true;
                g.setPointerCapture(e.pointerId);
                it = 0;
                const mv = (ev) => {
                  const p = toSvg(ev);
                  nodes[i].x = p.x;
                  nodes[i].y = p.y;
                  if (!motion) draw();
                };
                const up = () => {
                  nodes[i].drag = false;
                  g.removeEventListener("pointermove", mv);
                  g.removeEventListener("pointerup", up);
                  if (motion) keep(requestAnimationFrame(loop));
                };
                g.addEventListener("pointermove", mv);
                g.addEventListener("pointerup", up);
                if (motion) keep(requestAnimationFrame(loop));
              });
            });
          });

        // ════ G17 · Dynamic Stream ════

          reveal($("gstream"), (s, { keep, motion }) => {
            const WIN = 50,
              X0 = 16,
              X1 = 330,
              Y0 = 200,
              H = 150,
              MIN = 20,
              MAX = 130;
            let t = 0,
              v = 64;
            const data = [];
            for (; t < WIN; t++) {
              v = Math.max(30, v + (rnd(t + 1, 7) - 0.48) * 9);
              data.push(Math.round(v));
            }
            const area = el(s, "path", { fill: I14 }),
              line = el(s, "path", {
                fill: "none",
                stroke: INK,
                "stroke-width": 2,
              });
            const dot = el(s, "circle", { r: 4, fill: HERO }),
              lab = txt(
                s,
                { "font-size": 14, "font-weight": 600, fill: HERO },
                ""
              );
            el(s, "circle", {
              cx: 22,
              cy: 24,
              r: 4,
              fill: HERO,
              class: motion ? "blink" : "",
            });
            txt(
              s,
              {
                x: 32,
                y: 28,
                "font-size": 10,
                "font-weight": 600,
                fill: INK,
                "letter-spacing": ".1em",
              },
              motion ? "LIVE" : "PAUSED"
            );
            const draw = () => {
              const pts = data.map((d, i) => [
                X0 + (i / (WIN - 1)) * (X1 - X0),
                Y0 - ((d - MIN) / (MAX - MIN)) * H,
              ]);
              const path = pts
                .map(
                  (p, i) =>
                    (i ? "L" : "M") + p[0].toFixed(1) + " " + p[1].toFixed(1)
                )
                .join(" ");
              line.setAttribute("d", path);
              area.setAttribute("d", path + ` L${X1} ${Y0} L${X0} ${Y0} Z`);
              const [lx, ly] = pts[pts.length - 1];
              dot.setAttribute("cx", lx);
              dot.setAttribute("cy", ly);
              lab.setAttribute("x", lx + 10);
              lab.setAttribute("y", ly + 5);
              lab.textContent = data[data.length - 1] + "k";
            };
            draw();
            if (!motion) return;
            keep(
              setInterval(() => {
                v = Math.max(30, Math.min(125, v + (rnd(t + 1, 7) - 0.48) * 9));
                data.push(Math.round(v));
                data.shift();
                t++;
                draw();
              }, 300)
            );
          });
        })();

        // ════ G19 · Violin ════
        (() => {
          // 小提琴：提前聚合的密度剪影，Glance 世界观。
          // 四个 plan 各一把琴，宽度 = 该时长的工单密度（KDE），
          // 明度按中位数快慢排：越快越黑。纸色横档 = 中位数。
          const G = [
            ["ENT", 1.6, 0.8],
            ["PRO", 3.4, 1.6],
            ["STARTER", 6.2, 2.6],
            ["FREE", 9.5, 4.2],
          ];
          const M = 64;
          const samples = (g) =>
            Array.from({ length: M }, (_, i) => {
              const [, c, s] = G[g];
              const v =
                c +
                s *
                  (rnd(i + 1, g * 3 + 1) +
                    rnd(i + 7, g * 3 + 2) +
                    rnd(i + 13, g * 3 + 3) -
                    1.5);
              return Math.max(0.2, v);
            });
          reveal($("violin"), (s) => {
            const TOP = 40,
              BASE = 262,
              HMAX = 17;
            const mapY = (h) => BASE - (h / HMAX) * (BASE - TOP);
            const colX = (g) => 76 + g * 84;
            // hour grid
            [0, 4, 8, 12, 16].forEach((h) => {
              el(s, "line", {
                x1: 34,
                y1: mapY(h),
                x2: 378,
                y2: mapY(h),
                stroke: I8,
                "stroke-width": 0.8,
                class: "fade",
                style: `animation-delay:${h * 0.01}s`,
              });
              txt(
                s,
                {
                  x: 28,
                  y: mapY(h) + 3,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "end",
                  class: "fade",
                  style: `animation-delay:${h * 0.01}s`,
                },
                h + "h"
              );
            });
            const SHADE = [INK, I70, I45, I30];
            G.forEach(([name], g) => {
              const vs = samples(g).sort((a, b) => a - b);
              const med = vs[Math.floor(M / 2)];
              // fuller bandwidth = the classic rounded violin belly, not a spindle
              const bw = Math.max(0.9, G[g][2] * 0.72);
              // pad past the data by 1.6 bandwidths so the density decays to ~0 and the
              // ends taper naturally — clipping tighter gives flat-cut lantern ends
              const lo = Math.max(0, vs[0] - bw * 1.6),
                hi = Math.min(HMAX, vs[M - 1] + bw * 1.6);
              const NPTS = 44;
              const grid = Array.from(
                { length: NPTS },
                (_, k) => lo + (k / (NPTS - 1)) * (hi - lo)
              );
              const dens = grid.map((h) =>
                vs.reduce(
                  (a, v) => a + Math.exp(-((h - v) ** 2) / (2 * bw * bw)),
                  0
                )
              );
              const dmax = Math.max(...dens);
              const W = 30;
              const x = colX(g);
              // smooth closed outline through the mirrored density — quadratic
              // midpoint smoothing, same trick as almanac's blob
              const pts = [];
              grid.forEach((h, k) =>
                pts.push([x + (dens[k] / dmax) * W, mapY(h)])
              );
              for (let k = NPTS - 1; k >= 0; k--)
                pts.push([x - (dens[k] / dmax) * W, mapY(grid[k])]);
              let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
              for (let t = 0; t < pts.length; t++) {
                const p = pts[t],
                  q = pts[(t + 1) % pts.length];
                d += ` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`;
              }
              const body = el(s, "path", {
                d: d + " Z",
                fill: SHADE[g],
                class: "fade",
                style: `animation-delay:${g * 0.14}s`,
              });
              tip(body, `${name} — median ${med.toFixed(1)}h to first reply`);
              // median: paper tick across the body, value parked right
              const mk = Math.round(((med - lo) / (hi - lo)) * (NPTS - 1));
              const wAtMed =
                (dens[Math.max(0, Math.min(NPTS - 1, mk))] / dmax) * W;
              el(s, "line", {
                x1: x - wAtMed,
                y1: mapY(med),
                x2: x + wAtMed,
                y2: mapY(med),
                stroke: PAPER,
                "stroke-width": 2.2,
                class: "fade",
                style: `animation-delay:${0.5 + g * 0.14}s`,
              });
              txt(
                s,
                {
                  x: x + W + 5,
                  y: mapY(med) + 3,
                  "font-size": 9.5,
                  "font-weight": 600,
                  fill: INK,
                  class: "fade",
                  style: `animation-delay:${0.6 + g * 0.14}s`,
                },
                med.toFixed(1) + "h"
              );
              txt(
                s,
                {
                  x,
                  y: BASE + 18,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "middle",
                  "letter-spacing": ".08em",
                  class: "fade",
                  style: `animation-delay:${g * 0.14}s`,
                },
                name
              );
            });
            txt(
              s,
              {
                x: 200,
                y: 306,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.1s",

              "WIDTH = HOW MANY TICKETS WAIT THAT LONG · PAPER TICK = MEDIAN · DARKEST = FASTEST"

        })();

              });
            });
            txt(
              s,

        // ════ G22 · Aggregate Sankey ════
        (() => {

          // 缎带宽度∝账号数。左渠道右套餐，缎带按渠道明度分。
          // 交叉处必须读得清，缎带走 .5 透明度（同 convergence 连线的处理）。
          const SRC = [
            ["SEARCH", [20, 10, 4]],
            ["REFERRAL", [12, 9, 6]],
            ["SOCIAL", [12, 4, 2]],
            ["PAID", [6, 3, 3]],
            ["OTHER", [5, 2, 2]],
          ];
          const DST = ["FREE", "PRO", "TEAM"];
          const SH = [INK, I70, I45, I30, I22];
          reveal($("sankey"), (s) => {
            const XL = 104,
              XR = 298,
              Y0 = 34,
              SC = 1.9,
              GAPL = 8,
              GAPR = 22,
              MID = (XL + XR) / 2;
            const srcTot = SRC.map((d) => d[1].reduce((a, b) => a + b, 0));
            const dstTot = DST.map((_, j) =>
              SRC.reduce((a, d) => a + d[1][j], 0)
            );
            const sy = [],
              dy = [];
            let y = Y0;
            srcTot.forEach((t, i) => {
              sy[i] = y;
              y += t * SC + GAPL;
            });
            y = Y0 + 2;
            dstTot.forEach((t, j) => {
              dy[j] = y;
              y += t * SC + GAPR;
            });
            const syc = [...sy],
              dyc = [...dy];
            SRC.forEach((d, i) => {
              d[1].forEach((v, j) => {
                if (!v) return;
                const sa = syc[i],
                  sb = sa + v * SC,
                  da = dyc[j],
                  db = da + v * SC;
                syc[i] = sb;
                dyc[j] = db;
                const rib = el(s, "path", {
                  d: `M${XL} ${sa} C${MID} ${sa} ${MID} ${da} ${XR} ${da} L${XR} ${db} C${MID} ${db} ${MID} ${sb} ${XL} ${sb} Z`,
                  fill: SH[i],
                  opacity: 0.5,
                  class: "fade",
                  style: `animation-delay:${0.2 + (i * 3 + j) * 0.06}s`,
                });
                tip(rib, `${SRC[i][0]} → ${DST[j]} — ${v} accounts of 100`);
              });
            });
            SRC.forEach((d, i) => {
              el(s, "rect", {
                x: XL - 9,
                y: sy[i],
                width: 9,
                height: srcTot[i] * SC,
                rx: 4,
                fill: SH[i],
                class: "fade",
                style: `animation-delay:${i * 0.06}s`,
              });
              txt(
                s,
                {
                  x: XL - 16,
                  y: sy[i] + (srcTot[i] * SC) / 2 + 2.5,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: I70,
                  "text-anchor": "end",
                  "letter-spacing": ".05em",
                  class: "fade",
                  style: `animation-delay:${i * 0.06}s`,
                },
                `${d[0]} · ${srcTot[i]}`
              );
            });
            DST.forEach((n, j) => {
              el(s, "rect", {
                x: XR,
                y: dy[j],
                width: 9,
                height: dstTot[j] * SC,
                rx: 4,
                fill: I14,
                class: "fade",
                style: `animation-delay:${0.1 + j * 0.06}s`,
              });
              txt(
                s,
                {
                  x: XR + 16,
                  y: dy[j] + (dstTot[j] * SC) / 2 - 3,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: I70,
                  "letter-spacing": ".05em",
                  class: "fade",
                  style: `animation-delay:${0.15 + j * 0.06}s`,
                },
                n
              );
              txt(
                s,
                {
                  x: XR + 16,
                  y: dy[j] + (dstTot[j] * SC) / 2 + 9,
                  "font-size": 10,
                  "font-weight": 600,
                  fill: INK,
                  class: "fade",
                  style: `animation-delay:${0.2 + j * 0.06}s`,
                },
                dstTot[j]
              );
            });
            txt(
              s,
              {
                x: 200,
                y: 302,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.1s",
              },
              "RIBBON WIDTH = ACCOUNTS OF 100 · SHADE = CHANNEL"
            );
          });
        })();
      })();
    </script>
  </body>
</html>
