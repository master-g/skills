    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>

      <!-- 右侧目录：骨架 JS 自动生成条目；条目不足 2 个时整块不出现，不要手写 -->

    <!--SHOW-ME:JS-->
    <script>
      (() => {
        const { el, txt, tip, rnd, pol, sect, blob, reveal, fmt } = showMeChart;
        const $ = (id) => document.getElementById(id);
        const INK = "var(--ink)",
          PAPER = "var(--paper)",
          HERO = "var(--chart-hero)";
        const I90 = "var(--ink-90)",
          I70 = "var(--ink-70)",
          I60 = "var(--ink-60)",
          I45 = "var(--ink-45)",
          I30 = "var(--ink-30)",
          I22 = "var(--ink-22)",
          I14 = "var(--ink-14)",
          I8 = "var(--ink-8)";
        const MUTED = I45,
          GRID = I14,
          FAINT = I22;
        const LAD = [INK, I70, I45, I30, I22]; // 5 级：少系列
        const L = [INK, I90, I70, I60, I45, I30, I22]; // 7 级：多系列
        const D2R = Math.PI / 180;
        const dl = (s) => `animation-delay:${s.toFixed(3)}s`; // 交错入场延迟
        const halo =
          "paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round"; // 文字描边遮线

        // ════ G3 · Chunky Bars ════
        (() => {
          // 粗柱：四根胶囊柱，值写在柱顶。明度按排名，主角 = 最高一根。
          const D = [
            ["STARTER", 182],
            ["PRO", 486],
            ["TEAM", 391],
            ["ENT", 274],
          ];
          reveal($("c3"), (s) => {
            const max = Math.max(...D.map((d) => d[1])),
              base = 270,
              x0 = (i) => 70 + i * 88,
              W = 44;
            const rank = [...D].sort((a, b) => b[1] - a[1]).map((d) => d[0]);
            el(s, "line", {
              x1: 30,
              y1: base + 0.5,
              x2: 370,
              y2: base + 0.5,
              stroke: GRID,
              "stroke-width": 0.8,
            });
            D.forEach(([name, v], i) => {
              const h = (v / max) * 210,
                x = x0(i),
                ri = rank.indexOf(name);
              const r = el(s, "rect", {
                x: x - W / 2,
                y: base - h,
                width: W,
                height: h,
                rx: W / 2,
                fill: ri === 0 ? HERO : LAD[ri],
                class: "rise",
                style: `transform-origin:${x}px ${base}px;animation-delay:${i * 0.11}s`,
              });
              tip(r, `${name} — $${v}K MRR`);
              txt(
                s,
                {
                  x,
                  y: base - h - 12,
                  "font-size": 13,
                  "font-weight": 600,
                  fill: ri === 0 ? HERO : INK,
                  "text-anchor": "middle",
                  class: "fade",
                  style: `animation-delay:${0.4 + i * 0.11}s`,
                },
                "$" + v + "K"
              );
              txt(
                s,
                {
                  x,
                  y: base + 18,
                  "font-size": 9,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "middle",
                  "letter-spacing": ".08em",
                  class: "fade",
                },
                name
              );
            });
          });
        })();

        // ════ G4 · Dot Waffle ════
        (() => {
          // 点阵华夫：一点 = 1%，从左上读起；饼图的默认替代。主角 = 最大来源。
          const D = [
            ["Search", 34],
            ["Referral", 27],
            ["Social", 18],
            ["Partners", 12],
            ["Paid", 9],
          ];
          reveal($("waffle"), (s) => {
            const COLS = 10,
              CELL = 21,
              R = 7.5,
              X0 = 8,
              Y0 = 10;
            let idx = 0;
            D.forEach(([name, v], g) => {
              for (let k = 0; k < v; k++) {
                const c = idx + k,
                  row = Math.floor(c / COLS),
                  col = c % COLS;
                el(s, "circle", {
                  cx: X0 + col * CELL + R,
                  cy: Y0 + row * CELL + R,
                  r: R,
                  fill: g === 0 ? HERO : LAD[g],
                  class: "pop",
                  style: `animation-delay:${c * 0.008 + g * 0.05}s`,
                });
              }
              idx += v;
            });
            D.forEach(([name, v], g) => {
              const y = 26 + g * 40;
              el(s, "circle", { cx: 246, cy: y, r: 6, fill: LAD[g] });
              const n = el(s, "text", {
                x: 260,
                y: y - 1,
                "font-size": 10.5,
                "font-weight": 600,
                fill: INK,
              });
              n.textContent = name;
              const val = el(s, "text", {
                x: 260,
                y: y + 13,
                "font-size": 15,
                "font-weight": 600,
                fill: g === 0 ? HERO : g < 2 ? INK : I45,
              });
              val.textContent = v + "%";
            });
          });
        })();

        // ════ G5 · Pictorial Bar ════
        (() => {
          // 象形柱：一棵树 = 一万棵。整树可数，末尾按余数裁一棵；淡树 = 尚未种到的容量。
          const TREE =
            "M20,0 L38,28 L29,28 L40,46 L26,46 L26,58 L14,58 L14,46 L0,46 L11,28 L2,28 Z";
          const years = ["2022", "2023", "2024", "2025", "2026"],
            vals = [26, 41, 63, 88, 117],
            CAP = 13;
          reveal($("forest"), (s) => {
            const defs = el(s, "defs", {});
            const sym = el(defs, "symbol", {
              id: "tree-sym",
              viewBox: "0 0 40 58",
            });
            el(sym, "path", { d: TREE });
            const x0 = 56,
              SW = 19,
              SH = 24,
              y0 = (i) => 18 + i * 58;
            years.forEach((yr, i) => {
              const y = y0(i),
                n = vals[i] / 10,
                full = Math.floor(n),
                frac = n - full,
                shade = L[Math.max(0, 4 - i)];
              txt(
                s,
                {
                  x: 44,
                  y: y + SH / 2 + 4,
                  "font-size": 10.5,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "end",
                  class: "fade",
                },
                yr
              );
              for (let k = 0; k < CAP; k++)
                el(s, "use", {
                  href: "#tree-sym",
                  x: x0 + k * (SW + 3),
                  y,
                  width: SW,
                  height: SH,
                  fill: I14,
                  class: "fade",
                  style: `animation-delay:${i * 0.12}s`,
                });
              for (let k = 0; k < full; k++)
                el(s, "use", {
                  href: "#tree-sym",
                  x: x0 + k * (SW + 3),
                  y,
                  width: SW,
                  height: SH,
                  fill: i === years.length - 1 ? HERO : shade,
                  class: "pop",
                  style: `animation-delay:${i * 0.12 + k * 0.03}s`,
                });
              if (frac > 0) {
                const cp = el(defs, "clipPath", { id: "tree-clip" + i });
                el(cp, "rect", {
                  x: x0 + full * (SW + 3),
                  y,
                  width: SW * frac,
                  height: SH,
                });
                el(s, "use", {
                  href: "#tree-sym",
                  x: x0 + full * (SW + 3),
                  y,
                  width: SW,
                  height: SH,
                  fill: i === years.length - 1 ? HERO : shade,
                  "clip-path": `url(#tree-clip${i})`,
                  class: "pop",
                  style: `animation-delay:${i * 0.12 + full * 0.03}s`,
                });
              }
              const lab = txt(
                s,
                {
                  x: x0 + CAP * (SW + 3) + 8,
                  y: y + SH / 2 + 4,
                  "font-size": 12,
                  "font-weight": 600,
                  fill: i === years.length - 1 ? HERO : INK,
                  class: "fade",
                  style: `animation-delay:${0.5 + i * 0.12}s`,
                },
                vals[i] + "k"
              );
              tip(lab, `${yr} — ${vals[i]}k trees`);
            });
            txt(
              s,
              {
                x: 200,
                y: 312,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1s",
              },
              "ONE TREE = 10K PLANTED · FAINT = ROOM TO GROW"
            );
          });
        })();

        // ════ G6 · Circular Graph ════
        (() => {
          // 小环形网络：十个团队围成环，弧线 = 共享项目，线宽 = 数量。hover 一个节点只留它的邻接。
          const teams = [
            ["Product", 52],
            ["Design", 38],
            ["Frontend", 46],
            ["Backend", 44],
            ["Data", 30],
            ["Growth", 34],
            ["Support", 22],
            ["Ops", 18],
            ["Legal", 9],
            ["Finance", 12],
          ];
          const links = [
            [0, 1, 9],
            [0, 2, 8],
            [0, 3, 7],
            [1, 2, 9],
            [2, 3, 6],
            [3, 4, 7],
            [0, 5, 6],
            [5, 4, 5],
            [5, 6, 4],
            [6, 2, 3],
            [7, 3, 4],
            [7, 9, 3],
            [8, 9, 2],
            [0, 8, 2],
            [4, 2, 4],
            [1, 5, 3],
          ];
          reveal($("circular"), (s) => {
            const cx = 200,
              cy = 160,
              R = 112,
              P = teams.map((t, i) => pol(cx, cy, R, -90 + i * 36));
            const gl = el(s, "g", {}),
              gn = el(s, "g", {});
            const les = links.map(([a, b, w], k) => {
              const [xa, ya] = P[a],
                [xb, yb] = P[b];
              const p = el(gl, "path", {
                d: `M${xa} ${ya} Q${cx} ${cy} ${xb} ${yb}`,
                fill: "none",
                stroke: I45,
                "stroke-width": w * 0.5,
                opacity: 0.55,
                pathLength: 1,
                class: "draw net-link",
                style: `animation-delay:${0.3 + k * 0.04}s`,
              });
              p.dataset.a = a;
              p.dataset.b = b;
              return p;
            });
            teams.forEach(([n, v], i) => {
              const [x, y] = P[i];
              const g = el(gn, "g", { class: "net-node", tabindex: 0 });
              g.dataset.i = i;
              el(g, "circle", {
                cx: x,
                cy: y,
                r: Math.sqrt(v) * 1.6,
                fill: i < 4 ? INK : i < 8 ? I45 : I22,
                class: "pop",
                style: `animation-delay:${i * 0.06}s`,
              });
              const c = Math.cos((-90 + i * 36) * D2R);
              txt(
                g,
                {
                  x: x + c * (Math.sqrt(v) * 1.6 + 6),
                  y:
                    y +
                    Math.sin((-90 + i * 36) * D2R) * (Math.sqrt(v) * 1.6 + 6) +
                    3,
                  "font-size": 9,
                  "font-weight": 600,
                  fill: I60,
                  "text-anchor":
                    Math.abs(c) < 0.3 ? "middle" : c > 0 ? "start" : "end",
                  class: "fade",
                  style: `animation-delay:${0.2 + i * 0.06}s`,
                },
                n
              );
              tip(g, `${n} — ${v} people`);
              const focus = () => {
                s.classList.add("focused");
                les.forEach((p) =>
                  p.classList.toggle(
                    "hot",
                    +p.dataset.a === i || +p.dataset.b === i
                  )
                );
                gn.querySelectorAll(".net-node").forEach((o) =>
                  o.classList.toggle(
                    "hot",
                    +o.dataset.i === i ||
                      links.some(
                        ([a, b]) =>
                          (a === i && b === +o.dataset.i) ||
                          (b === i && a === +o.dataset.i)
                      )
                  )
                );
              };
              const blur = () => {
                s.classList.remove("focused");
                s.querySelectorAll(".hot").forEach((o) =>
                  o.classList.remove("hot")
                );
              };
              g.addEventListener("mouseenter", focus);
              g.addEventListener("focus", focus);
              g.addEventListener("mouseleave", blur);
              g.addEventListener("blur", blur);
            });
          });
        })();

        // ════ G7 · Tree LR ════
        (() => {
          // 左右树：根在左，四个分支，十三片叶。曲线连接，同分支同明度。
          const ROOT = {
            name: "Platform",
            kids: [
              ["Editor", ["Blocks", "Tables", "Comments", "History"], L[0]],
              ["Automate", ["Workflows", "Triggers", "Webhooks"], L[2]],
              ["Collaborate", ["Spaces", "Guests", "Mentions"], L[3]],
              ["Integrate", ["API", "Slack", "GitHub"], L[4]],
            ],
          };
          reveal($("tree"), (s) => {
            const X0 = 82,
              X1 = 200,
              X2 = 312,
              leafN = ROOT.kids.reduce((a, k) => a + k[1].length, 0),
              LH = (300 - 20) / leafN;
            const link = (xa, ya, xb, yb, shade, d) =>
              el(s, "path", {
                d: `M${xa} ${ya} C${(xa + xb) / 2} ${ya} ${(xa + xb) / 2} ${yb} ${xb} ${yb}`,
                fill: "none",
                stroke: shade,
                "stroke-width": 1.3,
                pathLength: 1,
                class: "draw",
                style: `animation-delay:${d}s;animation-duration:.7s`,
              });
            let li = 0;
            const branchY = [];
            ROOT.kids.forEach(([name, leaves, shade], bi) => {
              const ys = leaves.map(() => 20 + li++ * LH + LH / 2),
                by = ys.reduce((a, b) => a + b, 0) / ys.length;
              branchY.push(by);
              leaves.forEach((leaf, k) => {
                link(X1, by, X2, ys[k], shade, 0.5 + bi * 0.15 + k * 0.05);
                el(s, "circle", {
                  cx: X2,
                  cy: ys[k],
                  r: 3.2,
                  fill: shade,
                  class: "pop",
                  style: `animation-delay:${0.9 + bi * 0.15 + k * 0.05}s`,
                });
                txt(
                  s,
                  {
                    x: X2 + 9,
                    y: ys[k] + 3.2,
                    "font-size": 9.5,
                    fill: MUTED,
                    class: "fade",
                    style: `animation-delay:${1 + bi * 0.15 + k * 0.05}s`,
                  },
                  leaf
                );
              });
              el(s, "circle", {
                cx: X1,
                cy: by,
                r: 4,
                fill: shade,
                class: "pop",
                style: `animation-delay:${0.4 + bi * 0.15}s`,
              });
              txt(
                s,
                {
                  x: X1 - 9,
                  y: by + 3.5,
                  "font-size": 10,
                  "font-weight": 600,
                  fill: I60,
                  "text-anchor": "end",
                  class: "fade",
                  style: `animation-delay:${0.45 + bi * 0.15}s`,
                },
                name
              );
            });
            const ry = 160;
            branchY.forEach((by, bi) =>
              link(X0, ry, X1, by, I22, 0.1 + bi * 0.1)
            );
            el(s, "circle", {
              cx: X0,
              cy: ry,
              r: 5.5,
              fill: INK,
              class: "pop",
            });
            txt(
              s,
              {
                x: X0 - 11,
                y: ry + 4,
                "font-size": 11.5,
                "font-weight": 600,
                fill: INK,
                "text-anchor": "end",
                class: "fade",
              },
              ROOT.name
            );
          });
        })();

        // ════ G8 · Rainfall Dual Area ════
        (() => {
          // 雨落双面积：上半从顶往下落的是投放（因），下半从底往上长的是注册（果）。同一根时间轴。
          const flow = [
            42, 45, 44, 48, 52, 55, 53, 58, 64, 62, 66, 71, 69, 75, 82, 79, 84,
            80, 86, 92, 88, 95, 91, 97, 104, 101, 108, 105, 112, 118,
          ];
          const rain = [
            2, 0, 4, 8, 3, 0, 6, 12, 7, 3, 9, 15, 6, 2, 11, 5, 8, 14, 4, 9, 6,
            13, 3, 7, 10, 5, 12, 8, 15, 6,
          ];
          reveal($("rainfall"), (s) => {
            const X0 = 44,
              X1 = 386,
              x = (i) => X0 + (i / 29) * (X1 - X0),
              TOP = 14,
              RH = 80,
              BOT = 290,
              FH = 150;
            const peak = flow.indexOf(Math.max(...flow));
            [0, 6, 12, 18].forEach((v) => {
              const y = TOP + (v / 18) * RH;
              el(s, "line", {
                x1: X0,
                y1: y,
                x2: X1,
                y2: y,
                stroke: GRID,
                "stroke-width": 0.6,
                "stroke-dasharray": "2 3",
              });
              txt(
                s,
                {
                  x: X0 - 6,
                  y: y + 3,
                  "font-size": 8,
                  fill: I30,
                  "text-anchor": "end",
                },
                "$" + v + "K"
              );
            });
            rain.forEach((v, i) => {
              const h = (v / 18) * RH;
              if (!v) return;
              el(s, "rect", {
                x: x(i) - 4,
                y: TOP,
                width: 8,
                height: h,
                rx: 2,
                fill: I30,
                class: "rise",
                style: `transform-origin:${x(i)}px ${TOP}px;animation-delay:${i * 0.03}s`,
              });
            });
            const fy = (v) => BOT - (v / 120) * FH;
            const d = flow
              .map(
                (v, i) =>
                  (i ? "L" : "M") + x(i).toFixed(1) + " " + fy(v).toFixed(1)
              )
              .join(" ");
            el(s, "path", {
              d: d + ` L${X1} ${BOT} L${X0} ${BOT} Z`,
              fill: I14,
              class: "fade",
              style: "animation-delay:.4s",
            });
            el(s, "path", {
              d,
              fill: "none",
              stroke: INK,
              "stroke-width": 2,

        // ════ G11 · Force Graph ════
        (() => {
          // 小力导向：一个中心加十二颗卫星，弹簧 + 斥力 + 向心，rAF 收敛；节点可拖。
          const hubs = [["Core API", 52, 0]];
          const apps = [
            ["Slack", 34, 1],
            ["GitHub", 30, 1],
            ["Figma", 22, 1],
            ["Notion", 26, 1],
            ["Linear", 18, 1],
            ["Drive", 16, 1],
            ["Zoom", 10, 2],
            ["Jira", 14, 2],
            ["Sheets", 12, 2],
            ["Intercom", 8, 2],
            ["Stripe", 20, 1],
            ["Segment", 9, 2],
          ];
          reveal($("force"), (s, { keep, motion }) => {
            const W = 400,
              H = 320,
              nodes = [...hubs, ...apps].map(([n, v, t], i) => ({
                n,
                v,
                t,
                r: 4 + Math.sqrt(v) * 1.4,
                x: W / 2 + Math.cos(i) * (i ? 90 : 0),
                y: H / 2 + Math.sin(i) * (i ? 90 : 0),
                vx: 0,
                vy: 0,
              }));
            const L2 = [
              ...apps.map((a, i) => [i + 1, 0, 60 + (2 - a[2]) * 10]),
              [1, 2, 70],
              [2, 5, 70],
              [3, 4, 70],
              [11, 9, 70],
            ];
            const gl = el(s, "g", {}),
              gn = el(s, "g", {});
            const les = L2.map(([a, b]) =>
              el(gl, "line", {
                stroke: I30,
                "stroke-width": b === 0 ? Math.max(0.8, nodes[a].v * 0.06) : 1,
                opacity: 0.6,
              })
            );
            const ns = nodes.map((d, i) => {
              const g = el(gn, "g", { class: "force-node", tabindex: 0 });
              el(g, "circle", {
                r: d.r,
                fill: d.t === 0 ? HERO : d.t === 1 ? INK : I45,
              });
              tip(g, `${d.n} — ${d.v}k syncs/mo`);
              txt(
                g,
                {
                  x: d.r + 5,
                  y: 3.5,
                  "font-size": d.t === 0 ? 10.5 : 9,
                  "font-weight": 600,
                  fill: d.t === 0 ? INK : I60,
                },
                d.n
              );
              return g;
            });
            const step = () => {
              // 斥力 ∝ 1/d²（沿单位向量），软化半径 20px；向心 + 弹簧；限速防爆
              nodes.forEach((a, i) => {
                nodes.forEach((b, j) => {
                  if (j <= i) return;
                  let dx = b.x - a.x,
                    dy = b.y - a.y;
                  const d2 = dx * dx + dy * dy + 400,
                    f = 8000 / (d2 * Math.sqrt(d2));
                  dx *= f;
                  dy *= f;
                  a.vx -= dx;
                  a.vy -= dy;
                  b.vx += dx;
                  b.vy += dy;
                });
                a.vx += (W / 2 - a.x) * 0.02;
                a.vy += (H / 2 - a.y) * 0.02;
              });
              L2.forEach(([a, b, len]) => {
                const A = nodes[a],
                  B = nodes[b],
                  dx = B.x - A.x,
                  dy = B.y - A.y,
                  d = Math.hypot(dx, dy) || 1,
                  f = (d - len) * 0.03;
                A.vx += (dx / d) * f;
                A.vy += (dy / d) * f;
                B.vx -= (dx / d) * f;
                B.vy -= (dy / d) * f;
              });
              nodes.forEach((n) => {
                if (n.drag) return;
                n.vx *= 0.8;
                n.vy *= 0.8;
                const sp = Math.hypot(n.vx, n.vy);
                if (sp > 10) {
                  n.vx *= 10 / sp;
                  n.vy *= 10 / sp;
                }
                n.x = Math.min(W - 20, Math.max(20, n.x + n.vx));
                n.y = Math.min(H - 20, Math.max(20, n.y + n.vy));
              });
            };
            const draw = () => {
              les.forEach((l, k) => {
                const [a, b] = L2[k];
                l.setAttribute("x1", nodes[a].x);
                l.setAttribute("y1", nodes[a].y);
                l.setAttribute("x2", nodes[b].x);
                l.setAttribute("y2", nodes[b].y);
              });
              ns.forEach((g, i) =>
                g.setAttribute(
                  "transform",
                  `translate(${nodes[i].x.toFixed(1)} ${nodes[i].y.toFixed(1)})`
                )
              );
            };
            let it = 0;
            const loop = () => {
              step();
              draw();
              if (++it < 240 || nodes.some((n) => n.drag))
                keep(requestAnimationFrame(loop));
            };
            if (motion) keep(requestAnimationFrame(loop));
            else {
              for (let k = 0; k < 300; k++) step();
              draw();
            }
            // 拖拽：pointer 事件，拖动中冻结该节点，松手继续松弛
            const pt = s.createSVGPoint();
            const toSvg = (e) => {
              pt.x = e.clientX;
              pt.y = e.clientY;
              return pt.matrixTransform(s.getScreenCTM().inverse());
            };
            ns.forEach((g, i) => {
              g.style.cursor = "grab";
              g.addEventListener("pointerdown", (e) => {
                nodes[i].drag = true;
                g.setPointerCapture(e.pointerId);
                it = 0;
                const mv = (ev) => {
                  const p = toSvg(ev);
                  nodes[i].x = p.x;
                  nodes[i].y = p.y;
                  if (!motion) draw();
                };
                const up = () => {
                  nodes[i].drag = false;
                  g.removeEventListener("pointermove", mv);
                  g.removeEventListener("pointerup", up);
                  if (motion) keep(requestAnimationFrame(loop));
                };
                g.addEventListener("pointermove", mv);
                g.addEventListener("pointerup", up);
                if (motion) keep(requestAnimationFrame(loop));
              });
            });
          });
        })();

        // ════ G15 · Jitter Strip ════

        // ════ G19 · Violin ════
        (() => {
          // 小提琴：提前聚合的密度剪影，Glance 世界观。
          // 四个 plan 各一把琴，宽度 = 该时长的工单密度（KDE），
          // 明度按中位数快慢排：越快越黑。纸色横档 = 中位数。
          const G = [
            ["ENT", 1.6, 0.8],
            ["PRO", 3.4, 1.6],
            ["STARTER", 6.2, 2.6],
            ["FREE", 9.5, 4.2],
          ];
          const M = 64;
          const samples = (g) =>
            Array.from({ length: M }, (_, i) => {
              const [, c, s] = G[g];
              const v =
                c +
                s *
                  (rnd(i + 1, g * 3 + 1) +
                    rnd(i + 7, g * 3 + 2) +
                    rnd(i + 13, g * 3 + 3) -
                    1.5);
              return Math.max(0.2, v);
            });
          reveal($("violin"), (s) => {
            const TOP = 40,
              BASE = 262,
              HMAX = 17;
            const mapY = (h) => BASE - (h / HMAX) * (BASE - TOP);
            const colX = (g) => 76 + g * 84;
            // hour grid
            [0, 4, 8, 12, 16].forEach((h) => {
              el(s, "line", {
                x1: 34,
                y1: mapY(h),
                x2: 378,
                y2: mapY(h),
                stroke: I8,
                "stroke-width": 0.8,
                class: "fade",
                style: `animation-delay:${h * 0.01}s`,
              });
              txt(
                s,
                {
                  x: 28,
                  y: mapY(h) + 3,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "end",
                  class: "fade",
                  style: `animation-delay:${h * 0.01}s`,
                },
                h + "h"
              );
            });
            const SHADE = [INK, I70, I45, I30];
            G.forEach(([name], g) => {
              const vs = samples(g).sort((a, b) => a - b);
              const med = vs[Math.floor(M / 2)];
              // fuller bandwidth = the classic rounded violin belly, not a spindle
              const bw = Math.max(0.9, G[g][2] * 0.72);
              // pad past the data by 1.6 bandwidths so the density decays to ~0 and the
              // ends taper naturally — clipping tighter gives flat-cut lantern ends
              const lo = Math.max(0, vs[0] - bw * 1.6),
                hi = Math.min(HMAX, vs[M - 1] + bw * 1.6);
              const NPTS = 44;
              const grid = Array.from(
                { length: NPTS },
                (_, k) => lo + (k / (NPTS - 1)) * (hi - lo)
              );
              const dens = grid.map((h) =>
                vs.reduce(
                  (a, v) => a + Math.exp(-((h - v) ** 2) / (2 * bw * bw)),
                  0
                )
              );
              const dmax = Math.max(...dens);
              const W = 30;
              const x = colX(g);
              // smooth closed outline through the mirrored density — quadratic
              // midpoint smoothing, same trick as almanac's blob
              const pts = [];
              grid.forEach((h, k) =>
                pts.push([x + (dens[k] / dmax) * W, mapY(h)])
              );
              for (let k = NPTS - 1; k >= 0; k--)
                pts.push([x - (dens[k] / dmax) * W, mapY(grid[k])]);
              let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
              for (let t = 0; t < pts.length; t++) {
                const p = pts[t],
                  q = pts[(t + 1) % pts.length];
                d += ` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`;
              }
              const body = el(s, "path", {
                d: d + " Z",
                fill: SHADE[g],
                class: "fade",
                style: `animation-delay:${g * 0.14}s`,
              });
              tip(body, `${name} — median ${med.toFixed(1)}h to first reply`);
              // median: paper tick across the body, value parked right
              const mk = Math.round(((med - lo) / (hi - lo)) * (NPTS - 1));
              const wAtMed =
                (dens[Math.max(0, Math.min(NPTS - 1, mk))] / dmax) * W;
              el(s, "line", {
                x1: x - wAtMed,
                y1: mapY(med),
                x2: x + wAtMed,
                y2: mapY(med),
                stroke: PAPER,
                "stroke-width": 2.2,
                class: "fade",
                style: `animation-delay:${0.5 + g * 0.14}s`,
              });
              txt(
                s,
                {
                  x: x + W + 5,
                  y: mapY(med) + 3,
                  "font-size": 9.5,
                  "font-weight": 600,
                  fill: INK,
                  class: "fade",
                  style: `animation-delay:${0.6 + g * 0.14}s`,
                },
                med.toFixed(1) + "h"
              );
              txt(
                s,
                {
                  x,
                  y: BASE + 18,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "middle",
                  "letter-spacing": ".08em",
                  class: "fade",
                  style: `animation-delay:${g * 0.14}s`,
                },
                name
              );
            });
            txt(
              s,
              {
                x: 200,
                y: 306,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.1s",
              },
              "WIDTH = HOW MANY TICKETS WAIT THAT LONG · PAPER TICK = MEDIAN · DARKEST = FASTEST"

        })();

                q
              )
            );
            rows.forEach(([p, rk], i) => {
              const y = Y0 + i * PY,
                hero = p === "Flows";
              txt(
                s,
                {
                  x: X0 - 12,
                  y: y + C / 2 + 3,
                  "font-size": 8.5,
                  "font-weight": hero ? 800 : 600,
                  fill: hero ? INK : I60,
                  "text-anchor": "end",
                  class: "fade",
                  style: `animation-delay:${i * 0.07}s`,
                },
                p
              );
              rk.forEach((r, q) => {
                const dark = r <= 2;
                const cell = el(s, "rect", {
                  x: X0 + q * PX,
                  y,
                  width: C,
                  height: C,
                  rx: 8,
                  fill: SHADE[r - 1],
                  stroke: I14,
                  "stroke-width": 0.5,
                  class: "pop",
                  style: `animation-delay:${i * 0.07 + q * 0.035}s`,
                });
                tip(cell, `${p} — #${r} in Q${q + 1}`);
                txt(
                  s,
                  {
                    x: X0 + q * PX + C / 2,
                    y: y + C / 2 + 3.5,
                    "font-size": 9.5,
                    "font-weight": 600,
                    fill: dark ? PAPER : I70,
                    "text-anchor": "middle",
                    class: "fade",
                    style: `animation-delay:${0.1 + i * 0.07 + q * 0.035}s`,
                  },
                  r
                );
              });
              // arrival flag: climbed / fell / held, told at the row's end
              const d = rk[0] - rk[5];
              txt(
                s,
                {
                  x: X0 + 6 * PX + 8,
                  y: y + C / 2 + 3,
                  "font-size": 8,
                  "font-weight": 600,
                  fill: d > 0 ? INK : d < 0 ? I30 : I22,
                  class: "fade",
                  style: `animation-delay:${0.5 + i * 0.07}s`,
                },
                d > 0 ? "▲" + d : d < 0 ? "▼" + -d : "—"
              );
            });
            txt(
              s,
              {
                x: 200,
                y: 308,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.1s",
              },
              "CELL = RANK THAT QUARTER · #1 WEARS BLACK · READ EACH ROW LIKE A FILMSTRIP"
            );
          });
        })();

        // ════ G22 · Aggregate Sankey ════
        (() => {
          // 聚合桑基：左列 = 进线渠道，右列 = 结单方式；一条缎带 = 一个「渠道 → 结单」组合，宽 ∝ 工单数，
          // 两端结柱高 = 该节点合计，与缎带同一比例。缎带颜色按渠道的明度阶（量最大的最深），实心；
          // 每条缎带下垫一道卡片色描边，交叉处靠这道缝分开，不靠透明度。
          // 主角 = 标题所指的「电话 → 转二线」：它不是最宽的一条，几何上没凸显，才上主角色。
          // 悬停缎带看这一路，悬停 / Tab 节点看整束，点击钉住，点空白或 Esc 释放；读数写在状态栏。
          const { G, tick, label } = showMeChart;
          const SRC = ["在线客服", "电话", "邮件", "应用内反馈", "社区"],
            DST = ["一线解决", "转二线", "转研发", "无回复关闭"];
          // FLOW[渠道][结单] = 工单数
          const FLOW = [
            [372, 88, 34, 26],
            [118, 156, 22, 14],
            [128, 52, 30, 30],
            [86, 28, 48, 18],
            [34, 10, 30, 16],
          ];
          const HOT = [1, 1]; // 电话 → 转二线
          const RIBBON_INK = [G.ink.strong, I70, I45, I30, I22];
          const links = [];
          FLOW.forEach((row, i) =>
            row.forEach((n, j) => links.push({ i, j, n }))
          );
          const srcSum = FLOW.map((r) => r.reduce((a, b) => a + b, 0)),
            dstSum = DST.map((_, j) => FLOW.reduce((a, r) => a + r[j], 0)),
            total = srcSum.reduce((a, b) => a + b, 0);
          const pct = (a, b) => `${Math.round((a / b) * 100)}%`;
          let release = () => {};
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") release();
          });
          reveal($("ticketflow"), (s) => {
            const XL = 102,
              XR = 292,
              BAR = 5,
              Y0 = 36,
              Y1 = 300,
              GAP = 12;
            const k =
              (Y1 - Y0 - GAP * (Math.max(SRC.length, DST.length) - 1)) / total;
            // 两列各自竖直居中；节点顶端 y
            const stack = (sums) => {
              const h =
                sums.reduce((a, v) => a + v * k, 0) + GAP * (sums.length - 1);
              let y = Y0 + (Y1 - Y0 - h) / 2;
              return sums.map((v) => {
                const top = y;
                y += v * k + GAP;
                return top;
              });
            };
            const sTop = stack(srcSum),
              dTop = stack(dstSum);
            // 缎带在两端结柱里的位置：左端按结单顺序排，右端按渠道顺序排，交叉最少
            const sOff = srcSum.map(() => 0),
              dOff = dstSum.map(() => 0);
            links.forEach((l) => {
              l.w = l.n * k;
              l.y0 = sTop[l.i] + sOff[l.i] + l.w / 2;
              sOff[l.i] += l.w;
              l.y1 = dTop[l.j] + dOff[l.j] + l.w / 2;
              dOff[l.j] += l.w;
              const a = XL + BAR,
                b = XR,
                m = (a + b) / 2;
              l.d = `M${a} ${l.y0.toFixed(2)}C${m} ${l.y0.toFixed(2)} ${m} ${l.y1.toFixed(2)} ${b} ${l.y1.toFixed(2)}`;
            });
            txt(
              s,
              tick({ x: XL + BAR, y: 18, "text-anchor": "end" }),
              `进线 · ${fmt(total)} 张`
            );
            txt(s, tick({ x: XR, y: 18 }), "结单方式");
            // 宽的先画，窄的压在上面才看得见；缎带颜色放在外层分组，.net-link.hot 的主角色才盖得上
            const card = "var(--color-card)";
            const order = [...links].sort((p, q) => q.w - p.w);
            order.forEach((l) => {
              const g = el(s, "g", {
                fill: "none",
                stroke:
                  l.i === HOT[0] && l.j === HOT[1] ? HERO : RIBBON_INK[l.i],
                class: "fade",
                style: dl(0.15 + l.i * 0.08),
              });
              l.case = el(g, "path", {
                d: l.d,
                stroke: card,
                "stroke-width": l.w + 1.2,
                class: "net-link",
              });
              l.el = el(g, "path", {
                d: l.d,
                "stroke-width": l.w,
                class: "net-link",
              });
            });
            // 热区：细缎带至少 7 宽，窄的在上
            const gHit = el(s, "g", {
              fill: "none",
              stroke: "transparent",
              "pointer-events": "stroke",
            });
            [...order].reverse().forEach((l) => {
              l.hit = el(gHit, "path", {
                d: l.d,
                "stroke-width": Math.max(l.w, 7),
                class: "hit",
              });
            });
            // 结柱与标签：渠道在左、结单在右
            const node = (x, top, n, side, name, sub, fill) => {
              const g = el(s, "g", { class: "net-node", tabindex: 0 });
              const inner = el(g, "g", { class: "fade", style: dl(0.05) });
              el(inner, "rect", {
                x,
                y: top,
                width: BAR,
                height: Math.max(n * k, 1),
                rx: 1,
                fill,
              });
              const at = {
                x: side < 0 ? x - 5 : x + BAR + 5,
                "text-anchor": side < 0 ? "end" : "start",
              };
              const cy = top + (n * k) / 2;
              txt(inner, label({ ...at, y: cy - 1 }), name);
              txt(inner, tick({ ...at, y: cy + 8 }), sub);
              return g;
            };
            const sNodes = SRC.map((name, i) =>
              node(
                XL,
                sTop[i],
                srcSum[i],
                -1,
                name,
                fmt(srcSum[i]),
                RIBBON_INK[i]
              )
            );
            const dNodes = DST.map((name, j) =>
              node(
                XR,
                dTop[j],
                dstSum[j],
                1,
                name,
                `${fmt(dstSum[j])} · ${pct(dstSum[j], total)}`,
                G.ink.quiet
              )
            );

            // ── 交互：cur = 钉住优先，其次悬停；["l", 缎带] / ["s", 渠道] / ["d", 结单]
            const bar = s.closest("figure").querySelector(".fig-status"),
              sText = bar.querySelector("[data-text]"),
              sPin = bar.querySelector("[data-pin]");
            const put = (...parts) =>
              sText.replaceChildren(
                ...parts.map((v) =>
                  typeof v === "number"
                    ? Object.assign(document.createElement("b"), {
                        textContent: fmt(v),
                      })
                    : v
                )
              );
            let hov = null,
              pin = null;
            const show = () => {
              const cur = pin || hov;
              s.classList.toggle("focused", !!cur);
              sPin.textContent = pin ? "已钉住 · 点空白或 Esc 释放" : "";
              const on = (l) =>
                !!cur &&
                (cur[0] === "l"
                  ? l === cur[1]
                  : cur[0] === "s"
                    ? l.i === cur[1]
                    : l.j === cur[1]);
              links.forEach((l) => {
                l.el.classList.toggle("hot", on(l));
                l.case.classList.toggle("hot", on(l));
              });
              sNodes.forEach((g, i) =>
                g.classList.toggle(
                  "hot",
                  links.some((l) => l.i === i && on(l))
                )
              );
              dNodes.forEach((g, j) =>
                g.classList.toggle(
                  "hot",
                  links.some((l) => l.j === j && on(l))
                )
              );
              if (!cur) {
                const h = FLOW[HOT[0]][HOT[1]];
                put(
                  `${SRC[HOT[0]]} `,
                  srcSum[HOT[0]],
                  ` 张里 `,
                  h,
                  ` 张${DST[HOT[1]]} · ${pct(h, srcSum[HOT[0]])}`
                );
              } else if (cur[0] === "l") {
                const l = cur[1];
                put(
                  `${SRC[l.i]} → ${DST[l.j]} `,
                  l.n,
                  ` 张 · 占${SRC[l.i]} ${pct(l.n, srcSum[l.i])}`
                );
              } else if (cur[0] === "s") {
                const i = cur[1];
                put(
                  `${SRC[i]} `,
                  srcSum[i],
                  ` 张 · ` +
                    DST.map(
                      (d, j) => `${d} ${pct(FLOW[i][j], srcSum[i])}`
                    ).join("、")
                );
              } else {
                const j = cur[1];
                put(
                  `${DST[j]} `,
                  dstSum[j],
                  ` 张 · 来自 ` +
                    SRC.map((n, i) => [n, FLOW[i][j]])
                      .sort((a, b) => b[1] - a[1])
                      .slice(0, 3)
                      .map(([n, v]) => `${n} ${v}`)
                      .join("、")
                );
              }
            };
            const bind = (target, key, focusable) => {
              target.addEventListener(
                "mouseenter",
                () => ((hov = key), show())
              );
              target.addEventListener(
                "mouseleave",
                () => ((hov = null), show())
              );
              target.addEventListener("click", (e) => {
                e.stopPropagation();
                pin = key;
                show();
              });
              if (!focusable) return;
              target.addEventListener("focus", () => ((hov = key), show()));
              target.addEventListener("blur", () => ((hov = null), show()));
              target.addEventListener("keydown", (e) => {
                if (e.key !== "Enter" && e.key !== " ") return;
                e.preventDefault();
                pin = key;
                show();
              });
            };
            links.forEach((l) => bind(l.hit, ["l", l]));
            sNodes.forEach((g, i) => bind(g, ["s", i], true));
            dNodes.forEach((g, j) => bind(g, ["d", j], true));
            release = () => {
              pin = null;
              show();
            };
            s.onclick = release;
            show();
          });
        })();
      })();
    </script>
  </body>
</html>
