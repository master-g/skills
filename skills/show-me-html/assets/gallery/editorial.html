    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <script>
      /* ── 滑块填充 ──────────────────────────────────────────────────────
         轨道的已填充部分由 --slider-value 驱动。骨架始终同步这个变量，
         因而只使用滑块的页面不依赖条件内联的组件行为 JS。 */
      (function () {
        function sync(el) {
          var min = Number(el.min || 0),
            max = Number(el.max === "" ? 100 : el.max);
          var pct =
            max === min ? 0 : ((Number(el.value) - min) / (max - min)) * 100;
          el.style.setProperty("--slider-value", pct + "%");
        }
        document.querySelectorAll('input[type="range"]').forEach(sync);
        /* 事件委托：后插进来的滑块也照样跟着走 */
        document.addEventListener("input", function (e) {
          if (e.target.matches && e.target.matches('input[type="range"]'))
            sync(e.target);
        });
      })();
    </script>
    <script>
      /* ── 代码工具条：换行 / 复制 ──
         给每个 pre > code 注入两个按钮。工具条带 data-md-skip，导出 Markdown 时不出现。
         复制走 navigator.clipboard，失败时退回 execCommand；反馈先行，不等 promise。 */
      (function () {
        function mk(label, title) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.setAttribute("data-variant", "outline");
          b.title = title;
          b.textContent = label;
          return b;
        }
        function copyText(text) {
          try {
            return navigator.clipboard.writeText(text);
          } catch (e) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
            } catch (e2) {}
            ta.remove();
          }
        }
        document.querySelectorAll("pre > code").forEach(function (code) {
          var pre = code.parentNode;
          if (pre.querySelector(".code-tools")) return;
          var bar = document.createElement("div");
          bar.className = "code-tools";
          bar.setAttribute("data-md-skip", "");
          var wrap = mk("换行", "切换自动换行");
          wrap.setAttribute("aria-pressed", "false");
          wrap.addEventListener("click", function () {
            var on = pre.dataset.wrap !== "on";
            pre.dataset.wrap = on ? "on" : "off";
            wrap.setAttribute("aria-pressed", String(on));
          });
          var copy = mk("复制", "复制代码");
          copy.addEventListener("click", function () {
            copy.textContent = "已复制";
            setTimeout(function () {
              copy.textContent = "复制";
            }, 1600);
            copyText(code.textContent.replace(/\n$/, ""));
          });
          bar.appendChild(wrap);
          bar.appendChild(copy);
          pre.appendChild(bar);
        });
      })();
    </script>
    <script>
      /* ── 主题三态切换 ── */
      (function () {
        var root = document.documentElement;
        var mq = matchMedia("(prefers-color-scheme: dark)");
        function apply(t) {
          root.dataset.theme = t;
          root.classList.toggle(
            "dark",
            t === "dark" || (t === "system" && mq.matches)
          );
          document.querySelectorAll("[data-theme-set]").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.themeSet === t));
          });
        }
        document.querySelectorAll("[data-theme-set]").forEach(function (b) {
          b.addEventListener("click", function () {
            var t = b.dataset.themeSet;
            try {
              t === "system"
                ? localStorage.removeItem("show-me-theme")
                : localStorage.setItem("show-me-theme", t);
            } catch (e) {}
            apply(t);
          });
        });
        mq.addEventListener("change", function () {
          if (root.dataset.theme === "system") apply("system");
        });
        apply(root.dataset.theme || "system");
      })();

      /* ── 复制为 Markdown ──
   遍历 #doc（或 [data-md-root]）生成 GFM。跳过 [data-md-skip] / [hidden] / 脚本 / 弹层。 */
      (function () {
        var SKIP = new Set([
          "SCRIPT",
          "STYLE",
          "TEMPLATE",
          "DIALOG",
          "NOSCRIPT",
          "SVG",
          "CANVAS",
        ]);
        var INLINE_ONLY = new Set([
          "A",
          "CODE",
          "STRONG",
          "B",
          "EM",
          "I",
          "DEL",
          "S",
          "SPAN",
          "KBD",
          "SMALL",
          "ABBR",
          "MARK",
          "SUP",
          "SUB",
          "BR",
          "IMG",
          "TIME",
          "MATH",
          "U",
          "Q",
          "LABEL",
          "OUTPUT",
        ]);

        function skipped(el) {
          return (
            SKIP.has(el.tagName.toUpperCase()) ||
            el.hasAttribute("data-md-skip") ||
            el.hasAttribute("hidden") ||
            el.getAttribute("aria-hidden") === "true"
          );
        }
        function txt(s) {
          return (s || "").replace(/\s+/g, " ");
        }

        function inline(node) {
          var out = "";
          node.childNodes.forEach(function (n) {
            if (n.nodeType === 3) {
              out += txt(n.nodeValue);
              return;
            }
            if (n.nodeType !== 1 || skipped(n)) return;
            var t = n.tagName.toUpperCase(),
              inner = inline(n);
            if (t === "MATH") {
              /* 公式导出 LaTeX 源：build 编译时留下的 annotation；没有就退回可读文本 */
              var ann = n.querySelector(
                'annotation[encoding="application/x-tex"]'
              );
              var tex = ann
                ? ann.textContent.trim()
                : txt(n.textContent).trim();
              out +=
                n.getAttribute("display") === "block"
                  ? "\n\n$$" + tex + "$$\n\n"
                  : "$" + tex + "$";
              return;
            }
            if (t === "BR") out += "  \n";
            else if (t === "IMG")
              out +=
                "![" +
                (n.alt || "") +
                "](" +
                (n.getAttribute("src") || "") +
                ")";
            else if (
              t === "CODE" ||
              t === "KBD" ||
              n.classList.contains("badge") ||
              n.classList.contains("kbd")
            )
              out += inner.trim() ? "`" + inner.trim() + "`" : "";
            else if (t === "A") {
              var href = n.getAttribute("href") || "";
              out +=
                href && !href.startsWith("#")
                  ? "[" + inner.trim() + "](" + href + ")"
                  : inner;
            } else if (t === "STRONG" || t === "B")
              out += inner.trim() ? "**" + inner.trim() + "**" : "";
            else if (t === "EM" || t === "I")
              out += inner.trim() ? "*" + inner.trim() + "*" : "";
            else if (t === "DEL" || t === "S")
              out += inner.trim() ? "~~" + inner.trim() + "~~" : "";
            else out += inner;
          });
          return out;
        }

        function cell(el) {
          return inline(el).trim().replace(/\|/g, "\\|").replace(/\n/g, " ");
        }

        function table(el) {
          var rows = Array.from(el.querySelectorAll("tr")).filter(function (r) {
            return !skipped(r);
          });
          if (!rows.length) return "";
          /* 没有表头行的表：全部行当数据，列名留空占位 ——
             否则第一行数据会被当成表头，语义就错了 */
          var hasTh = !!rows[0].querySelector("th");
          var head = rows[0],
            body = hasTh ? rows.slice(1) : rows;
          var cols = Array.from(head.children).map(function (c, i) {
            return hasTh ? cell(c) : "列" + (i + 1);
          });
          var out =
            "| " +
            cols.join(" | ") +
            " |\n|" +
            cols
              .map(function () {
                return " --- ";
              })
              .join("|") +
            "|\n";
          body.forEach(function (r) {
            out += "| " + Array.from(r.children).map(cell).join(" | ") + " |\n";
          });
          return out;
        }

        function list(el, depth) {
          var ordered = el.tagName === "OL",
            i = 0,
            out = "";
          Array.from(el.children).forEach(function (li) {
            if (li.tagName !== "LI" || skipped(li)) return;
            i++;
            var marker = ordered ? i + ". " : "- ";
            var pad = "  ".repeat(depth);
            var sub = "";
            var own = document.createElement("div");
            Array.from(li.childNodes).forEach(function (n) {
              if (
                n.nodeType === 1 &&
                (n.tagName === "UL" || n.tagName === "OL")
              )
                /* 深层嵌套拍平到本级：GFM 对超过 4–5 层的子列表解析不稳，保内容齐整优先 */
                sub += list(n, depth < 6 ? depth + 1 : depth);
              else own.appendChild(n.cloneNode(true));
            });
            var text = inline(own).trim();
            if (text) out += pad + marker + text + "\n";
            out += sub;
          });
          return out;
        }

        function block(el, depth) {
          var out = "";
          Array.from(el.children).forEach(function (n) {
            if (skipped(n)) return;
            var t = n.tagName.toUpperCase();
            if (t === "SUMMARY")
              return; /* DETAILS 分支已单独输出，这里再走一遍会裸文本重复 */
            if (/^H[1-6]$/.test(t)) {
              out += "\n" + "#".repeat(+t[1]) + " " + inline(n).trim() + "\n\n";
            } else if (t === "P") {
              var s = inline(n).trim();
              if (s) out += s + "\n\n";
            } else if (t === "UL" || t === "OL") {
              out += list(n, 0) + "\n";
            } else if (t === "PRE") {
              var code = n.querySelector("code");
              var lang =
                (code &&
                  (code.className.match(/language-([\w+-]+)/) || [])[1]) ||
                "";
              out +=
                "```" +
                lang +
                "\n" +
                /* 取 code 的文本而不是 pre 的：pre 里还有骨架注入的工具条 */
                ((code || n).textContent || "").replace(/\n+$/, "") +
                "\n```\n\n";
            } else if (t === "TABLE") {
              out += table(n) + "\n";
            } else if (t === "MATH") {
              var ann2 = n.querySelector(
                'annotation[encoding="application/x-tex"]'
              );
              out +=
                "$$" +
                (ann2 ? ann2.textContent.trim() : txt(n.textContent).trim()) +
                "$$\n\n";
            } else if (t === "HR") {
              out += "---\n\n";
            } else if (t === "BLOCKQUOTE" || n.classList.contains("alert")) {
              out +=
                block(n, depth)
                  .trim()
                  .split("\n")
                  .map(function (l) {
                    return l ? "> " + l : ">";
                  })
                  .join("\n") + "\n\n";
            } else if (n.classList.contains("tabs")) {
              /* Markdown 没有标签页：每个标签导出成小标题 + 它的面板，隐藏的面板也要出。 */
              n.querySelectorAll('[role="tablist"] > [role="tab"]').forEach(
                function (tab) {
                  out += "**" + inline(tab).trim() + "**\n\n";
                  var panel = document.getElementById(
                    tab.getAttribute("aria-controls")
                  );
                  if (panel) out += block(panel, depth);
                }
              );
            } else if (t === "DETAILS") {
              var sum = n.querySelector("summary");
              if (sum) out += "**" + inline(sum).trim() + "**\n\n";
              out += block(n, depth);
            } else if (t === "DL") {
              Array.from(n.children).forEach(function (d) {
                if (d.tagName === "DT")
                  out += "**" + inline(d).trim() + "** — ";
                else if (d.tagName === "DD") out += inline(d).trim() + "\n\n";
              });
            } else if (
              n.children.length === 0 ||
              Array.from(n.children).every(function (c) {
                return INLINE_ONLY.has(c.tagName);
              })
            ) {
              var s2 = inline(n).trim();
              if (s2) out += s2 + "\n\n";
            } else {
              out += block(n, depth);
            }
          });
          return out;
        }

        function toMarkdown() {
          var root =
            document.querySelector("[data-md-root]") ||
            document.getElementById("doc") ||
            document.body;
          var md = block(root, 0)
            .replace(/\n{3,}/g, "\n\n")
            .trim();
          var title = document.title;
          /* 正文里只要有一级标题就不再拼 <title>：否则 eyebrow 段落排在 h1 前时，
             导出会得到两个「# 」（anti-patterns.md #2）。 */
          var hasH1 = /^# /m.test(md);
          return (hasH1 ? "" : "# " + title + "\n\n") + md + "\n";
        }

        /* 暴露给页面用：需要「下载 .md」之类的额外入口时调用它，不要另写一份转换器。 */
        window.showMeMarkdown = toMarkdown;

        document.querySelectorAll("[data-copy-md]").forEach(function (btn) {
          var icons = btn.querySelectorAll("svg, i");
          btn.addEventListener("click", async function () {
            var md = toMarkdown();
            /* 反馈先行：剪贴板图标换成对勾 1.6s。不等待 writeText —— 权限 pending 时它可能永不 settle。
         SVG 没有 hidden 反射属性，必须操作属性本身 */
            if (icons.length >= 2) {
              icons[0].setAttribute("hidden", "");
              icons[1].removeAttribute("hidden");
            }
            btn.setAttribute("data-variant", "secondary");
            setTimeout(function () {
              if (icons.length >= 2) {
                icons[0].removeAttribute("hidden");
                icons[1].setAttribute("hidden", "");
              }
              btn.setAttribute("data-variant", "outline");
            }, 1600);
            try {
              await navigator.clipboard.writeText(md);
            } catch (e) {
              var ta = document.createElement("textarea");
              ta.value = md;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand("copy");
              } catch (e2) {}
              ta.remove();
            }
          });
        });
      })();

      /* ── 右侧目录：扫描 #doc 的 h2/h3 生成条目，指示条随滚动滑动到当前节。
   移植自 VitePress 的 outline：scroll（throttle 100ms）+ 标题绝对位置比较。
   标题加 data-toc-skip 可豁免；点击时立即定位指示条，平滑滚动途中不跟跳。 ── */
      (function () {
        var doc = document.getElementById("doc");
        var aside = document.querySelector(".toc");
        if (!doc || !aside) return;
        var list = aside.querySelector(".toc-list");
        var marker = aside.querySelector(".toc-marker");
        var headings = Array.from(doc.querySelectorAll("h2, h3")).filter(
          function (h) {
            /* 组件容器内的标题不是节标题：卡片头的 h3、折叠面板的标题都不得进目录。
               否则统计数字写成标题时会产出「7」「91 → 39」这类孤儿条目（anti-patterns.md #1）。 */
            return (
              !h.closest("[data-toc-skip]") &&
              !h.closest("[data-md-skip]") &&
              !h.closest(
                ".card, .fig-box, .alert, .item, .accordion, .dialog, .empty"
              )
            );
          }
        );
        if (headings.length < 2) return;

        /* h3 嵌进前一个 h2 的子列表；没有前置 h2 的 h3 按顶层处理 */
        var n = 0,
          sub = null;
        headings.forEach(function (h) {
          if (!h.id) h.id = "toc-" + ++n;
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.className = "toc-link";
          a.href = "#" + h.id;
          a.textContent = a.title = h.textContent.trim();
          li.appendChild(a);
          if (h.tagName === "H2" || !sub) {
            list.appendChild(li);
            sub = null;
            if (h.tagName === "H2") {
              sub = document.createElement("ul");
              sub.className = "toc-list nested";
              li.appendChild(sub);
            }
          } else {
            sub.appendChild(li);
          }
        });
        document.body.classList.add("has-toc");

        var mq = matchMedia("(min-width: 80rem)");
        var prev = null,
          skipOnce = false;

        function topOf(el) {
          var t = 0;
          while (el !== document.body) {
            if (el === null)
              return NaN; /* display:none 的元素拿不到位置，自然被过滤 */
            t += el.offsetTop;
            el = el.offsetParent;
          }
          return t;
        }

        function activate(hash) {
          if (prev) prev.classList.remove("active");
          prev = null;
          if (hash) {
            var links = list.querySelectorAll("a");
            for (var i = 0; i < links.length; i++) {
              if (links[i].getAttribute("href") === hash) {
                prev = links[i];
                break;
              }
            }
          }
          if (prev) {
            prev.classList.add("active");
            /* 链接的 offsetParent 是 .toc-list，指示条的参照是 .toc-inner，两者原点要补齐 */
            marker.style.top =
              prev.offsetTop +
              (prev.offsetParent ? prev.offsetParent.offsetTop : 0) +
              (prev.offsetHeight - marker.offsetHeight) / 2 +
              "px";
            marker.style.opacity = "1";
          } else {
            marker.style.top = "";
            marker.style.opacity = "0";
          }
        }

        var geom =
          null; /* 缓存的标题几何：resize 后失效，滚动时不再逐个读 offsetTop */
        function measure() {
          geom = headings
            .map(function (h) {
              return {
                id: h.id,
                top: topOf(h),
                sm: parseFloat(getComputedStyle(h).scrollMarginTop) || 0,
              };
            })
            .filter(function (x) {
              return !isNaN(x.top);
            })
            .sort(function (a, b) {
              return a.top - b.top;
            });
        }

        function setActive() {
          if (!mq.matches) return;
          if (skipOnce) {
            skipOnce = false;
            return;
          }
          if (!geom) measure();
          var items = geom;
          if (!items.length) return activate(null);
          if (scrollY < 1) return activate(null); /* 页顶：无激活项 */
          if (
            Math.ceil(scrollY + innerHeight) >=
            document.documentElement.scrollHeight
          )
            return activate(
              "#" + items[items.length - 1].id
            ); /* 页底：激活最后一项 */
          var active = null;
          for (var i = 0; i < items.length; i++) {
            if (items[i].top > scrollY + items[i].sm + 4) break;
            active = items[i].id;
          }
          activate(active ? "#" + active : null);
        }

        aside.addEventListener("click", function (e) {
          var a = e.target instanceof Element ? e.target.closest("a") : null;
          if (a && a.hash) {
            skipOnce = true;
            activate(a.hash);
          }
        });
        var ticking = false;
        addEventListener(
          "scroll",
          function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {
              ticking = false;
              setActive();
            });
          },
          { passive: true }
        );
        addEventListener("resize", function () {
          geom = null;
          setActive();

        // ════ L2 · Dot Cascade ════
        (() => {

          reveal($("spectrum"), (s) => {
            // the ribbon first, underneath everything

            el(s, "circle", {
              cx: px,
              cy: py,
              r: pr + 3.6,
              fill: "none",
              stroke: INK,
              "stroke-width": 1,
              "stroke-dasharray": "2 3",
              class: "fade",
              style: "animation-delay:1s",
            });
            el(s, "path", {
              d: `M${px + pr + 6} ${py + 6} C${px + 34} ${py + 30} ${px + 52} ${py + 36} ${px + 72} ${py + 36}`,
              fill: "none",
              stroke: I30,
              "stroke-width": 0.7,
              class: "fade",
              style: "animation-delay:1.1s",
            });
            txt(
              s,
              {
                x: px + 78,
                y: py + 39,
                "font-size": 7,
                fill: I60,
                "font-style": "italic",
                class: "fade",
                style: "animation-delay:1.15s",
              },
              `the release-week spike — ${max} deploys in a day`
            );
            txt(
              s,
              {
                x: 420,
                y: 222,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.2s",
              },
              "ONE DOT = ONE DAY · DOT AREA = DEPLOYS · TINY DOT = A QUIET DAY"
            );
          });
        })();

        // ════ L19 · Ridgeline ════
        (() => {
          // 多组分布的 Lupi 皮：每行一条完成时长的密度山脊，面积由竖发丝组成
          // （F3 hairline area 的语法），行与行轻微重叠，后排画在前、前排糊上
          // 纸色 slab 遮挡（dotty matrix 的手法）。峰值点标中心时长。
          const ROWS = [
            ["MOBILE", 3.2, 1.3],
            ["DESKTOP", 5.1, 1.9],
            ["API", 7.4, 2.3],
            ["IMPORTS", 10.8, 3.2],
            ["BATCH", 15.2, 4],
          ];
          reveal($("ridge"), (s) => {
            const X0 = 92,
              X1 = 372,
              MAXH = 24,
              N = 72,
              LIFT = 54;
            const rowY = (i) => 96 + i * 44;
            ROWS.forEach(([name, c, sp], i) => {
              const y0 = rowY(i);
              const dens = Array.from({ length: N }, (_, k) => {
                const h = (k / (N - 1)) * MAXH;
                return (
                  Math.exp(-((h - c) ** 2) / (2 * sp * sp)) +
                  0.26 * Math.exp(-((h - c * 2.1) ** 2) / (2 * (sp * 1.7) ** 2))
                );
              });
              const dmax = Math.max(...dens);
              const pts = dens.map((d, k) => [
                X0 + (k / (N - 1)) * (X1 - X0),
                y0 - (d / dmax) * LIFT,
              ]);
              const crest =
                "M" +
                pts
                  .map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1))
                  .join(" L ");
              el(s, "path", {
                d: crest + ` L${X1} ${y0} L${X0} ${y0} Z`,
                fill: PAPER,
                "fill-opacity": 0.96,
                class: "fade",
                style: `animation-delay:${i * 0.1}s`,
              });
              pts.forEach(([px, py], k) => {
                if (k % 2) return;
                el(s, "line", {
                  x1: px,
                  y1: y0,
                  x2: px,
                  y2: py,
                  stroke: I45,
                  "stroke-width": 0.5,
                  opacity: 0.28 + rnd(k + 1, i + 3) * 0.32,
                  class: "fade",
                  style: `animation-delay:${i * 0.1 + k * 0.004}s`,
                });
              });
              el(s, "path", {
                d: crest,
                fill: "none",
                stroke: INK,
                "stroke-width": 0.9,
                pathLength: 1,
                class: "draw",
                style: `animation-delay:${0.1 + i * 0.1}s;animation-duration:.8s`,
              });
              el(s, "line", {
                x1: X0,
                y1: y0,
                x2: X1,
                y2: y0,
                stroke: GRID,
                "stroke-width": 0.7,
                class: "fade",
                style: `animation-delay:${i * 0.1}s`,
              });
              const pk = dens.indexOf(dmax),
                [px, py] = pts[pk];
              const dot = el(s, "circle", {
                cx: px,
                cy: py,
                r: 2.6,
                fill: INK,
                class: "pop",
                style: `animation-delay:${0.6 + i * 0.1}s`,
              });
              tip(dot, `${name} — most runs finish around ${c.toFixed(1)}h`);
              txt(
                s,
                {
                  x: px + 7,
                  y: py + 1,
                  "font-size": 8,
                  "font-weight": 600,
                  fill: INK,
                  style: `paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:${0.7 + i * 0.1}s`,
                  class: "fade",
                },
                c.toFixed(1) + "h"
              );
              txt(
                s,
                {
                  x: X0 - 10,
                  y: y0 - 3,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: I60,
                  "text-anchor": "end",
                  "letter-spacing": ".06em",
                  class: "fade",
                  style: `animation-delay:${i * 0.1}s`,
                },
                name
              );
            });
            const yb = rowY(4);
            [0, 6, 12, 18, 24].forEach((h) => {
              const x = X0 + (h / MAXH) * (X1 - X0);
              el(s, "line", {
                x1: x,
                y1: yb + 4,
                x2: x,
                y2: yb + 9,
                stroke: I14,
                "stroke-width": 0.6,
                class: "fade",
                style: "animation-delay:.8s",
              });
              txt(
                s,
                {
                  x,
                  y: yb + 20,
                  "font-size": 7,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "middle",
                  class: "fade",
                  style: "animation-delay:.85s",
                },
                h + "h"
              );
            });
            txt(
              s,
              {
                x: 200,
                y: 308,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.1s",
              },
              "EACH CREST = ONE PIPELINE · THE AREA IS MADE OF HAIRLINES · DOT = THE PEAK"
            );
          });
        })();

        // ════ L20 · Parallel Coordinates ════
        (() => {
          // 多维记录对比的 Lupi 皮：一条发丝线 = 一个产品走过四根轴。
          // 线束的形状就是数据结构（哪两维相关、谁全线领先）。
          // 全线最优的上墨标名，其余发丝退后。轴顶名、轴脚 min/max。
          const DIMS = [
            ["PRICE $", 8, 30],
            ["CSAT", 6, 9.6],
            ["RETENTION %", 55, 95],
            ["GROWTH %", -5, 40],
          ];
          const P = [
            ["Editor", 12, 9.1, 91, 22],
            ["Boards", 18, 8.4, 86, 18],
            ["Forms", 9, 8.8, 78, 31],
            ["Docs", 15, 8.0, 82, 12],
            ["Chat", 7, 7.2, 64, 8],
            ["Vault", 24, 7.8, 88, 6],
            ["Flows", 21, 8.6, 90, 38],
            ["Views", 11, 7.5, 71, 14],
            ["Sync", 16, 6.9, 58, -2],
            ["Pages", 8, 8.2, 74, 19],
            ["Grid", 19, 7.1, 62, 4],
            ["Hub", 13, 6.6, 52, 9],
          ];
          reveal($("parallel"), (s) => {
            const AX = [64, 156, 248, 340],
              TOP = 64,
              BOT = 252;
            const mapY = (di, v) => {
              const [, lo, hi] = DIMS[di];
              return BOT - ((v - lo) / (hi - lo)) * (BOT - TOP);
            };
            // hero: judged on csat+retention+growth (price is a fact, not a virtue)
            const score = (p) =>
              (p[2] - 6) / 3.6 + (p[3] - 55) / 40 + (p[4] + 5) / 45;
            const hero = P.reduce((a, b) => (score(b) > score(a) ? b : a));
            DIMS.forEach(([name, lo, hi], di) => {
              el(s, "line", {
                x1: AX[di],
                y1: TOP - 8,
                x2: AX[di],
                y2: BOT + 8,
                stroke: I30,
                "stroke-width": 1,
                class: "fade",
                style: `animation-delay:${di * 0.06}s`,
              });
              [[TOP - 8], [BOT + 8]].forEach(([yy]) =>
                el(s, "line", {
                  x1: AX[di] - 4,
                  y1: yy,
                  x2: AX[di] + 4,
                  y2: yy,
                  stroke: I30,
                  "stroke-width": 1,
                  class: "fade",
                  style: `animation-delay:${di * 0.06}s`,
                })
              );
              txt(
                s,
                {
                  x: AX[di],
                  y: TOP - 22,
                  "font-size": 7,
                  "font-weight": 600,
                  fill: I60,
                  "text-anchor": "middle",
                  "letter-spacing": ".08em",
                  class: "fade",
                  style: `animation-delay:${di * 0.06}s`,
                },
                name
              );
              txt(
                s,
                {
                  x: AX[di] + 8,
                  y: TOP - 5,
                  "font-size": 6.5,
                  "font-weight": 600,
                  fill: I22,
                  class: "fade",
                  style: `animation-delay:${0.1 + di * 0.06}s`,
                },
                hi
              );
              txt(
                s,
                {
                  x: AX[di] + 8,
                  y: BOT + 11,
                  "font-size": 6.5,
                  "font-weight": 600,
                  fill: I22,
                  class: "fade",
                  style: `animation-delay:${0.1 + di * 0.06}s`,
                },
                lo
              );
            });
            P.forEach((p, i) => {
              const isHero = p === hero;
              const ys = [
                mapY(0, p[1]),
                mapY(1, p[2]),
                mapY(2, p[3]),
                mapY(3, p[4]),
              ];
              let d = `M${AX[0]} ${ys[0].toFixed(1)}`;
              for (let k = 0; k < 3; k++) {
                const mx = (AX[k] + AX[k + 1]) / 2;
                d += ` C${mx} ${ys[k].toFixed(1)} ${mx} ${ys[k + 1].toFixed(1)} ${AX[k + 1]} ${ys[k + 1].toFixed(1)}`;
              }
              const ln = el(s, "path", {
                d,
                fill: "none",
                stroke: isHero ? INK : I45,
                "stroke-width": isHero ? 2 : 0.65,
                opacity: isHero ? 1 : 0.5 + rnd(i + 1, 5) * 0.3,
                pathLength: 1,
                class: "draw",
                style: `animation-delay:${0.2 + i * 0.05}s;animation-duration:.8s`,
              });
              tip(
                ln,
                `${p[0]} — $${p[1]} · CSAT ${p[2]} · ${p[3]}% retained · ${p[4]}% growth`
              );
              ys.forEach((y, di) =>
                el(s, "circle", {
                  cx: AX[di],
                  cy: y,
                  r: isHero ? 3 : 1.4,
                  fill: isHero ? INK : I45,
                  opacity: isHero ? 1 : 0.7,
                  class: "pop",
                  style: `animation-delay:${0.3 + i * 0.05 + di * 0.04}s`,
                })
              );
              if (isHero)
                txt(
                  s,
                  {
                    x: AX[3] + 12,
                    y: ys[3] + 3,
                    "font-size": 9,
                    "font-weight": 600,
                    fill: INK,
                    style: `paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1s`,
                    class: "fade",
                  },
                  p[0]
                );
            });
            txt(
              s,
              {
                x: 200,
                y: 302,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.2s",
              },
              "ONE HAIRLINE = ONE PRODUCT · INK = BEST ACROSS THE BOARD"
            );
          });
        })();
      })();
    </script>
  </body>
</html>
