    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <!--SHOW-ME:JS-->
    <script>
      (() => {
        const { el, txt, tip, rnd, pol, sect, blob, reveal, fmt } = showMeChart;
        const $ = (id) => document.getElementById(id);
        const INK = "var(--ink)",
          PAPER = "var(--paper)",
          HERO = "var(--chart-hero)";
        const I90 = "var(--ink-90)",
          I70 = "var(--ink-70)",
          I60 = "var(--ink-60)",
          I45 = "var(--ink-45)",
          I30 = "var(--ink-30)",
          I22 = "var(--ink-22)",
          I14 = "var(--ink-14)",
          I8 = "var(--ink-8)";
        const MUTED = I45,
          GRID = I14,
          FAINT = I22;
        const LAD = [INK, I70, I45, I30, I22]; // 5 级：少系列
        const L = [INK, I90, I70, I60, I45, I30, I22]; // 7 级：多系列
        const D2R = Math.PI / 180;
        const dl = (s) => `animation-delay:${s.toFixed(3)}s`; // 交错入场延迟
        const halo =
          "paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round"; // 文字描边遮线

        // ════ L1 · Launch Fan ════
        (() => {
          // 发射扇：一根辐条 = 一家店，辐条按开业先后依次排开。半径是日历：圆心一侧是 2024 年 1 月，
          // 最外一道弧是今天。大点落在开业那个月，面积 ∝ 现在的日均杯数（半径取 sqrt）；
          // 大点往外每个月一个小点，直到今天，所以辐条长 = 店龄。家具：每年一道虚线弧，今天一道实线弧。
          // 主角 = 标题所指的滨江店：杯量第二、辐条又短，几何上不凸显，大点与小点都上主角色、小点升一档。
          // 13 家店、两端有标注，静态即可；大点 hover 出开业月与杯数。
          const { G, jit, tick, label } = showMeChart;
          const NOW = 32; // 月序：0 = 2024 年 1 月，32 = 2026 年 9 月（今天）
          // [店名, 开业月序, 现在的日均杯数]，按开业先后
          const STORES = [
            ["人民广场", 2, 780],
            ["静安寺", 4, 690],
            ["徐家汇", 7, 610],
            ["五角场", 9, 540],
            ["陆家嘴", 12, 720],
            ["中山公园", 14, 430],
            ["七宝", 17, 380],
            ["张江", 19, 460],
            ["虹桥", 21, 350],
            ["滨江", 23, 740],
            ["大宁", 24, 300],
            ["前滩", 27, 410],
            ["松江", 30, 220],
          ];
          const STAR = "滨江";
          const ym = (m) =>
            `${2024 + Math.floor(m / 12)} 年 ${(m % 12) + 1} 月`;
          const most = Math.max(...STORES.map((r) => r[2]));
          reveal($("storefan"), (s) => {
            // 扇面：圆心在下方正中，辐条张开近 200°，最早的店在左
            const CX = 200,
              CY = 226,
              A0 = 177,
              A1 = 363,
              R0 = 62,
              R1 = 150,
              DOT = 8,
              RING_AT = 369,
              RING_ANCHOR = "start";
            // 标签水平摆放，按所在方位决定对齐
            const labelAt = (x, y, a) => {
              const c = Math.cos(a * D2R);
              return {
                x,
                y: y + 2.6,
                "text-anchor": c > 0.3 ? "start" : c < -0.3 ? "end" : "middle",
              };
            };
            const rAt = (m) => R0 + (m / NOW) * (R1 - R0),
              aAt = (i) => A0 + (i * (A1 - A0)) / (STORES.length - 1),
              P = (r, a) => pol(CX, CY, r, a);
            const arc = (r, a0, a1) => {
              const [x0, y0] = P(r, a0),
                [x1, y1] = P(r, a1);
              return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
            };
            // 年份弧：每年 1 月一道虚线；今天一道实线，标签放在扇面起点外侧
            [0, 12, 24].forEach((m) => {
              el(s, "path", {
                d: arc(rAt(m), A0 - 3, A1 + 3),
                fill: "none",
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              const [x, y] = P(rAt(m), RING_AT);
              txt(
                s,
                tick({ x, y: y + 2.2, "text-anchor": RING_ANCHOR }),
                `${2024 + m / 12}`
              );
            });
            el(s, "path", {
              d: arc(R1, A0 - 3, A1 + 3),
              fill: "none",
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            {
              const [x, y] = P(R1, RING_AT);
              txt(
                s,
                tick({ x, y: y + 2.2, "text-anchor": RING_ANCHOR }),
                "今天"
              );
            }
            STORES.forEach(([name, m, cups], i) => {
              const a = aAt(i),
                star = name === STAR,
                ink = star ? HERO : G.ink.data;
              // 辐条导轨：开业点到今天的一根发丝
              const [x0, y0] = P(rAt(m), a),
                [x1, y1] = P(R1, a);
              el(s, "line", {
                x1: x0,
                y1: y0,
                x2: x1,
                y2: y1,
                stroke: star ? HERO : G.ink.mass,
                "stroke-width": star ? G.line.data : G.line.grid,
                class: "fade",
                style: dl(0.2 + i * 0.04),
              });
              // 每月一点：只在垂直于辐条的方向上抖，月份位置不动
              for (let k = 1; k <= NOW - m; k++) {
                const [px, py] = P(rAt(m + k), a),
                  off = jit(i * 50 + k, 1, G.jitter.pos),
                  [ox, oy] = pol(0, 0, off, a + 90);
                el(s, "circle", {
                  cx: (px + ox).toFixed(2),
                  cy: (py + oy).toFixed(2),
                  r:
                    G.dot.tick *
                    (star ? 1.35 : 1) *
                    (1 + jit(i * 50 + k, 2, G.jitter.size)),
                  fill: ink,
                  class: "fade",
                  style: dl(0.3 + i * 0.04 + k * 0.012),
                });
              }
              const big = el(s, "circle", {
                cx: x0,
                cy: y0,
                r: Math.sqrt(cups / most) * DOT,
                fill: star ? HERO : G.ink.strong,
                stroke: "var(--color-card)",
                "stroke-width": G.line.data,
                class: "pop",
                style: dl(0.1 + i * 0.05),
              });
              tip(big, `${name} · ${ym(m)}开业 · 日均 ${cups} 杯`);
              // 店名 + 杯数写在今天弧外
              const [lx, ly] = P(R1 + 7, a);
              const t = txt(
                s,
                label({
                  ...labelAt(lx, ly, a),
                  fill: star ? HERO : G.ink.data,
                  class: "name fade",
                  style: dl(0.5 + i * 0.03),
                }),
                name
              );
              el(t, "tspan", {
                dx: 2.5,
                "font-size": G.type.tick,
                fill: star ? HERO : G.ink.quiet,
                style: "font-family:var(--font-mono)",
              }).textContent = cups;
            });
          });
        })();

        // ════ L2 · Dot Cascade ════
        (() => {
          // 点瀑：一行 = 一个退货原因，一点 = 5 单；行按单数从多到少自上而下排，
          // 每行起点比上一行右移一步，整体像台阶往右下流。每十点深一枚，数的时候有抓手。
          // 每行末尾一枚头点并标单数，原因名写在起点左侧。主角：无 —— 标题所指的「尺码不合」本就是最长的一行。
          // 九行、两端有标注，静态即可；头点 hover 出原因与单数。动效：点沿行依次淡入。
          const { G, jit, tick, value, label } = showMeChart;
          const UNIT = 5;
          // [原因, 单数]，已按单数从多到少
          const WHY = [
            ["尺码不合", 240],
            ["不喜欢", 95],
            ["色差", 70],
            ["质量问题", 60],
            ["发错货", 35],
            ["物流破损", 30],
            ["买多了", 20],
            ["降价", 15],
            ["其他", 10],
          ];
          reveal($("returns"), (s) => {
            const X0 = 62,
              SHIFT = 15,
              STEP = 5.1,
              Y0 = 44,
              ROW = 29;
            // 台阶导轨：连起每行起点的一道虚线
            el(s, "line", {
              x1: X0 - 3,
              y1: Y0 - 12,
              x2: X0 - 3 + SHIFT * (WHY.length - 0.3),
              y2: Y0 + ROW * (WHY.length - 0.3),
              stroke: G.ink.guide,
              "stroke-width": G.line.grid,
              "stroke-dasharray": "1 3",
            });
            WHY.forEach(([why, n], i) => {
              const x0 = X0 + i * SHIFT,
                y = Y0 + i * ROW,
                dots = n / UNIT;
              txt(
                s,
                label({ x: x0 - 8, y: y + 2.6, "text-anchor": "end" }),
                why
              );
              for (let k = 0; k < dots - 1; k++)
                el(s, "circle", {
                  cx: x0 + k * STEP,
                  cy: y + jit(i * 60 + k, 1, G.jitter.pos),
                  r: G.dot.mark * 0.8 * (1 + jit(i * 60 + k, 2, G.jitter.size)),
                  fill: (k + 1) % 10 ? G.ink.data : G.ink.strong,
                  class: "fade",
                  style: dl(0.1 + i * 0.05 + k * 0.012),
                });
              const hx = x0 + (dots - 1) * STEP;
              const head = el(s, "circle", {
                cx: hx,
                cy: y,
                r: G.dot.head,
                fill: G.ink.strong,
                class: "pop",
                style: dl(0.2 + i * 0.05 + dots * 0.012),
              });
              tip(head, `${why} · ${n} 单`);
              txt(s, value({ x: hx + 7, y: y + 2.6 }), n);
            });
            txt(
              s,
              tick({ x: 392, y: 312, "text-anchor": "end" }),
              `共 ${WHY.reduce((a, r) => a + r[1], 0)} 单`
            );
          });
        })();

        // ════ L3 · Barcode Lollipop ════
        (() => {
          // 条码棒棒：一根 = 一天。底纹每天一根竖直发丝，日历不缺格；棒头 = 当日最高气温，
          // 棒身往下拉到当日最低气温，棒长就是日温差；空心棒头 = 当天有降雨。
          // 家具：每 5 ℃ 一道虚线网格，35 ℃ 一道长虚线导轨，月界一根短刻度。只标最热的两天，相隔至少一周。
          // 主角：无。90 根、读形态不读单根，静态即可；棒头 hover 出日期与温度。动效：棒身自下描出，棒头弹出。
          const { G, jit, tick, value } = showMeChart;
          const HOT = 35;
          // 6 月 1 日起 90 天：季节正弦 + 确定性噪声；六月梅雨多，雨天最高温低、温差小
          const days = Array.from({ length: 90 }, (_, d) => {
            const rain = rnd(d + 3, 41) < (d < 26 ? 0.5 : 0.22);
            const hi =
              Math.round(
                (28.2 +
                  7.6 * Math.sin((Math.PI * (d + 6)) / 100) +
                  (rnd(d + 5, 42) - 0.5) * 3.2 -
                  (rain ? 2.8 : 0)) *
                  10
              ) / 10;
            const lo =
              Math.round(
                (hi - 5.2 - rnd(d + 7, 43) * 3.4 + (rain ? 1.4 : 0)) * 10
              ) / 10;
            return { d, rain, hi, lo };
          });
          const MONTHS = [
            [0, 6],
            [30, 7],
            [61, 8],
          ];
          const date = (d) => {
            const [start, m] = MONTHS.filter(([s]) => s <= d).pop();
            return `${m}/${d - start + 1}`;
          };
          // 最热的两天，相隔至少 7 天
          const peaks = [];
          [...days]
            .sort((a, b) => b.hi - a.hi || a.d - b.d)
            .forEach((x) => {
              if (
                peaks.length < 2 &&
                peaks.every((p) => Math.abs(p.d - x.d) >= 7)
              )
                peaks.push(x);
            });
          reveal($("summer"), (s) => {
            const X0 = 56,
              X1 = 782,
              TOP = 34,
              BOT = 236,
              T0 = 18,
              T1 = 40;
            const x = (d) => X0 + (d * (X1 - X0)) / (days.length - 1),
              y = (t) => BOT - ((t - T0) / (T1 - T0)) * (BOT - TOP);
            for (let t = 20; t <= T1; t += 5) {
              el(s, "line", {
                x1: X0 - 8,
                x2: X1,
                y1: y(t),
                y2: y(t),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": t === HOT ? "4 3" : "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 12, y: y(t) + 2.2, "text-anchor": "end" }),
                `${t}°`
              );
            }
            days.forEach((c) => {
              // 日历底纹：每天一根，高度统一
              el(s, "line", {
                x1: x(c.d),
                x2: x(c.d),
                y1: TOP,
                y2: BOT + 4,
                stroke: G.ink.mass,
                "stroke-width": G.line.grid,
              });
            });
            MONTHS.forEach(([d, m]) => {
              el(s, "line", {
                x1: x(d),
                x2: x(d),
                y1: BOT + 4,
                y2: BOT + 12,
                stroke: G.ink.quiet,
                "stroke-width": G.line.base,
              });
              txt(s, tick({ x: x(d) + 3, y: BOT + 20 }), `${m} 月`);
            });
            days.forEach((c, i) => {
              el(s, "line", {
                x1: x(c.d),
                x2: x(c.d),
                y1: y(c.lo),
                y2: y(c.hi),
                stroke: G.ink.strong,
                "stroke-width": G.line.data,
                pathLength: 1,
                class: "draw",
                style: dl(0.1 + i * 0.012),
              });
              const peak = peaks.includes(c);
              const head = el(s, "circle", {
                cx: x(c.d),
                cy: y(c.hi),
                r: peak
                  ? G.dot.head
                  : G.dot.mark * (1 + jit(c.d, 4, G.jitter.size)),
                fill: c.rain ? "var(--color-card)" : G.ink.strong,
                stroke: G.ink.strong,
                "stroke-width": G.line.data,
                class: "pop",
                style: dl(0.4 + i * 0.012),
              });
              tip(
                head,
                `${date(c.d)} · 最高 ${c.hi}℃ · 最低 ${c.lo}℃${c.rain ? " · 有雨" : ""}`
              );
            });
            peaks.forEach((p) => {
              txt(
                s,
                value({ x: x(p.d), y: y(p.hi) - 14, "text-anchor": "middle" }),
                `${p.hi}°`
              );
              txt(
                s,
                tick({ x: x(p.d), y: y(p.hi) - 6, "text-anchor": "middle" }),
                date(p.d)
              );
            });
            txt(
              s,
              tick({ x: X1, y: y(HOT) - 4, "text-anchor": "end" }),
              `${days.filter((c) => c.hi >= HOT).length} 天 ≥ ${HOT}°`
            );
          });
        })();

        // ════ L4 · Arc Matrix ════
        (() => {
          // 弧线矩阵：一行 = 一种团课，一列 = 一家门店，交叉处一个圆 = 当月报名人次。
          // 每行沿一道中间下垂的弧排开，像一排吊床；圆面积 ∝ 人次（半径取 sqrt），
          // 明度同时按人次分四档，最重的最深。报名不到 10 人的格子只留一个点标，不画圆。
          // 只给全表最大的三格标数。主角：无 —— 瑜伽一行本身最大最深。72 格、静态，圆上 hover 出读数。
          const { G, tick, value, label } = showMeChart;
          const STORES = "徐汇 静安 长宁 普陀 虹口 杨浦 闵行 浦东 宝山".split(
            " "
          );
          // [课程, 基数]；人次 = 基数 × 门店系数 × 确定性波动。搏击只在静安、浦东开课
          const CLASSES = [
            ["瑜伽", 80],
            ["单车", 60],
            ["普拉提", 46],
            ["杠铃", 40],
            ["舞蹈", 34],
            ["拉伸", 28],
            ["核心", 24],
            ["搏击", 0],
          ];
          const PULL = [1.0, 1.15, 0.9, 0.7, 0.75, 0.85, 0.8, 1.2, 0.6];
          const BOXING = { 1: 72, 7: 58 };
          const V = CLASSES.map(([, base], r) =>
            PULL.map((f, c) =>
              r === 7
                ? (BOXING[c] ?? Math.floor(rnd(c + 2, 53) * 9))
                : Math.round(
                    base *
                      f *
                      (r === 0
                        ? 0.95 + 0.15 * rnd(c + 1, 51)
                        : 0.7 + 0.5 * rnd(r * 9 + c + 1, 52))
                  )
            )
          );
          const most = Math.max(...V.flat()),
            top3 = V.flat()
              .sort((a, b) => b - a)
              .slice(0, 3);
          reveal($("classes"), (s) => {
            const X0 = 104,
              X1 = 380,
              Y0 = 72,
              ROW = 29,
              SAG = 9,
              RMAX = 11;
            const x = (c) => X0 + (c * (X1 - X0)) / (STORES.length - 1);
            // 吊床：两端高、中间低
            const sag = (xx) =>
              SAG * (1 - ((xx - (X0 + X1) / 2) / ((X1 - X0) / 2)) ** 2);
            STORES.forEach((name, c) =>
              txt(s, label({ x: x(c), y: 40, "text-anchor": "middle" }), name)
            );
            let shown = 0;
            CLASSES.forEach(([name], r) => {
              const y0 = Y0 + r * ROW;
              let d = "";
              for (let k = 0; k <= 40; k++) {
                const xx = X0 - 8 + (k * (X1 - X0 + 16)) / 40;
                d += `${k ? "L" : "M"}${xx.toFixed(1)} ${(y0 + sag(xx)).toFixed(1)}`;
              }
              el(s, "path", {
                d,
                fill: "none",
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
              });
              txt(
                s,
                label({ x: X0 - 16, y: y0 + 2.6, "text-anchor": "end" }),
                name
              );
              V[r].forEach((v, c) => {
                const cx = x(c),
                  cy = y0 + sag(cx);
                if (v < 10) {
                  el(s, "circle", { cx, cy, r: G.dot.tick, fill: G.ink.quiet });
                  return;
                }
                const q = v / most,
                  dot = el(s, "circle", {
                    cx,
                    cy,
                    r: Math.sqrt(q) * RMAX,
                    fill:
                      q > 0.75
                        ? G.ink.strong
                        : q > 0.5
                          ? I70
                          : q > 0.25
                            ? I45
                            : I30,
                    class: "pop",
                    style: dl(0.1 + r * 0.06 + c * 0.02),
                  });
                tip(dot, `${name} · ${STORES[c]} · ${v} 人次`);
                if (shown < 3 && top3.includes(v)) {
                  shown++;
                  txt(
                    s,
                    value({
                      x: cx,
                      y: cy - Math.sqrt(q) * RMAX - 3,
                      "text-anchor": "middle",
                    }),
                    v
                  );
                }
              });
            });
            txt(s, tick({ x: X0 - 16, y: 312 }), "点标 = 不到 10 人次");
          });
        })();

        // ════ L5 · Radial Convergence ════
        (() => {
          // 径向汇聚：外圈一个点 = 一条访谈原话，按访谈先后顺时针排、写上编号；每条原话一根曲线收进它归属的痛点。
          // 痛点节点在内圈，面积 ∝ 条数（半径取 sqrt），落在自己那段外圈的正对面一侧。
          // 痛点名与条数写在外圈之外：标签方位对准两枚编号之间的缝，引线从缝里穿出去，不压编号、不压圆环。
          // 主角：无 —— 最大的痛点本身最大。42 根线、两端有标注，静态即可；外圈点 hover 出编号与痛点。
          const { G, jit, tick, value, label } = showMeChart;
          // [痛点, 条数]，合计 42
          const PAIN = [
            ["开票慢", 14],
            ["找不到入口", 9],
            ["价格看不懂", 8],
            ["客服难联系", 7],
            ["导出乱码", 4],
          ];
          const N = PAIN.reduce((a, p) => a + p[1], 0);
          // 每个痛点先占一段连续的外圈，再用确定性随机两两对调 9 次：多数原话挨着同类，少数散到别处
          const who = PAIN.flatMap(([, n], t) => Array(n).fill(t));
          for (let k = 0; k < 9; k++) {
            const a = Math.floor(rnd(k + 1, 81) * N),
              b = Math.floor(rnd(k + 1, 82) * N);
            [who[a], who[b]] = [who[b], who[a]];
          }
          // 每段外圈的中点：痛点节点与标签的方位
          const home = [];
          PAIN.reduce(
            (start, [, n], t) => ((home[t] = start + n / 2), start + n),
            0
          );
          reveal($("interviews"), (s) => {
            const CX = 200,
              CY = 164,
              R = 100,
              HUB = 44,
              STEP = 360 / N,
              A0 = -90;
            const ang = (k) => A0 + (k + 0.5) * STEP;
            el(s, "circle", {
              cx: CX,
              cy: CY,
              r: R,
              fill: "none",
              stroke: G.ink.guide,
              "stroke-width": G.line.grid,
              "stroke-dasharray": "1 3",
            });
            const gapAt = (t) => A0 + Math.round(home[t]) * STEP,
              hubAt = PAIN.map((_, t) => pol(CX, CY, HUB, gapAt(t)));
            who.forEach((t, k) => {
              const a = ang(k),
                [x, y] = pol(CX, CY, R, a),
                [cx, cy] = pol(
                  CX,
                  CY,
                  R * (0.42 + jit(k, 1, G.jitter.bend)),
                  a
                );
              el(s, "path", {
                d: `M${x.toFixed(1)} ${y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${hubAt[t][0].toFixed(1)} ${hubAt[t][1].toFixed(1)}`,
                fill: "none",
                stroke: G.ink.mass,
                "stroke-width": G.line.thread,
                pathLength: 1,
                class: "draw",
                style: dl(0.1 + k * 0.015),
              });
              const dot = el(s, "circle", {
                cx: x,
                cy: y,
                r: G.dot.mark * 0.85,
                fill: G.ink.data,
                class: "pop",
                style: dl(0.05 + k * 0.012),
              });
              tip(dot, `原话 #${k + 1} · ${PAIN[t][0]}`);
              const [nx, ny] = pol(CX, CY, R + 9, a);
              txt(
                s,
                tick({ x: nx, y: ny + 2.2, "text-anchor": "middle" }),
                k + 1
              );
            });
            const big = Math.max(...PAIN.map((p) => p[1]));
            PAIN.forEach(([name, n], t) => {
              // 方位 = 离段中点最近的那道缝（两枚编号之间），痛点节点、引线、标签都在这条射线上
              const la = gapAt(t),
                [hx, hy] = hubAt[t],
                [ex, ey] = pol(CX, CY, R + 20, la),
                [tx, ty] = pol(CX, CY, R + 25, la),
                c = Math.cos(la * D2R),
                sn = Math.sin(la * D2R),
                anchor = c > 0.3 ? "start" : c < -0.3 ? "end" : "middle",
                dy = sn < -0.7 ? -9 : sn > 0.7 ? 6 : 0;
              el(s, "line", {
                x1: hx,
                y1: hy,
                x2: ex,
                y2: ey,
                stroke: G.ink.quiet,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 2",
              });
              el(s, "circle", {
                cx: hx,
                cy: hy,
                r: Math.sqrt(n / big) * 7.5,
                fill: G.ink.strong,
                stroke: "var(--color-card)",
                "stroke-width": G.line.base,
                class: "pop",
                style: dl(0.7 + t * 0.06),
              });
              txt(
                s,
                label({
                  x: tx,
                  y: ty + dy,
                  "text-anchor": anchor,
                  fill: G.ink.strong,
                }),
                name
              );
              txt(
                s,
                value({ x: tx, y: ty + dy + 9, "text-anchor": anchor }),
                n
              );
            });
          });
        })();

        // ════ L6 · Cluster Field ════
        (() => {
          // 星团场：一个点 = 一位编辑者，点面积 ∝ 本季度编辑次数（半径取 sqrt）；每人一根辐条连到所在空间的中心 ——
          // 辐条是纯肌理，不加交互。主库一团在正中，五个专题空间是两侧的小团，团的铺开半径随人数（sqrt）长。
          // 团内按葵花序（黄金角）排开，点距收紧到刚好不碰。团与团之间的一道弧 = 一个两边都写过的人，从他本人连到另一团的中心。
          // 主角 = 标题所指的数据组那 6 道弧及弧上的人：弧是发丝，几何上不凸显。静态，点 hover 出编辑次数。
          const { G, jit, tick, label } = showMeChart;
          // [空间, 人数, 中心 x, 中心 y]
          const SPACES = [
            ["主库", 72, 400, 168],
            ["设计", 14, 132, 92],
            ["客服", 11, 150, 250],
            ["法务", 6, 668, 70],
            ["数据", 17, 730, 196],
            ["招聘", 8, 598, 272],
          ];
          // 跨空间的人：[所在空间, 另一边的空间, 人数]
          const BRIDGES = [
            [4, 0, 6],
            [1, 2, 2],
            [3, 5, 1],
          ];
          const HERO_BRIDGE = 0;
          reveal($("wiki"), (s) => {
            const GOLD = 137.508,
              PITCH = 11.2;
            const people = SPACES.map(([, n, cx, cy], g) =>
              Array.from({ length: n }, (_, i) => {
                const r =
                    PITCH *
                    Math.sqrt(i + 0.6) *
                    (1 + jit(g * 100 + i, 1, G.jitter.cluster.spread * 0.3)),
                  [x, y] = pol(cx, cy, r, i * GOLD + g * 40),
                  edits = Math.round(2 + 58 * rnd(g * 100 + i + 1, 91) ** 2.6);
                return { x, y, edits };
              })
            );
            const most = Math.max(...people.flat().map((p) => p.edits));
            // 跨空间的人取离对面那团最近的几位，弧才不横穿自己的团
            const bridgeOf = new Map();
            BRIDGES.forEach(([from, to, n], b) => {
              const [, , tx, ty] = SPACES[to],
                far = (p) => Math.hypot(p.x - tx, p.y - ty);
              [...people[from]]
                .sort((p, q) => far(p) - far(q))
                .slice(0, n)
                .forEach((p) =>
                  bridgeOf.set(p, { to, hero: b === HERO_BRIDGE })
                );
            });
            // 辐条
            SPACES.forEach(([, , cx, cy], g) =>
              people[g].forEach((p, i) =>
                el(s, "line", {
                  x1: cx,
                  y1: cy,
                  x2: p.x,
                  y2: p.y,
                  stroke: G.ink.mass,
                  "stroke-width": G.line.thread,
                  class: "fade",
                  style: dl(0.1 + g * 0.08 + i * 0.006),
                })
              )
            );
            // 跨空间弧：往上拱，拱高随跨度
            bridgeOf.forEach(({ to, hero }, p) => {
              const [, , tx, ty] = SPACES[to],
                mx = (p.x + tx) / 2,
                my = (p.y + ty) / 2 - Math.abs(tx - p.x) * 0.22 - 16;
              el(s, "path", {
                d: `M${p.x.toFixed(1)} ${p.y.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${tx} ${ty}`,
                fill: "none",
                stroke: hero ? HERO : G.ink.quiet,
                "stroke-width": hero ? G.line.heroThread : G.line.thread,
                "stroke-dasharray": hero ? null : "2 2",
                pathLength: hero ? 1 : null,
                class: hero ? "draw" : "fade",
                style: dl(0.9),
              });
            });
            SPACES.forEach(([name, n, cx, cy], g) => {
              people[g].forEach((p, i) => {
                const hero = bridgeOf.get(p)?.hero,
                  dot = el(s, "circle", {
                    cx: p.x.toFixed(1),
                    cy: p.y.toFixed(1),
                    r: 0.9 + Math.sqrt(p.edits / most) * 3.6,
                    fill: hero ? HERO : g ? G.ink.data : G.ink.strong,
                    class: "pop",
                    style: dl(0.2 + g * 0.08 + i * 0.008),
                  });
                tip(
                  dot,
                  `${name} · 本季度编辑 ${p.edits} 次${bridgeOf.has(p) ? ` · 也在${SPACES[bridgeOf.get(p).to][0]}写` : ""}`
                );
              });
              el(s, "circle", {
                cx,
                cy,
                r: 2.4,
                fill: "var(--color-card)",
                stroke: G.ink.strong,
                "stroke-width": G.line.base,
              });
              const below = Math.max(...people[g].map((p) => p.y)) + 12;
              txt(
                s,
                tick({
                  x: cx,
                  y: Math.min(below, 314),
                  "text-anchor": "middle",
                  fill: g ? G.ink.quiet : G.ink.strong,
                  "letter-spacing": G.type.track * 1.5,
                }),
                `${name} ${n} 人`
              );
            });
          });
        })();

        // ════ L7 · Brand Spectrum ════
        (() => {
          // 品牌光谱：一行 = 一组对立特质，两端都是正当定位（双极量表，不是好坏）；横轴 = 受访者打分的平均值，
          // -3 到 +3 的 7 级量表。大点 = 我们，小点 = 三个对手，按市场份额分明度（份额越大越深）。
          // 一根发丝折线把我们各行的位置串起来，读出整体轮廓。家具：每行 7 个刻度，正中一道竖虚线。
          // 主角：无 —— 我们本身最大最黑。静态，点 hover 出读数。
          const { G, tick, label } = showMeChart;
          const RIVALS = ["甲", "乙", "丙"];
          // [左端, 右端, 我们, 甲, 乙, 丙]
          const AXES = [
            ["简单", "强大", -2.1, 0.8, 1.6, -0.6],
            ["私密", "协作", -1.7, 1.2, 0.2, 2.0],
            ["亲和", "专业", -0.3, 0.9, 1.8, -0.9],
            ["有趣", "严肃", -0.8, 0.4, 1.5, 0.1],
            ["本地", "云端", -1.4, 2.2, 1.1, 1.7],
          ];
          reveal($("persona"), (s) => {
            const X0 = 96,
              X1 = 304,
              Y0 = 44,
              ROW = 46;
            const x = (v) => X0 + ((v + 3) / 6) * (X1 - X0),
              y = (r) => Y0 + r * ROW;
            el(s, "line", {
              x1: x(0),
              x2: x(0),
              y1: Y0 - 14,
              y2: y(AXES.length - 1) + 14,
              stroke: G.ink.guide,
              "stroke-width": G.line.grid,
              "stroke-dasharray": "1 3",
            });
            [-3, 0, 3].forEach((v) =>
              txt(
                s,
                tick({ x: x(v), y: Y0 - 18, "text-anchor": "middle" }),
                v > 0 ? `+${v}` : v
              )
            );
            AXES.forEach(([lo, hi], r) => {
              el(s, "line", {
                x1: X0,
                x2: X1,
                y1: y(r),
                y2: y(r),
                stroke: G.ink.quiet,
                "stroke-width": G.line.base,
              });
              for (let v = -3; v <= 3; v++)
                el(s, "line", {
                  x1: x(v),
                  x2: x(v),
                  y1: y(r) - (v % 3 ? 2 : 3.5),
                  y2: y(r) + (v % 3 ? 2 : 3.5),
                  stroke: G.ink.quiet,
                  "stroke-width": G.line.base,
                });
              txt(
                s,
                label({ x: X0 - 12, y: y(r) + 2.6, "text-anchor": "end" }),
                lo
              );
              txt(s, label({ x: X1 + 12, y: y(r) + 2.6 }), hi);
            });
            // 我们的轮廓线
            el(s, "path", {
              d:
                "M" +
                AXES.map((a, r) => `${x(a[2]).toFixed(1)} ${y(r)}`).join("L"),
              fill: "none",
              stroke: G.ink.strong,
              "stroke-width": G.line.data,
              pathLength: 1,
              class: "draw",
              style: dl(0.5),
            });
            const RINK = [I60, I45, I30];
            AXES.forEach(([lo, hi, us, ...them], r) => {
              them.forEach((v, k) => {
                const d = el(s, "circle", {
                  cx: x(v),
                  cy: y(r),
                  r: G.dot.mark * 1.15,
                  fill: RINK[k],
                  stroke: "var(--color-card)",
                  "stroke-width": G.line.data,
                  class: "pop",
                  style: dl(0.1 + r * 0.06 + k * 0.03),
                });
                tip(
                  d,
                  `对手${RIVALS[k]} · ${lo}—${hi} · ${v > 0 ? "+" : ""}${v}`
                );
              });
              const d = el(s, "circle", {
                cx: x(us),
                cy: y(r),
                r: G.dot.head * 1.9,
                fill: G.ink.strong,
                stroke: "var(--color-card)",
                "stroke-width": G.line.base,
                class: "pop",
                style: dl(0.3 + r * 0.06),
              });
              tip(d, `我们 · ${lo}—${hi} · ${us > 0 ? "+" : ""}${us}`);
            });
            // 图例
            const LY = y(AXES.length - 1) + 34;
            el(s, "circle", {
              cx: X0 + 4,
              cy: LY - 2,
              r: G.dot.head,
              fill: G.ink.strong,
            });
            txt(s, tick({ x: X0 + 11, y: LY }), "我们");
            RIVALS.forEach((n, k) => {
              el(s, "circle", {
                cx: X0 + 52 + k * 34,
                cy: LY - 2,
                r: G.dot.mark,
                fill: RINK[k],
              });
              txt(s, tick({ x: X0 + 57 + k * 34, y: LY }), `对手${n}`);
            });
          });
        })();

        // ════ L8 · Dotty Matrix ════
        (() => {
          // 点阵层：一层 = 一个仓库，每层一张 7 × 5 的格：列 = 周一到周日，行 = 8 月 3 日起的五周。

          // 墨色同序由深到浅。周末两列在平面上垫一条浅色带，读的是各层的整体密度与周末规律，不读单点。
          // 主角：无。装饰感图型，静态；点 hover 出日期与单数。

          const WH = [

            ["华南", 980, 1.04],
            ["华北", 860, 0.52],
            ["西南", 540, 0.5],
          ];
          const DAY = "一二三四五六日";
          const grid = WH.map(([, base, weekend], w) =>
            Array.from({ length: 35 }, (_, i) =>
              Math.round(
                base *
                  (i % 7 >= 5 ? weekend : 1) *
                  (0.82 + 0.36 * rnd(w * 50 + i + 1, 95))

            )
          );
          const most = Math.max(...grid.flat()),
            INKS = [G.ink.strong, I70, I45, I30];

            // 斜投影：列沿 x 展开，行往右下斜着退
            const X0 = 56,
              W = 196,
              SKEW = 64,
              D = 44,
              Y0 = 34,
              GAP = 64,
              RMAX = 5.2;
            const at = (w, c, r) => [
              X0 + ((c + 0.5) / 7) * W + ((r + 0.5) / 5) * SKEW,
              Y0 + w * GAP + ((r + 0.5) / 5) * D,
            ];
            const corner = (w, u, v) =>
              `${(X0 + u * W + v * SKEW).toFixed(1)} ${(Y0 + w * GAP + v * D).toFixed(1)}`;
            WH.forEach(([name], w) => {

                d: `M${corner(w, 5 / 7, 0)}L${corner(w, 1, 0)}L${corner(w, 1, 1)}L${corner(w, 5 / 7, 1)}Z`,

              el(s, "path", {
                d: `M${corner(w, 0, 0)}L${corner(w, 1, 0)}L${corner(w, 1, 1)}L${corner(w, 0, 1)}Z`,

                stroke: G.ink.guide,
                "stroke-width": G.line.base,
              });
              grid[w].forEach((v, i) => {
                const c = i % 7,
                  r = Math.floor(i / 7),
                  [x, y] = at(w, c, r),
                  d = el(s, "circle", {
                    cx: x.toFixed(1),
                    cy: y.toFixed(1),
                    r: Math.sqrt(v / most) * RMAX,
                    fill: INKS[w],
                    class: "pop",
                    style: dl(0.1 + w * 0.12 + i * 0.008),

                tip(d, `${name}仓 · 第 ${r + 1} 周周${DAY[c]} · ${v} 单`);

              // 名称引线：从平面右角水平引出
              const [ex, ey] = corner(w, 1, 0.5).split(" ").map(Number);
              el(s, "line", {
                x1: ex + 6,
                x2: 330,
                y1: ey,
                y2: ey,
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,

              const total = grid[w].reduce((a, b) => a + b, 0);
              txt(
                s,
                label({
                  x: 336,
                  y: ey - 1,
                  fill: w ? G.ink.data : G.ink.strong,

                `${(total / 1000).toFixed(1)}k 单`

            [...DAY].forEach((d, c) => {

        // ════ L10 · Radial Patchwork ════

          // 扇宽固定 = 20 分钟；半径 = 问诊时长，从内圈起线性量。扇片以低不透明度叠放，墨越深 = 这个时段问诊越扎堆 ——
          // 本库唯一允许透明度编码密度的图。描边 = 转了线下就诊。家具：24 小时刻度环（每 6 小时标数）、10 / 20 / 30 分钟参考虚线圆。
          // 主角：无。140 片，读密度不读单片，静态；扇片 hover 出时刻与时长。
          const { G, tick } = showMeChart;
          // 近似正态：三个均匀数之和
          const bell = (i, k) =>
            (rnd(i, k) + rnd(i + 11, k + 1) + rnd(i + 23, k + 2) - 1.5) / 1.5;
          // 三类问诊：午间、深夜、白天零散；深夜的更长，转线下也多
          const visits = Array.from({ length: 140 }, (_, i) => {
            const p = rnd(i + 1, 61),
              kind = p < 0.42 ? "noon" : p < 0.84 ? "night" : "day";
            const h =
              kind === "noon"
                ? 12.6 + bell(i + 1, 62) * 1.6
                : kind === "night"
                  ? 22.4 + bell(i + 1, 63) * 1.5
                  : 7.5 + rnd(i + 1, 64) * 11;
            const min = Math.round(
              kind === "night"
                ? 11 + rnd(i + 2, 65) * 22
                : 5 + rnd(i + 2, 66) * (kind === "noon" ? 10 : 8)
            );
            const referred =
              kind === "night"
                ? min > 22 && rnd(i + 3, 67) < 0.55
                : rnd(i + 3, 68) < 0.05;
            return { h: (h + 24) % 24, min, referred };
          });
          const clock = (h) =>
            `${String(Math.floor(h)).padStart(2, "0")}:${String(Math.floor((h % 1) * 60)).padStart(2, "0")}`;

              fill: "none",

            ["DESKTOP", 5.1, 1.9],
            ["API", 7.4, 2.3],
            ["IMPORTS", 10.8, 3.2],
            ["BATCH", 15.2, 4],
          ];
          reveal($("ridge"), (s) => {
            const X0 = 92,
              X1 = 372,
              MAXH = 24,
              N = 72,
              LIFT = 54;
            const rowY = (i) => 96 + i * 44;
            ROWS.forEach(([name, c, sp], i) => {
              const y0 = rowY(i);
              const dens = Array.from({ length: N }, (_, k) => {
                const h = (k / (N - 1)) * MAXH;
                return (
                  Math.exp(-((h - c) ** 2) / (2 * sp * sp)) +
                  0.26 * Math.exp(-((h - c * 2.1) ** 2) / (2 * (sp * 1.7) ** 2))
                );
              });
              const dmax = Math.max(...dens);
              const pts = dens.map((d, k) => [
                X0 + (k / (N - 1)) * (X1 - X0),
                y0 - (d / dmax) * LIFT,
              ]);
              const crest =
                "M" +
                pts
                  .map((p) => p[0].toFixed(1) + " " + p[1].toFixed(1))
                  .join(" L ");
              el(s, "path", {
                d: crest + ` L${X1} ${y0} L${X0} ${y0} Z`,
                fill: PAPER,
                "fill-opacity": 0.96,
                class: "fade",
                style: `animation-delay:${i * 0.1}s`,
              });
              pts.forEach(([px, py], k) => {
                if (k % 2) return;
                el(s, "line", {
                  x1: px,
                  y1: y0,
                  x2: px,
                  y2: py,
                  stroke: I45,
                  "stroke-width": 0.5,
                  opacity: 0.28 + rnd(k + 1, i + 3) * 0.32,
                  class: "fade",
                  style: `animation-delay:${i * 0.1 + k * 0.004}s`,
                });
              });
              el(s, "path", {
                d: crest,
                fill: "none",
                stroke: INK,
                "stroke-width": 0.9,
                pathLength: 1,
                class: "draw",
                style: `animation-delay:${0.1 + i * 0.1}s;animation-duration:.8s`,
              });
              el(s, "line", {
                x1: X0,
                y1: y0,
                x2: X1,
                y2: y0,
                stroke: GRID,
                "stroke-width": 0.7,
                class: "fade",
                style: `animation-delay:${i * 0.1}s`,
              });
              const pk = dens.indexOf(dmax),
                [px, py] = pts[pk];
              const dot = el(s, "circle", {
                cx: px,
                cy: py,
                r: 2.6,
                fill: INK,
                class: "pop",
                style: `animation-delay:${0.6 + i * 0.1}s`,
              });
              tip(dot, `${name} — most runs finish around ${c.toFixed(1)}h`);
              txt(
                s,
                {
                  x: px + 7,
                  y: py + 1,
                  "font-size": 8,
                  "font-weight": 600,
                  fill: INK,
                  style: `paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:${0.7 + i * 0.1}s`,
                  class: "fade",
                },
                c.toFixed(1) + "h"
              );
              txt(
                s,
                {
                  x: X0 - 10,
                  y: y0 - 3,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: I60,
                  "text-anchor": "end",
                  "letter-spacing": ".06em",
                  class: "fade",
                  style: `animation-delay:${i * 0.1}s`,
                },
                name
              );
            });
            const yb = rowY(4);
            [0, 6, 12, 18, 24].forEach((h) => {
              const x = X0 + (h / MAXH) * (X1 - X0);
              el(s, "line", {
                x1: x,
                y1: yb + 4,
                x2: x,
                y2: yb + 9,
                stroke: I14,
                "stroke-width": 0.6,
                class: "fade",
                style: "animation-delay:.8s",
              });
              txt(
                s,
                {
                  x,
                  y: yb + 20,
                  "font-size": 7,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "middle",
                  class: "fade",
                  style: "animation-delay:.85s",
                },
                h + "h"
              );
            });
            txt(
              s,
              {
                x: 200,
                y: 308,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.1s",
              },
              "EACH CREST = ONE PIPELINE · THE AREA IS MADE OF HAIRLINES · DOT = THE PEAK"
            );
          });
        })();

        // ════ L20 · Parallel Coordinates ════
        (() => {
          // 多维记录对比的 Lupi 皮：一条发丝线 = 一个产品走过四根轴。
          // 线束的形状就是数据结构（哪两维相关、谁全线领先）。
          // 全线最优的上墨标名，其余发丝退后。轴顶名、轴脚 min/max。
          const DIMS = [
            ["PRICE $", 8, 30],
            ["CSAT", 6, 9.6],
            ["RETENTION %", 55, 95],
            ["GROWTH %", -5, 40],
          ];
          const P = [
            ["Editor", 12, 9.1, 91, 22],
            ["Boards", 18, 8.4, 86, 18],
            ["Forms", 9, 8.8, 78, 31],
            ["Docs", 15, 8.0, 82, 12],
            ["Chat", 7, 7.2, 64, 8],
            ["Vault", 24, 7.8, 88, 6],
            ["Flows", 21, 8.6, 90, 38],
            ["Views", 11, 7.5, 71, 14],
            ["Sync", 16, 6.9, 58, -2],
            ["Pages", 8, 8.2, 74, 19],
            ["Grid", 19, 7.1, 62, 4],
            ["Hub", 13, 6.6, 52, 9],
          ];
          reveal($("parallel"), (s) => {
            const AX = [64, 156, 248, 340],
              TOP = 64,
              BOT = 252;
            const mapY = (di, v) => {
              const [, lo, hi] = DIMS[di];
              return BOT - ((v - lo) / (hi - lo)) * (BOT - TOP);
            };
            // hero: judged on csat+retention+growth (price is a fact, not a virtue)
            const score = (p) =>
              (p[2] - 6) / 3.6 + (p[3] - 55) / 40 + (p[4] + 5) / 45;
            const hero = P.reduce((a, b) => (score(b) > score(a) ? b : a));
            DIMS.forEach(([name, lo, hi], di) => {
              el(s, "line", {
                x1: AX[di],
                y1: TOP - 8,
                x2: AX[di],
                y2: BOT + 8,
                stroke: I30,
                "stroke-width": 1,
                class: "fade",
                style: `animation-delay:${di * 0.06}s`,
              });
              [[TOP - 8], [BOT + 8]].forEach(([yy]) =>
                el(s, "line", {
                  x1: AX[di] - 4,
                  y1: yy,
                  x2: AX[di] + 4,
                  y2: yy,
                  stroke: I30,
                  "stroke-width": 1,
                  class: "fade",
                  style: `animation-delay:${di * 0.06}s`,
                })
              );
              txt(
                s,
                {
                  x: AX[di],
                  y: TOP - 22,
                  "font-size": 7,
                  "font-weight": 600,
                  fill: I60,
                  "text-anchor": "middle",
                  "letter-spacing": ".08em",
                  class: "fade",
                  style: `animation-delay:${di * 0.06}s`,
                },
                name
              );
              txt(
                s,
                {
                  x: AX[di] + 8,
                  y: TOP - 5,
                  "font-size": 6.5,
                  "font-weight": 600,
                  fill: I22,
                  class: "fade",
                  style: `animation-delay:${0.1 + di * 0.06}s`,
                },
                hi
              );
              txt(
                s,
                {
                  x: AX[di] + 8,
                  y: BOT + 11,
                  "font-size": 6.5,
                  "font-weight": 600,
                  fill: I22,
                  class: "fade",
                  style: `animation-delay:${0.1 + di * 0.06}s`,
                },
                lo
              );
            });
            P.forEach((p, i) => {
              const isHero = p === hero;
              const ys = [
                mapY(0, p[1]),
                mapY(1, p[2]),
                mapY(2, p[3]),
                mapY(3, p[4]),
              ];
              let d = `M${AX[0]} ${ys[0].toFixed(1)}`;
              for (let k = 0; k < 3; k++) {
                const mx = (AX[k] + AX[k + 1]) / 2;
                d += ` C${mx} ${ys[k].toFixed(1)} ${mx} ${ys[k + 1].toFixed(1)} ${AX[k + 1]} ${ys[k + 1].toFixed(1)}`;
              }
              const ln = el(s, "path", {
                d,
                fill: "none",
                stroke: isHero ? INK : I45,
                "stroke-width": isHero ? 2 : 0.65,
                opacity: isHero ? 1 : 0.5 + rnd(i + 1, 5) * 0.3,
                pathLength: 1,
                class: "draw",
                style: `animation-delay:${0.2 + i * 0.05}s;animation-duration:.8s`,
              });
              tip(
                ln,
                `${p[0]} — $${p[1]} · CSAT ${p[2]} · ${p[3]}% retained · ${p[4]}% growth`
              );
              ys.forEach((y, di) =>
                el(s, "circle", {
                  cx: AX[di],
                  cy: y,
                  r: isHero ? 3 : 1.4,
                  fill: isHero ? INK : I45,
                  opacity: isHero ? 1 : 0.7,
                  class: "pop",
                  style: `animation-delay:${0.3 + i * 0.05 + di * 0.04}s`,
                })
              );
              if (isHero)
                txt(
                  s,
                  {
                    x: AX[3] + 12,
                    y: ys[3] + 3,
                    "font-size": 9,
                    "font-weight": 600,
                    fill: INK,
                    style: `paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1s`,
                    class: "fade",
                  },
                  p[0]
                );
            });
            txt(
              s,
              {
                x: 200,
                y: 302,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.2s",
              },
              "ONE HAIRLINE = ONE PRODUCT · INK = BEST ACROSS THE BOARD"
            );
          });
        })();
      })();
    </script>
  </body>
</html>
