    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!--SHOW-ME:CSS-->

    <!--SHOW-ME:JS-->
    <script>
      (() => {
        const { el, txt, tip, rnd, pol, sect, blob, reveal, fmt } = showMeChart;
        const $ = (id) => document.getElementById(id);
        const INK = "var(--ink)",
          PAPER = "var(--paper)",
          HERO = "var(--chart-hero)";
        const I90 = "var(--ink-90)",
          I70 = "var(--ink-70)",
          I60 = "var(--ink-60)",
          I45 = "var(--ink-45)",
          I30 = "var(--ink-30)",
          I22 = "var(--ink-22)",
          I14 = "var(--ink-14)",
          I8 = "var(--ink-8)";
        const MUTED = I45,
          GRID = I14,
          FAINT = I22;
        const LAD = [INK, I70, I45, I30, I22]; // 5 级：少系列
        const L = [INK, I90, I70, I60, I45, I30, I22]; // 7 级：多系列
        const D2R = Math.PI / 180;
        const dl = (s) => `animation-delay:${s.toFixed(3)}s`; // 交错入场延迟
        const halo =
          "paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round"; // 文字描边遮线

        // ════ L1 · Launch Fan ════
        (() => {
          // 发射扇：一根辐条 = 一家店，辐条按开业先后依次排开。半径是日历：圆心一侧是 2024 年 1 月，
          // 最外一道弧是今天。大点落在开业那个月，面积 ∝ 现在的日均杯数（半径取 sqrt）；
          // 大点往外每个月一个小点，直到今天，所以辐条长 = 店龄。家具：每年一道虚线弧，今天一道实线弧。
          // 主角 = 标题所指的滨江店：杯量第二、辐条又短，几何上不凸显，大点与小点都上主角色、小点升一档。
          // 13 家店、两端有标注，静态即可；大点 hover 出开业月与杯数。
          const { G, jit, tick, label } = showMeChart;
          const NOW = 32; // 月序：0 = 2024 年 1 月，32 = 2026 年 9 月（今天）
          // [店名, 开业月序, 现在的日均杯数]，按开业先后
          const STORES = [
            ["人民广场", 2, 780],
            ["静安寺", 4, 690],
            ["徐家汇", 7, 610],
            ["五角场", 9, 540],
            ["陆家嘴", 12, 720],
            ["中山公园", 14, 430],
            ["七宝", 17, 380],
            ["张江", 19, 460],
            ["虹桥", 21, 350],
            ["滨江", 23, 740],
            ["大宁", 24, 300],
            ["前滩", 27, 410],
            ["松江", 30, 220],
          ];
          const STAR = "滨江";
          const ym = (m) =>
            `${2024 + Math.floor(m / 12)} 年 ${(m % 12) + 1} 月`;
          const most = Math.max(...STORES.map((r) => r[2]));
          reveal($("storefan"), (s) => {
            // 扇面：圆心在下方正中，辐条张开近 200°，最早的店在左
            const CX = 200,
              CY = 226,
              A0 = 177,
              A1 = 363,
              R0 = 62,
              R1 = 150,
              DOT = 8,
              RING_AT = 369,
              RING_ANCHOR = "start";
            // 标签水平摆放，按所在方位决定对齐
            const labelAt = (x, y, a) => {
              const c = Math.cos(a * D2R);
              return {
                x,
                y: y + 2.6,
                "text-anchor": c > 0.3 ? "start" : c < -0.3 ? "end" : "middle",
              };
            };
            const rAt = (m) => R0 + (m / NOW) * (R1 - R0),
              aAt = (i) => A0 + (i * (A1 - A0)) / (STORES.length - 1),
              P = (r, a) => pol(CX, CY, r, a);
            const arc = (r, a0, a1) => {
              const [x0, y0] = P(r, a0),
                [x1, y1] = P(r, a1);
              return `M${x0.toFixed(1)} ${y0.toFixed(1)}A${r} ${r} 0 ${a1 - a0 > 180 ? 1 : 0} 1 ${x1.toFixed(1)} ${y1.toFixed(1)}`;
            };
            // 年份弧：每年 1 月一道虚线；今天一道实线，标签放在扇面起点外侧
            [0, 12, 24].forEach((m) => {
              el(s, "path", {
                d: arc(rAt(m), A0 - 3, A1 + 3),
                fill: "none",
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              const [x, y] = P(rAt(m), RING_AT);
              txt(
                s,
                tick({ x, y: y + 2.2, "text-anchor": RING_ANCHOR }),
                `${2024 + m / 12}`
              );
            });
            el(s, "path", {
              d: arc(R1, A0 - 3, A1 + 3),
              fill: "none",
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            {
              const [x, y] = P(R1, RING_AT);
              txt(
                s,
                tick({ x, y: y + 2.2, "text-anchor": RING_ANCHOR }),
                "今天"
              );
            }
            STORES.forEach(([name, m, cups], i) => {
              const a = aAt(i),
                star = name === STAR,
                ink = star ? HERO : G.ink.data;
              // 辐条导轨：开业点到今天的一根发丝
              const [x0, y0] = P(rAt(m), a),
                [x1, y1] = P(R1, a);
              el(s, "line", {
                x1: x0,
                y1: y0,
                x2: x1,
                y2: y1,
                stroke: star ? HERO : G.ink.mass,
                "stroke-width": star ? G.line.data : G.line.grid,
                class: "fade",
                style: dl(0.2 + i * 0.04),
              });
              // 每月一点：只在垂直于辐条的方向上抖，月份位置不动
              for (let k = 1; k <= NOW - m; k++) {
                const [px, py] = P(rAt(m + k), a),
                  off = jit(i * 50 + k, 1, G.jitter.pos),
                  [ox, oy] = pol(0, 0, off, a + 90);
                el(s, "circle", {
                  cx: (px + ox).toFixed(2),
                  cy: (py + oy).toFixed(2),
                  r:
                    G.dot.tick *
                    (star ? 1.35 : 1) *
                    (1 + jit(i * 50 + k, 2, G.jitter.size)),
                  fill: ink,
                  class: "fade",
                  style: dl(0.3 + i * 0.04 + k * 0.012),
                });
              }
              const big = el(s, "circle", {
                cx: x0,
                cy: y0,
                r: Math.sqrt(cups / most) * DOT,
                fill: star ? HERO : G.ink.strong,
                stroke: "var(--color-card)",
                "stroke-width": G.line.data,
                class: "pop",
                style: dl(0.1 + i * 0.05),
              });
              tip(big, `${name} · ${ym(m)}开业 · 日均 ${cups} 杯`);
              // 店名 + 杯数写在今天弧外
              const [lx, ly] = P(R1 + 7, a);
              const t = txt(
                s,
                label({
                  ...labelAt(lx, ly, a),
                  fill: star ? HERO : G.ink.data,
                  class: "name fade",
                  style: dl(0.5 + i * 0.03),
                }),
                name
              );
              el(t, "tspan", {
                dx: 2.5,
                "font-size": G.type.tick,
                fill: star ? HERO : G.ink.quiet,
                style: "font-family:var(--font-mono)",
              }).textContent = cups;
            });
          });
        })();

        // ════ L2 · Dot Cascade ════
        (() => {
          // 点瀑：一行 = 一个退货原因，一点 = 5 单；行按单数从多到少自上而下排，
          // 每行起点比上一行右移一步，整体像台阶往右下流。每十点深一枚，数的时候有抓手。
          // 每行末尾一枚头点并标单数，原因名写在起点左侧。主角：无 —— 标题所指的「尺码不合」本就是最长的一行。
          // 九行、两端有标注，静态即可；头点 hover 出原因与单数。动效：点沿行依次淡入。
          const { G, jit, tick, value, label } = showMeChart;
          const UNIT = 5;
          // [原因, 单数]，已按单数从多到少
          const WHY = [
            ["尺码不合", 240],
            ["不喜欢", 95],
            ["色差", 70],
            ["质量问题", 60],
            ["发错货", 35],
            ["物流破损", 30],
            ["买多了", 20],
            ["降价", 15],
            ["其他", 10],
          ];
          reveal($("returns"), (s) => {
            const X0 = 62,
              SHIFT = 15,
              STEP = 5.1,
              Y0 = 44,
              ROW = 29;
            // 台阶导轨：连起每行起点的一道虚线
            el(s, "line", {
              x1: X0 - 3,
              y1: Y0 - 12,
              x2: X0 - 3 + SHIFT * (WHY.length - 0.3),
              y2: Y0 + ROW * (WHY.length - 0.3),
              stroke: G.ink.guide,
              "stroke-width": G.line.grid,
              "stroke-dasharray": "1 3",
            });
            WHY.forEach(([why, n], i) => {
              const x0 = X0 + i * SHIFT,
                y = Y0 + i * ROW,
                dots = n / UNIT;
              txt(
                s,
                label({ x: x0 - 8, y: y + 2.6, "text-anchor": "end" }),
                why
              );
              for (let k = 0; k < dots - 1; k++)
                el(s, "circle", {
                  cx: x0 + k * STEP,
                  cy: y + jit(i * 60 + k, 1, G.jitter.pos),
                  r: G.dot.mark * 0.8 * (1 + jit(i * 60 + k, 2, G.jitter.size)),
                  fill: (k + 1) % 10 ? G.ink.data : G.ink.strong,
                  class: "fade",
                  style: dl(0.1 + i * 0.05 + k * 0.012),
                });
              const hx = x0 + (dots - 1) * STEP;
              const head = el(s, "circle", {
                cx: hx,
                cy: y,
                r: G.dot.head,
                fill: G.ink.strong,
                class: "pop",
                style: dl(0.2 + i * 0.05 + dots * 0.012),
              });
              tip(head, `${why} · ${n} 单`);
              txt(s, value({ x: hx + 7, y: y + 2.6 }), n);
            });
            txt(
              s,
              tick({ x: 392, y: 312, "text-anchor": "end" }),
              `共 ${WHY.reduce((a, r) => a + r[1], 0)} 单`
            );
          });
        })();

        // ════ L3 · Barcode Lollipop ════
        (() => {
          // 条码棒棒：一根 = 一天。底纹每天一根竖直发丝，日历不缺格；棒头 = 当日最高气温，
          // 棒身往下拉到当日最低气温，棒长就是日温差；空心棒头 = 当天有降雨。
          // 家具：每 5 ℃ 一道虚线网格，35 ℃ 一道长虚线导轨，月界一根短刻度。只标最热的两天，相隔至少一周。
          // 主角：无。90 根、读形态不读单根，静态即可；棒头 hover 出日期与温度。动效：棒身自下描出，棒头弹出。
          const { G, jit, tick, value } = showMeChart;
          const HOT = 35;
          // 6 月 1 日起 90 天：季节正弦 + 确定性噪声；六月梅雨多，雨天最高温低、温差小
          const days = Array.from({ length: 90 }, (_, d) => {
            const rain = rnd(d + 3, 41) < (d < 26 ? 0.5 : 0.22);
            const hi =
              Math.round(
                (28.2 +
                  7.6 * Math.sin((Math.PI * (d + 6)) / 100) +
                  (rnd(d + 5, 42) - 0.5) * 3.2 -
                  (rain ? 2.8 : 0)) *
                  10
              ) / 10;
            const lo =
              Math.round(
                (hi - 5.2 - rnd(d + 7, 43) * 3.4 + (rain ? 1.4 : 0)) * 10
              ) / 10;
            return { d, rain, hi, lo };
          });
          const MONTHS = [
            [0, 6],
            [30, 7],
            [61, 8],
          ];
          const date = (d) => {
            const [start, m] = MONTHS.filter(([s]) => s <= d).pop();
            return `${m}/${d - start + 1}`;
          };
          // 最热的两天，相隔至少 7 天
          const peaks = [];
          [...days]
            .sort((a, b) => b.hi - a.hi || a.d - b.d)
            .forEach((x) => {
              if (
                peaks.length < 2 &&
                peaks.every((p) => Math.abs(p.d - x.d) >= 7)
              )
                peaks.push(x);
            });
          reveal($("summer"), (s) => {
            const X0 = 56,
              X1 = 782,
              TOP = 34,
              BOT = 236,
              T0 = 18,
              T1 = 40;
            const x = (d) => X0 + (d * (X1 - X0)) / (days.length - 1),
              y = (t) => BOT - ((t - T0) / (T1 - T0)) * (BOT - TOP);
            for (let t = 20; t <= T1; t += 5) {
              el(s, "line", {
                x1: X0 - 8,
                x2: X1,
                y1: y(t),
                y2: y(t),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": t === HOT ? "4 3" : "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 12, y: y(t) + 2.2, "text-anchor": "end" }),
                `${t}°`
              );
            }
            days.forEach((c) => {
              // 日历底纹：每天一根，高度统一
              el(s, "line", {
                x1: x(c.d),
                x2: x(c.d),
                y1: TOP,
                y2: BOT + 4,
                stroke: G.ink.mass,
                "stroke-width": G.line.grid,
              });
            });
            MONTHS.forEach(([d, m]) => {
              el(s, "line", {
                x1: x(d),
                x2: x(d),
                y1: BOT + 4,
                y2: BOT + 12,
                stroke: G.ink.quiet,
                "stroke-width": G.line.base,
              });
              txt(s, tick({ x: x(d) + 3, y: BOT + 20 }), `${m} 月`);
            });
            days.forEach((c, i) => {
              el(s, "line", {
                x1: x(c.d),
                x2: x(c.d),
                y1: y(c.lo),
                y2: y(c.hi),
                stroke: G.ink.strong,
                "stroke-width": G.line.data,
                pathLength: 1,
                class: "draw",
                style: dl(0.1 + i * 0.012),
              });
              const peak = peaks.includes(c);
              const head = el(s, "circle", {
                cx: x(c.d),
                cy: y(c.hi),
                r: peak
                  ? G.dot.head
                  : G.dot.mark * (1 + jit(c.d, 4, G.jitter.size)),
                fill: c.rain ? "var(--color-card)" : G.ink.strong,
                stroke: G.ink.strong,
                "stroke-width": G.line.data,
                class: "pop",
                style: dl(0.4 + i * 0.012),
              });
              tip(
                head,
                `${date(c.d)} · 最高 ${c.hi}℃ · 最低 ${c.lo}℃${c.rain ? " · 有雨" : ""}`
              );
            });
            peaks.forEach((p) => {
              txt(
                s,
                value({ x: x(p.d), y: y(p.hi) - 14, "text-anchor": "middle" }),
                `${p.hi}°`
              );
              txt(
                s,
                tick({ x: x(p.d), y: y(p.hi) - 6, "text-anchor": "middle" }),
                date(p.d)
              );
            });
            txt(
              s,
              tick({ x: X1, y: y(HOT) - 4, "text-anchor": "end" }),
              `${days.filter((c) => c.hi >= HOT).length} 天 ≥ ${HOT}°`
            );
          });
        })();

        // ════ L4 · Arc Matrix ════
        (() => {
          // 弧线矩阵：一行 = 一种团课，一列 = 一家门店，交叉处一个圆 = 当月报名人次。
          // 每行沿一道中间下垂的弧排开，像一排吊床；圆面积 ∝ 人次（半径取 sqrt），
          // 明度同时按人次分四档，最重的最深。报名不到 10 人的格子只留一个点标，不画圆。
          // 只给全表最大的三格标数。主角：无 —— 瑜伽一行本身最大最深。72 格、静态，圆上 hover 出读数。
          const { G, tick, value, label } = showMeChart;
          const STORES = "徐汇 静安 长宁 普陀 虹口 杨浦 闵行 浦东 宝山".split(
            " "
          );
          // [课程, 基数]；人次 = 基数 × 门店系数 × 确定性波动。搏击只在静安、浦东开课
          const CLASSES = [
            ["瑜伽", 80],
            ["单车", 60],
            ["普拉提", 46],
            ["杠铃", 40],
            ["舞蹈", 34],
            ["拉伸", 28],
            ["核心", 24],
            ["搏击", 0],
          ];
          const PULL = [1.0, 1.15, 0.9, 0.7, 0.75, 0.85, 0.8, 1.2, 0.6];
          const BOXING = { 1: 72, 7: 58 };
          const V = CLASSES.map(([, base], r) =>
            PULL.map((f, c) =>
              r === 7
                ? (BOXING[c] ?? Math.floor(rnd(c + 2, 53) * 9))
                : Math.round(
                    base *
                      f *
                      (r === 0
                        ? 0.95 + 0.15 * rnd(c + 1, 51)
                        : 0.7 + 0.5 * rnd(r * 9 + c + 1, 52))
                  )
            )
          );
          const most = Math.max(...V.flat()),
            top3 = V.flat()
              .sort((a, b) => b - a)
              .slice(0, 3);
          reveal($("classes"), (s) => {
            const X0 = 104,
              X1 = 380,
              Y0 = 72,
              ROW = 29,
              SAG = 9,
              RMAX = 11;
            const x = (c) => X0 + (c * (X1 - X0)) / (STORES.length - 1);
            // 吊床：两端高、中间低
            const sag = (xx) =>
              SAG * (1 - ((xx - (X0 + X1) / 2) / ((X1 - X0) / 2)) ** 2);
            STORES.forEach((name, c) =>
              txt(s, label({ x: x(c), y: 40, "text-anchor": "middle" }), name)
            );
            let shown = 0;
            CLASSES.forEach(([name], r) => {
              const y0 = Y0 + r * ROW;
              let d = "";
              for (let k = 0; k <= 40; k++) {
                const xx = X0 - 8 + (k * (X1 - X0 + 16)) / 40;
                d += `${k ? "L" : "M"}${xx.toFixed(1)} ${(y0 + sag(xx)).toFixed(1)}`;
              }
              el(s, "path", {
                d,
                fill: "none",
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
              });
              txt(
                s,
                label({ x: X0 - 16, y: y0 + 2.6, "text-anchor": "end" }),
                name
              );
              V[r].forEach((v, c) => {
                const cx = x(c),
                  cy = y0 + sag(cx);
                if (v < 10) {
                  el(s, "circle", { cx, cy, r: G.dot.tick, fill: G.ink.quiet });
                  return;
                }
                const q = v / most,
                  dot = el(s, "circle", {
                    cx,
                    cy,
                    r: Math.sqrt(q) * RMAX,
                    fill:
                      q > 0.75
                        ? G.ink.strong
                        : q > 0.5
                          ? I70
                          : q > 0.25
                            ? I45
                            : I30,
                    class: "pop",
                    style: dl(0.1 + r * 0.06 + c * 0.02),
                  });
                tip(dot, `${name} · ${STORES[c]} · ${v} 人次`);
                if (shown < 3 && top3.includes(v)) {
                  shown++;
                  txt(
                    s,
                    value({
                      x: cx,
                      y: cy - Math.sqrt(q) * RMAX - 3,
                      "text-anchor": "middle",
                    }),
                    v
                  );
                }
              });
            });
            txt(s, tick({ x: X0 - 16, y: 312 }), "点标 = 不到 10 人次");
          });
        })();

        // ════ L5 · Radial Convergence ════
        (() => {
          // 径向汇聚：外圈一个点 = 一条访谈原话，按访谈先后顺时针排、写上编号；每条原话一根曲线收进它归属的痛点。
          // 痛点节点在内圈，面积 ∝ 条数（半径取 sqrt），落在自己那段外圈的正对面一侧。
          // 痛点名与条数写在外圈之外：标签方位对准两枚编号之间的缝，引线从缝里穿出去，不压编号、不压圆环。
          // 主角：无 —— 最大的痛点本身最大。42 根线、两端有标注，静态即可；外圈点 hover 出编号与痛点。
          const { G, jit, tick, value, label } = showMeChart;
          // [痛点, 条数]，合计 42
          const PAIN = [
            ["开票慢", 14],
            ["找不到入口", 9],
            ["价格看不懂", 8],
            ["客服难联系", 7],
            ["导出乱码", 4],
          ];
          const N = PAIN.reduce((a, p) => a + p[1], 0);
          // 每个痛点先占一段连续的外圈，再用确定性随机两两对调 9 次：多数原话挨着同类，少数散到别处
          const who = PAIN.flatMap(([, n], t) => Array(n).fill(t));
          for (let k = 0; k < 9; k++) {
            const a = Math.floor(rnd(k + 1, 81) * N),
              b = Math.floor(rnd(k + 1, 82) * N);
            [who[a], who[b]] = [who[b], who[a]];
          }
          // 每段外圈的中点：痛点节点与标签的方位
          const home = [];
          PAIN.reduce(
            (start, [, n], t) => ((home[t] = start + n / 2), start + n),
            0
          );
          reveal($("interviews"), (s) => {
            const CX = 200,
              CY = 164,
              R = 100,
              HUB = 44,
              STEP = 360 / N,
              A0 = -90;
            const ang = (k) => A0 + (k + 0.5) * STEP;
            el(s, "circle", {
              cx: CX,
              cy: CY,
              r: R,
              fill: "none",
              stroke: G.ink.guide,
              "stroke-width": G.line.grid,
              "stroke-dasharray": "1 3",
            });
            const gapAt = (t) => A0 + Math.round(home[t]) * STEP,
              hubAt = PAIN.map((_, t) => pol(CX, CY, HUB, gapAt(t)));
            who.forEach((t, k) => {
              const a = ang(k),
                [x, y] = pol(CX, CY, R, a),
                [cx, cy] = pol(
                  CX,
                  CY,
                  R * (0.42 + jit(k, 1, G.jitter.bend)),
                  a
                );
              el(s, "path", {
                d: `M${x.toFixed(1)} ${y.toFixed(1)}Q${cx.toFixed(1)} ${cy.toFixed(1)} ${hubAt[t][0].toFixed(1)} ${hubAt[t][1].toFixed(1)}`,
                fill: "none",
                stroke: G.ink.mass,
                "stroke-width": G.line.thread,
                pathLength: 1,
                class: "draw",
                style: dl(0.1 + k * 0.015),
              });
              const dot = el(s, "circle", {
                cx: x,
                cy: y,
                r: G.dot.mark * 0.85,
                fill: G.ink.data,
                class: "pop",
                style: dl(0.05 + k * 0.012),
              });
              tip(dot, `原话 #${k + 1} · ${PAIN[t][0]}`);
              const [nx, ny] = pol(CX, CY, R + 9, a);
              txt(
                s,
                tick({ x: nx, y: ny + 2.2, "text-anchor": "middle" }),
                k + 1
              );
            });
            const big = Math.max(...PAIN.map((p) => p[1]));
            PAIN.forEach(([name, n], t) => {
              // 方位 = 离段中点最近的那道缝（两枚编号之间），痛点节点、引线、标签都在这条射线上
              const la = gapAt(t),
                [hx, hy] = hubAt[t],
                [ex, ey] = pol(CX, CY, R + 20, la),
                [tx, ty] = pol(CX, CY, R + 25, la),
                c = Math.cos(la * D2R),
                sn = Math.sin(la * D2R),
                anchor = c > 0.3 ? "start" : c < -0.3 ? "end" : "middle",
                dy = sn < -0.7 ? -9 : sn > 0.7 ? 6 : 0;
              el(s, "line", {
                x1: hx,
                y1: hy,
                x2: ex,
                y2: ey,
                stroke: G.ink.quiet,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 2",
              });
              el(s, "circle", {
                cx: hx,
                cy: hy,
                r: Math.sqrt(n / big) * 7.5,
                fill: G.ink.strong,
                stroke: "var(--color-card)",
                "stroke-width": G.line.base,
                class: "pop",
                style: dl(0.7 + t * 0.06),
              });
              txt(
                s,
                label({
                  x: tx,
                  y: ty + dy,
                  "text-anchor": anchor,
                  fill: G.ink.strong,
                }),
                name
              );
              txt(
                s,
                value({ x: tx, y: ty + dy + 9, "text-anchor": anchor }),
                n
              );
            });
          });
        })();

        // ════ L6 · Cluster Field ════
        (() => {
          // 星团场：一个点 = 一位编辑者，点面积 ∝ 本季度编辑次数（半径取 sqrt）；每人一根辐条连到所在空间的中心 ——
          // 辐条是纯肌理，不加交互。主库一团在正中，五个专题空间是两侧的小团，团的铺开半径随人数（sqrt）长。
          // 团内按葵花序（黄金角）排开，点距收紧到刚好不碰。团与团之间的一道弧 = 一个两边都写过的人，从他本人连到另一团的中心。
          // 主角 = 标题所指的数据组那 6 道弧及弧上的人：弧是发丝，几何上不凸显。静态，点 hover 出编辑次数。
          const { G, jit, tick, label } = showMeChart;
          // [空间, 人数, 中心 x, 中心 y]
          const SPACES = [
            ["主库", 72, 400, 168],
            ["设计", 14, 132, 92],
            ["客服", 11, 150, 250],
            ["法务", 6, 668, 70],
            ["数据", 17, 730, 196],
            ["招聘", 8, 598, 272],
          ];
          // 跨空间的人：[所在空间, 另一边的空间, 人数]
          const BRIDGES = [
            [4, 0, 6],
            [1, 2, 2],
            [3, 5, 1],
          ];
          const HERO_BRIDGE = 0;
          reveal($("wiki"), (s) => {
            const GOLD = 137.508,
              PITCH = 11.2;
            const people = SPACES.map(([, n, cx, cy], g) =>
              Array.from({ length: n }, (_, i) => {
                const r =
                    PITCH *
                    Math.sqrt(i + 0.6) *
                    (1 + jit(g * 100 + i, 1, G.jitter.cluster.spread * 0.3)),
                  [x, y] = pol(cx, cy, r, i * GOLD + g * 40),
                  edits = Math.round(2 + 58 * rnd(g * 100 + i + 1, 91) ** 2.6);
                return { x, y, edits };
              })
            );
            const most = Math.max(...people.flat().map((p) => p.edits));
            // 跨空间的人取离对面那团最近的几位，弧才不横穿自己的团
            const bridgeOf = new Map();
            BRIDGES.forEach(([from, to, n], b) => {
              const [, , tx, ty] = SPACES[to],
                far = (p) => Math.hypot(p.x - tx, p.y - ty);
              [...people[from]]
                .sort((p, q) => far(p) - far(q))
                .slice(0, n)
                .forEach((p) =>
                  bridgeOf.set(p, { to, hero: b === HERO_BRIDGE })
                );
            });
            // 辐条
            SPACES.forEach(([, , cx, cy], g) =>
              people[g].forEach((p, i) =>
                el(s, "line", {
                  x1: cx,
                  y1: cy,
                  x2: p.x,
                  y2: p.y,
                  stroke: G.ink.mass,
                  "stroke-width": G.line.thread,
                  class: "fade",
                  style: dl(0.1 + g * 0.08 + i * 0.006),
                })
              )
            );
            // 跨空间弧：往上拱，拱高随跨度
            bridgeOf.forEach(({ to, hero }, p) => {
              const [, , tx, ty] = SPACES[to],
                mx = (p.x + tx) / 2,
                my = (p.y + ty) / 2 - Math.abs(tx - p.x) * 0.22 - 16;
              el(s, "path", {
                d: `M${p.x.toFixed(1)} ${p.y.toFixed(1)}Q${mx.toFixed(1)} ${my.toFixed(1)} ${tx} ${ty}`,
                fill: "none",
                stroke: hero ? HERO : G.ink.quiet,
                "stroke-width": hero ? G.line.heroThread : G.line.thread,
                "stroke-dasharray": hero ? null : "2 2",
                pathLength: hero ? 1 : null,
                class: hero ? "draw" : "fade",
                style: dl(0.9),
              });
            });
            SPACES.forEach(([name, n, cx, cy], g) => {
              people[g].forEach((p, i) => {
                const hero = bridgeOf.get(p)?.hero,
                  dot = el(s, "circle", {
                    cx: p.x.toFixed(1),
                    cy: p.y.toFixed(1),
                    r: 0.9 + Math.sqrt(p.edits / most) * 3.6,
                    fill: hero ? HERO : g ? G.ink.data : G.ink.strong,
                    class: "pop",
                    style: dl(0.2 + g * 0.08 + i * 0.008),
                  });
                tip(
                  dot,
                  `${name} · 本季度编辑 ${p.edits} 次${bridgeOf.has(p) ? ` · 也在${SPACES[bridgeOf.get(p).to][0]}写` : ""}`
                );
              });
              el(s, "circle", {
                cx,
                cy,
                r: 2.4,
                fill: "var(--color-card)",
                stroke: G.ink.strong,
                "stroke-width": G.line.base,
              });
              const below = Math.max(...people[g].map((p) => p.y)) + 12;
              txt(
                s,
                tick({
                  x: cx,
                  y: Math.min(below, 314),
                  "text-anchor": "middle",
                  fill: g ? G.ink.quiet : G.ink.strong,
                  "letter-spacing": G.type.track * 1.5,
                }),
                `${name} ${n} 人`
              );
            });
          });
        })();

        // ════ L7 · Brand Spectrum ════
        (() => {
          // 品牌光谱：一行 = 一组对立特质，两端都是正当定位（双极量表，不是好坏）；横轴 = 受访者打分的平均值，
          // -3 到 +3 的 7 级量表。大点 = 我们，小点 = 三个对手，按市场份额分明度（份额越大越深）。
          // 一根发丝折线把我们各行的位置串起来，读出整体轮廓。家具：每行 7 个刻度，正中一道竖虚线。
          // 主角：无 —— 我们本身最大最黑。静态，点 hover 出读数。
          const { G, tick, label } = showMeChart;
          const RIVALS = ["甲", "乙", "丙"];
          // [左端, 右端, 我们, 甲, 乙, 丙]
          const AXES = [
            ["简单", "强大", -2.1, 0.8, 1.6, -0.6],
            ["私密", "协作", -1.7, 1.2, 0.2, 2.0],
            ["亲和", "专业", -0.3, 0.9, 1.8, -0.9],

              GAP = 64,
              RMAX = 5.2;

              X0 + ((c + 0.5) / 7) * W + ((r + 0.5) / 5) * SKEW,

        (() => {

                ? 12.6 + bell(i + 1, 62) * 1.6

              kind === "night"
                ? min > 22 && rnd(i + 3, 67) < 0.55
                : rnd(i + 3, 68) < 0.05;
            return { h: (h + 24) % 24, min, referred };

        // ════ L12 · Type Colonnade ════
        (() => {
          // 柱廊：底部一排是菜单上的 36 道菜，按菜单顺序斜写；每道菜一根发丝往上连到出品它的档口，
          // 线束立起来像一排柱子。档口在上方一排，按出品道数从多到少排开，圆面积 ∝ 道数（半径取 sqrt）。
          // 名单即数据：菜名全写出来。主角：无 —— 最大的档口本身最大。静态，菜名与档口 hover 出归属。
          const { G, tick, value, label } = showMeChart;
          const STALLS = [

            ["牛肉面", 2],
            ["白切鸡", 3],
            ["麻婆豆腐", 0],
            ["红烧肉", 1],
            ["番茄炒蛋", 4],
            ["水煮鱼", 0],
            ["葱油拌面", 2],
            ["叉烧", 3],
            ["回锅肉", 0],
            ["腌笃鲜", 1],
            ["意面", 5],
            ["鱼香肉丝", 0],
            ["雪菜面", 2],
            ["干煸豆角", 0],
            ["素三鲜", 4],
            ["双皮奶", 6],
            ["酸菜鱼", 0],

                cx: x1,
                cy: FOOT + 2,

                fill: G.ink.data,
              });
              const t = txt(

                label({

              txt(
                s,
                label({
                  x: sx(k),
                  y: TOP - rad(count[0]) - 16,

                  fill: G.ink.strong,

              txt(
                s,

        // ════ L13 · Hourglass Stream ════
        (() => {
          // 沙漏流（横放）：一个阶段一条竖立的条码，一道横发丝 = 20 人，条码高 ∝ 这一关还剩多少人，
          // 各条码以同一条水平中线对齐，整体像横躺的沙漏往右收窄。两关之间淌过一束发丝 —— 纯肌理，
          // 不代表具体的人，不加交互。关与关之间写通过率。主角 = 标题所指的面试这一关的通过率，
          // 它是一个数，几何上没有凸显，只给这个数上主角色。动效：条码逐关淡入，发丝描出。
          const { G, jit, tick, value, label } = showMeChart;
          const UNIT = 20;
          const STAGES = [
            ["投递", 2400],
            ["简历通过", 860],
            ["笔试", 410],
            ["面试", 190],
            ["录用", 46],
          ];
          const HOT_STEP = 3; // 面试 → 录用
          reveal($("hiring"), (s) => {
            const X0 = 46,
              X1 = 356,
              MID = 150,
              HMAX = 216,
              W = 26;
            const x = (i) => X0 + (i * (X1 - X0)) / (STAGES.length - 1),
              h = (n) => (n / STAGES[0][1]) * HMAX;
            // 发丝：从前一关条码的随机高度淌到后一关条码的随机高度
            STAGES.slice(1).forEach(([, n], i) => {
              const a = x(i) + W / 2,
                b = x(i + 1) - W / 2,
                ha = h(STAGES[i][1]),
                hb = h(n),
                k = 26;
              for (let t = 0; t < k; t++) {
                const ya = MID + (rnd(i * 40 + t + 1, 71) - 0.5) * ha,
                  yb = MID + (rnd(i * 40 + t + 1, 72) - 0.5) * hb,
                  bend = (b - a) * (0.5 + jit(i * 40 + t, 3, G.jitter.bend));
                el(s, "path", {
                  d: `M${a.toFixed(1)} ${ya.toFixed(1)}C${(a + bend).toFixed(1)} ${ya.toFixed(1)} ${(b - bend).toFixed(1)} ${yb.toFixed(1)} ${b.toFixed(1)} ${yb.toFixed(1)}`,
                  fill: "none",
                  stroke: G.ink.mass,
                  "stroke-width": G.line.thread,
                  pathLength: 1,
                  class: "draw",
                  style: dl(0.4 + i * 0.15 + t * 0.01),
                });
              }
              const rate = Math.round((n / STAGES[i][1]) * 100);
              txt(
                s,
                value(
                  {
                    x: (a + b) / 2,
                    y: MID - Math.max(ha, hb) / 2 - 12,
                    "text-anchor": "middle",
                  },
                  i === HOT_STEP
                ),
                `${rate}%`
              );
            });
            STAGES.forEach(([name, n], i) => {
              const lines = Math.max(1, Math.round(n / UNIT)),
                hh = h(n),
                g = el(s, "g", { class: "fade", style: dl(0.1 + i * 0.12) });
              for (let k = 0; k < lines; k++) {
                const yy =
                    MID -
                    hh / 2 +
                    (lines === 1 ? hh / 2 : (k * hh) / (lines - 1)),
                  len = W * (1 + jit(i * 200 + k, 5, G.jitter.len));
                el(g, "line", {
                  x1: x(i) - len / 2,
                  x2: x(i) + len / 2,
                  y1: yy.toFixed(2),
                  y2: yy.toFixed(2),
                  stroke:
                    rnd(i * 200 + k + 1, 73) < G.jitter.accent
                      ? G.ink.strong
                      : G.ink.data,
                  "stroke-width": G.line.grid,
                });
              }
              const bot = MID + Math.max(hh, 12) / 2;
              txt(
                s,
                label({
                  x: x(i),
                  y: bot + 14,
                  "text-anchor": "middle",
                  fill: G.ink.strong,
                }),
                name
              );
              txt(
                s,
                value({ x: x(i), y: bot + 24, "text-anchor": "middle" }),
                fmt(n)
              );
            });
            txt(s, tick({ x: X0 - W / 2, y: MID - HMAX / 2 - 12 }), "通过率");
          });
        })();

        // ════ L14 · Hundred Field ════
        (() => {
          // 百人场：一点 = 一位受访居民，共 100 人。按对加装电梯的态度聚成四团，四团从支持到反对沿一条轴排开，
          // 团的大小就是人数（每人一点，不缩放）。团内按葵花序（黄金角）紧排，点距收紧到刚好不碰，
          // 点径按 G.jitter.cluster 取不齐。空心点 = 住在三楼及以下，这是第二个编码。
          // 主角：无 —— 空心点已经把标题所指的人挑出来了。静态，团名下写人数与其中低层人数。
          const { G, jit, tick, value, label } = showMeChart;
          // [态度, 人数, 其中住三楼及以下]
          const VIEWS = [
            ["支持", 46, 6],
            ["有条件支持", 27, 8],
            ["无所谓", 15, 5],
            ["反对", 12, 10],
          ];
          reveal($("elevator"), (s) => {
            const PITCH = 7.2,
              CY = 128,
              GOLD = 137.508,
              GAP = 22;
            const radius = (n) => PITCH * Math.sqrt(n) * 0.98;
            // 各团横向排开：宽度按半径累加，整体居中
            const widths = VIEWS.map(([, n]) => radius(n) * 2),
              total =
                widths.reduce((a, w) => a + w, 0) + GAP * (VIEWS.length - 1);
            let left = (400 - total) / 2;
            const cx = widths.map((w) => {
              const c = left + w / 2;
              left += w + GAP;
              return c;
            });
            const [lo, hi] = G.jitter.cluster.size;
            let seq = 0;
            VIEWS.forEach(([name, n, low], g) => {
              // 低层住户：随机数最大的那几位，数量严格等于 low
              const lowSet = new Set(
                Array.from({ length: n }, (_, i) => [
                  i,
                  rnd(g * 100 + i + 1, 77),
                ])
                  .sort((a, b) => b[1] - a[1])
                  .slice(0, low)
                  .map((p) => p[0])
              );
              for (let i = 0; i < n; i++) {
                const r0 = PITCH * Math.sqrt(i + 0.5) * 0.98,
                  spread = PITCH * G.jitter.cluster.spread,
                  [x, y] = pol(cx[g], CY, r0, i * GOLD + g * 50),
                  size =
                    G.dot.mark *
                    (lo + (hi - lo) * rnd(g * 100 + i + 1, 78) ** 1.8),
                  hollow = lowSet.has(i);
                el(s, "circle", {
                  cx: (x + jit(g * 100 + i, 1, spread)).toFixed(2),
                  cy: (y + jit(g * 100 + i, 2, spread)).toFixed(2),
                  r: size,
                  fill: hollow ? "var(--color-card)" : G.ink.data,
                  stroke: hollow ? G.ink.strong : "none",
                  "stroke-width": G.line.data,
                  class: "pop",
                  style: dl(0.05 + seq++ * 0.01),
                });
              }
              const under = CY + radius(VIEWS[0][1]) + 18;
              txt(
                s,
                label({
                  x: cx[g],
                  y: under,
                  "text-anchor": "middle",
                  fill: G.ink.strong,
                }),
                name
              );
              txt(
                s,
                value({ x: cx[g], y: under + 11, "text-anchor": "middle" }),
                n
              );
              txt(
                s,
                tick({ x: cx[g], y: under + 21, "text-anchor": "middle" }),
                `低层 ${low}`
              );
            });
            // 态度轴
            const AY = CY + radius(VIEWS[0][1]) + 44;
            el(s, "line", {
              x1: cx[0],
              x2: cx[3],
              y1: AY,
              y2: AY,
              stroke: G.ink.guide,
              "stroke-width": G.line.base,
            });
            [0, 3].forEach((g) =>
              el(s, "circle", {
                cx: cx[g],
                cy: AY,
                r: G.dot.tick * 1.4,
                fill: G.ink.quiet,
              })
            );
            txt(
              s,
              tick({
                x: (cx[0] + cx[3]) / 2,
                y: AY + 10,
                "text-anchor": "middle",
              }),
              "从支持到反对 · 共 100 人"
            );
          });
        })();

        // ════ L15 · Ballot Tally ════
        (() => {
          // 计票：一个选项一张 10 × 10 的票格，一道竖刻 = 100 位家长中的一位；选了这项的刻成实墨，
          // 从最下一行起、自左往右逐行刻，刻到的高度就是百分比，没选的留一道短浅刻当底纹。
          // 多选题：各项独立 0–100，不加总。每行 = 10 人，左侧标 50 与 100 两道刻度。
          // 主角：无 —— 体育本身刻得最高。静态，票格 hover 出人数。动效：刻痕逐道淡入。
          const { G, jit, tick, value, label } = showMeChart;
          const PICKS = [

            ["编程", 48],
            ["阅读", 41],
            ["艺术", 33],

              );
            });
            PICKS.forEach(([name, n], p) => {
              const gx = X0 + p * PITCH,

              for (let k = 0; k < 100; k++) {
                const col = k % 10,
                  row = Math.floor(k / 10),
                  on = k < n,
                  x = gx + col * COL + COL / 2,
                  yb = BASE - row * ROW,
                  len =
                    (on ? LEN : LEN * 0.4) *
                    (1 + jit(p * 100 + k, 1, G.jitter.len));
                el(g, "line", {
                  x1: x,
                  x2: x,
                  y1: yb,
                  y2: (yb - len).toFixed(2),
                  stroke: on ? G.ink.strong : G.ink.mass,

                  class: "fade",
                  style: dl(0.1 + p * 0.1 + k * 0.006),
                });
              }
              const top = BASE - (Math.ceil(n / 10) - 1) * ROW - LEN;
              // 读数写在票格右侧、与刻到的最高一行齐平，不压浅刻
              txt(s, value({ x: gx + COL * 10 + 3, y: top + LEN - 1 }), n);
              txt(
                s,
                label({
                  x: gx + (COL * 10) / 2,
                  y: BASE + 16,
                  "text-anchor": "middle",
                  fill: G.ink.strong,
                }),
                name
              );
            });
            txt(
              s,
              tick({ x: X0 - 14, y: BASE + 30 }),
              "一道 = 一位家长 · 每行 10 位 · 可多选"
            );
          });
        })();

        // ════ L16 · Matrix Heat ════
        (() => {
          // 矩阵热力：一行 = 转出科室，一列 = 转入科室，格子明度 = 当月转诊人次，分五档（明度即数据，档越高越深）。
          // 转诊有方向，矩阵不对称；对角线是同一科室，画一道短横占位。零次留空格边框。
          // 只给全表最大的三格标数，数字压在格内用纸色。主角：无 —— 最大的一格本身最深。静态，格子 hover 出读数。
          const { G, tick, label } = showMeChart;
          const DEPT = ["急诊", "心内", "呼吸", "消化", "骨科", "神内", "普外"];
          // REF[转出][转入]，对角线不用
          const REF = [
            [0, 88, 42, 30, 24, 18, 20],

            [1, 3, 2, 17, 5, 0, 0],

          const STEPS = [

            [20, I45, "20–39"],
            [40, I70, "40–69"],
            [70, G.ink.strong, "70+"],
          ];
          const shade = (v) => STEPS.filter(([lo]) => v >= lo).pop()[1];
          const top3 = REF.flat()
            .sort((a, b) => b - a)
            .slice(0, 3);
          reveal($("referrals"), (s) => {
            const X0 = 92,
              Y0 = 58,
              C = 32,
              GAP = 3;
            const x = (j) => X0 + j * (C + GAP),
              y = (i) => Y0 + i * (C + GAP);
            txt(s, tick({ x: X0, y: Y0 - 26 }), "转入科室 →");
            txt(
              s,
              tick({ x: X0 - 12, y: Y0 - 10, "text-anchor": "end" }),
              "转出 ↓"
            );
            DEPT.forEach((d, j) =>
              txt(
                s,
                label({ x: x(j) + C / 2, y: Y0 - 8, "text-anchor": "middle" }),
                d
              )
            );
            REF.forEach((row, i) => {
              txt(
                s,
                label({
                  x: X0 - 12,
                  y: y(i) + C / 2 + 2.6,
                  "text-anchor": "end",
                }),
                DEPT[i]
              );
              row.forEach((v, j) => {
                if (i === j) {
                  el(s, "line", {
                    x1: x(j) + C / 2 - 4,
                    x2: x(j) + C / 2 + 4,
                    y1: y(i) + C / 2,
                    y2: y(i) + C / 2,
                    stroke: G.ink.guide,
                    "stroke-width": G.line.base,
                  });
                  return;
                }
                const cell = el(s, "rect", {
                  x: x(j),
                  y: y(i),
                  width: C,
                  height: C,
                  rx: 2,
                  fill: v ? shade(v) : "none",
                  stroke: v ? "none" : G.ink.guide,
                  "stroke-width": G.line.grid,
                  class: "fade",
                  style: dl(0.05 + (i + j) * 0.04),
                });
                tip(cell, `${DEPT[i]} → ${DEPT[j]} · ${v} 人次`);
                if (top3.includes(v) && v)
                  txt(
                    s,
                    tick({
                      x: x(j) + C / 2,
                      y: y(i) + C / 2 + 2.4,
                      "text-anchor": "middle",
                      fill: "var(--color-card)",
                      "font-weight": 600,
                    }),
                    v
                  );
              });
            });
            // 图例：五档
            const LY = y(DEPT.length) + 12;
            STEPS.forEach(([, fill, text], k) => {
              const lx = X0 + k * 52;
              el(s, "rect", {
                x: lx,
                y: LY,
                width: 9,
                height: 9,
                rx: 1.5,
                fill,
              });
              txt(s, tick({ x: lx + 13, y: LY + 7 }), text);
            });
            txt(
              s,
              tick({ x: X0 - 12, y: LY + 7, "text-anchor": "end" }),
              "人次"
            );
          });
        })();

        // ════ L17 · Calendar Heat ════
        (() => {
          // 日历热力：52 周 × 7 天，一列 = 一周（周一在上），一点 = 一天，点面积 ∝ 当天跑的公里数（半径取 sqrt），
          // 没跑的休息日留一个浅色小点，日历不缺格。周末两行垫一条浅带；月与月之间一道台阶形的发丝分界。
          // 最长的一段连续跑步在网格下方用括线标出。主角：无。364 个点，静态；点 hover 出日期与公里数。
          const { G, tick, value, label } = showMeChart;
          // 2024 年 12 月 30 日（周一）起 52 周。十月有一段刻意不断的连跑；冬季与盛夏跑得少，周日是长距离
          const START = Date.UTC(2024, 11, 30);
          const days = Array.from({ length: 364 }, (_, d) => {
            const t = new Date(START + d * 864e5),
              m = t.getUTCMonth(),
              dow = d % 7,
              streak =
                t.getUTCFullYear() === 2025 &&
                m === 9 &&
                t.getUTCDate() >= 6 &&
                t.getUTCDate() <= 24;
            const p = streak
              ? 1
              : (m <= 1 ? 0.38 : m === 6 || m === 7 ? 0.45 : 0.58) +
                (dow >= 5 ? 0.25 : 0);
            const km =
              rnd(d + 1, 88) >= p
                ? 0
                : dow === 6
                  ? 12 + Math.round(rnd(d + 1, 89) * 9)
                  : 4 + Math.round(rnd(d + 1, 90) * 6);
            return { t, m, km };
          });
          const md = (t) => `${t.getUTCMonth() + 1}/${t.getUTCDate()}`;
          // 最长连跑
          let best = [0, 0];
          days.reduce((run, day, i) => {
            const n = day.km ? run + 1 : 0;
            if (n > best[1] - best[0]) best = [i - n + 1, i + 1];
            return n;
          }, 0);
          const most = Math.max(...days.map((x) => x.km));
          reveal($("runlog"), (s) => {
            const X0 = 64,
              P = 14.1,
              Y0 = 42,
              R = 14;
            const x = (c) => X0 + c * P,
              y = (r) => Y0 + r * R,
              edge = (c) => x(c) - P / 2;
            el(s, "rect", {
              x: edge(0),
              y: y(5) - R / 2,
              width: 52 * P,
              height: 2 * R,
              fill: I8,
            });
            ["一", "", "三", "", "五", "", "日"].forEach(
              (d, r) =>
                d &&
                txt(
                  s,
                  tick({ x: X0 - 14, y: y(r) + 2.2, "text-anchor": "end" }),
                  d
                )
            );
            days.forEach((day, i) => {
              const c = Math.floor(i / 7),
                r = i % 7,
                dot = el(s, "circle", {
                  cx: x(c),
                  cy: y(r),
                  r: day.km ? Math.sqrt(day.km / most) * 6.3 : G.dot.tick * 0.8,
                  fill: day.km ? G.ink.data : G.ink.mass,
                  class: "pop",
                  style: dl(0.05 + c * 0.02),
                });
              tip(dot, `${md(day.t)} · ${day.km ? `${day.km} 公里` : "休息"}`);
              // 每月 1 日：台阶形分界 + 月份标签
              if (day.t.getUTCDate() === 1) {
                const top = y(0) - R / 2,
                  bot = y(6) + R / 2,
                  step = y(r) - R / 2;
                el(s, "path", {
                  d: r
                    ? `M${edge(c + 1)} ${top}V${step}H${edge(c)}V${bot}`
                    : `M${edge(c)} ${top}V${bot}`,
                  fill: "none",
                  stroke: G.ink.guide,
                  "stroke-width": G.line.base,
                });
                txt(
                  s,
                  label({ x: edge(r ? c + 1 : c) + 3, y: top - 6 }),
                  `${day.m + 1} 月`
                );
              }
            });
            // 最长连跑的括线
            const c0 = Math.floor(best[0] / 7),
              c1 = Math.floor((best[1] - 1) / 7),
              by = y(6) + R / 2 + 8;
            el(s, "path", {
              d: `M${x(c0)} ${by - 3}V${by}H${x(c1)}V${by - 3}`,
              fill: "none",
              stroke: G.ink.strong,
              "stroke-width": G.line.base,
            });
            txt(
              s,
              value({
                x: (x(c0) + x(c1)) / 2,
                y: by + 11,
                "text-anchor": "middle",
              }),
              `连跑 ${best[1] - best[0]} 天`
            );
            txt(
              s,
              tick({
                x: (x(c0) + x(c1)) / 2,
                y: by + 20,
                "text-anchor": "middle",
              }),
              `${md(days[best[0]].t)}—${md(days[best[1] - 1].t)}`
            );
            txt(
              s,
              tick({ x: x(51) + P / 2, y: by + 11, "text-anchor": "end" }),
              `全年 ${days.filter((d) => d.km).length} 天 · ${fmt(days.reduce((a, d) => a + d.km, 0))} 公里`
            );
          });
        })();

        // ════ L19 · Ridgeline ════
        (() => {
          // 山脊：一道山脊 = 一个区全部外卖订单的送达时长分布（密度，五道同一比例，面积都是 1）。
          // 横轴 = 分钟；山脊按中位时长由快到慢自上而下叠放，后排被前排遮住。山体用横向发丝排线填，
          // 轮廓一道实线；峰顶一道竖虚线落到基线，并标峰值分钟。主角：无。静态，山脊 hover 出区名与峰值。
          const { G, tick, value, label } = showMeChart;
          // [区, 高斯混合 [权重, 均值, 标准差]…]
          const AREAS = [
            ["黄浦", [[1, 24, 5]]],
            ["静安", [[1, 26, 6]]],
            [
              "浦东",
              [
                [0.8, 31, 7],
                [0.2, 48, 6],
              ],
            ],
            [
              "闵行",
              [
                [0.7, 35, 8],
                [0.3, 52, 7],
              ],
            ],
            [
              "松江",
              [
                [0.55, 40, 9],
                [0.45, 58, 8],
              ],
            ],
          ];
          const T0 = 10,
            T1 = 75;
          const dens = (mix, t) =>
            mix.reduce(
              (a, [w, mu, sd]) =>
                a +
                (w * Math.exp(-(((t - mu) / sd) ** 2) / 2)) /
                  (sd * Math.sqrt(2 * Math.PI)),
              0
            );
          const curves = AREAS.map(([, mix]) =>
            Array.from({ length: 131 }, (_, k) => {
              const t = T0 + (k * (T1 - T0)) / 130;
              return [t, dens(mix, t)];
            })
          );
          const peak = Math.max(...curves.flat().map((p) => p[1]));
          reveal($("delivery"), (s) => {
            const X0 = 70,
              X1 = 384,
              Y0 = 96,
              GAP = 44,
              H = 74;
            const x = (t) => X0 + ((t - T0) / (T1 - T0)) * (X1 - X0),
              base = (r) => Y0 + r * GAP;
            const floor = base(AREAS.length - 1);
            for (let t = 10; t <= 70; t += 10) {
              el(s, "line", {
                x1: x(t),
                x2: x(t),
                y1: Y0 - H + 10,
                y2: floor,
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: x(t), y: floor + 12, "text-anchor": "middle" }),
                t
              );
            }
            txt(
              s,
              tick({ x: X1, y: floor + 22, "text-anchor": "end" }),
              "送达时长 · 分钟"
            );
            AREAS.forEach(([name], r) => {
              const b = base(r),
                pts = curves[r].map(([t, v]) => [x(t), b - (v / peak) * H]),
                line = pts
                  .map(
                    ([px, py], k) =>
                      `${k ? "L" : "M"}${px.toFixed(1)} ${py.toFixed(1)}`
                  )
                  .join(""),
                area = `${line}L${x(T1)} ${b}L${x(T0)} ${b}Z`,
                id = `delivery-clip-${r}`;
              const clip = el(el(s, "defs", {}), "clipPath", { id });
              el(clip, "path", { d: area });
              const g = el(s, "g", {
                class: "fade",
                style: dl(0.1 + r * 0.12),
              });
              // 卡片色底：前排挡住后排
              el(g, "path", { d: area, fill: "var(--color-card)" });
              const hatch = el(g, "g", { "clip-path": `url(#${id})` });
              for (let yy = b - H; yy < b; yy += 2.2)
                el(hatch, "line", {
                  x1: X0,
                  x2: X1,
                  y1: yy.toFixed(1),
                  y2: yy.toFixed(1),
                  stroke: G.ink.mass,
                  "stroke-width": G.line.grid,
                });
              const edge = el(g, "path", {
                d: line,
                fill: "none",
                stroke: G.ink.strong,
                "stroke-width": G.line.data,
              });
              el(g, "line", {
                x1: X0,
                x2: X1,
                y1: b,
                y2: b,
                stroke: G.ink.quiet,
                "stroke-width": G.line.base,
              });
              const top = curves[r].reduce((a, p) => (p[1] > a[1] ? p : a)),
                [px, py] = [x(top[0]), b - (top[1] / peak) * H];
              el(g, "line", {
                x1: px,
                x2: px,
                y1: py,
                y2: b,
                stroke: G.ink.quiet,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "2 2",
              });
              el(g, "circle", {
                cx: px,
                cy: py,
                r: G.dot.mark,
                fill: G.ink.strong,
              });
              txt(
                g,
                value({ x: px + 5, y: py - 3 }),
                `${Math.round(top[0])} 分`
              );
              txt(
                g,
                label({
                  x: X0 - 10,
                  y: b - 2,
                  "text-anchor": "end",
                  fill: G.ink.strong,
                }),
                name
              );
              tip(edge, `${name} · 峰值约 ${Math.round(top[0])} 分钟`);
            });
          });
        })();

        // ════ L20 · Parallel Coordinates ════
        (() => {
          // 平行坐标：一根折线 = 一款电动车，依次穿过五根竖轴：续航、电耗、快充时间、价格、车主评分。
          // 每根轴各自按该维度的最小到最大线性铺满，越小越好的三根（电耗、快充、价格）上下翻转，
          // 所以每根轴都是往上更好；轴两端写实际值。折线用直段，不做平滑，交叉就是真交叉。
          // 主角 = 标题所指的小满：十二根里的一根，几何上不凸显，整条线与轴上的点上主角色、线宽升一档。
          // 12 根线，静态即可；线 hover 出车型与五项读数。
          const { G, tick, value, label } = showMeChart;
          // [名称, 单位, 越大越好]
          const AXES = [
            ["续航", "km", true],
            ["电耗", "kWh/百公里", false],
            ["快充", "分钟", false],
            ["价格", "万元", false],
            ["评分", "/5", true],
          ];
          const CARS = [
            ["星河 S", 620, 14.8, 28, 22.9, 4.3],
            ["远途 7", 710, 16.2, 24, 31.5, 4.1],
            ["青禾", 430, 12.1, 35, 11.8, 4.4],
            ["奔流 X", 560, 15.5, 30, 18.6, 3.9],
            ["拾光", 480, 13.0, 38, 13.9, 4.2],
            ["北辰", 650, 17.4, 22, 35.8, 4.0],
            ["小满", 690, 12.6, 23, 21.5, 4.7],
            ["云岚", 520, 14.1, 33, 16.2, 4.0],
            ["锐角", 600, 15.9, 26, 26.4, 3.8],
            ["山海", 580, 16.8, 31, 19.9, 4.1],
            ["知行", 450, 13.4, 40, 12.5, 4.3],
            ["朝夕", 540, 14.6, 29, 17.3, 3.7],
          ];
          const STAR = "小满";
          const range = AXES.map((_, a) => {
            const v = CARS.map((c) => c[a + 1]);
            return [Math.min(...v), Math.max(...v)];
          });
          reveal($("evs"), (s) => {
            const X0 = 44,
              X1 = 332,
              TOP = 58,
              BOT = 262;
            const x = (a) => X0 + (a * (X1 - X0)) / (AXES.length - 1);
            // 归一到 0（最差）–1（最好）
            const good = (a, v) => {
              const [lo, hi] = range[a],
                f = (v - lo) / (hi - lo);
              return AXES[a][2] ? f : 1 - f;
            };
            const y = (a, v) => BOT - good(a, v) * (BOT - TOP);
            AXES.forEach(([name, unit, up], a) => {
              el(s, "line", {
                x1: x(a),
                x2: x(a),
                y1: TOP,
                y2: BOT,
                stroke: G.ink.quiet,
                "stroke-width": G.line.base,
              });
              txt(
                s,
                label({
                  x: x(a),
                  y: TOP - 26,
                  "text-anchor": "middle",
                  fill: G.ink.strong,
                }),
                name
              );
              txt(
                s,
                tick({ x: x(a), y: TOP - 17, "text-anchor": "middle" }),
                unit
              );
              const [lo, hi] = range[a];
              txt(
                s,
                tick({ x: x(a), y: TOP - 6, "text-anchor": "middle" }),
                up ? hi : lo
              );
              txt(
                s,
                tick({ x: x(a), y: BOT + 12, "text-anchor": "middle" }),
                up ? lo : hi
              );
            });
            txt(
              s,
              tick({ x: X0 - 26, y: TOP + 2.2, "text-anchor": "end" }),
              "好"
            );
            txt(
              s,
              tick({ x: X0 - 26, y: BOT + 2.2, "text-anchor": "end" }),
              "差"
            );
            const order = [...CARS].sort(
              (p, q) => (p[0] === STAR) - (q[0] === STAR)
            );
            order.forEach((car, i) => {
              const star = car[0] === STAR,
                pts = AXES.map((_, a) => [x(a), y(a, car[a + 1])]);
              const line = el(s, "path", {
                d:
                  "M" +
                  pts
                    .map((p) => p.map((v) => v.toFixed(1)).join(" "))
                    .join("L"),
                fill: "none",
                stroke: star ? HERO : G.ink.mass,
                "stroke-width": star ? G.line.hero : G.line.data,
                "stroke-linejoin": "round",
                pathLength: 1,
                class: "draw",
                style: dl(0.1 + i * 0.05),
              });
              tip(
                line,
                `${car[0]} · ` +
                  AXES.map(
                    ([n, u], a) =>
                      `${n} ${car[a + 1]}${u === "/5" ? "" : " " + u}`
                  ).join(" · ")
              );
              pts.forEach(([px, py]) =>
                el(s, "circle", {
                  cx: px,
                  cy: py,
                  r: star ? G.dot.head : G.dot.tick,
                  fill: star ? HERO : G.ink.quiet,
                })
              );
              if (star) {
                const [lx, ly] = pts[pts.length - 1];
                txt(s, value({ x: lx + 8, y: ly + 2.6 }, true), car[0]);
              }
            });
          });
        })();
      })();
    </script>
  </body>
</html>
