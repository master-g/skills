    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <script>
      /* ── 滑块填充 ──────────────────────────────────────────────────────
         轨道的已填充部分由 --slider-value 驱动。骨架始终同步这个变量，
         因而只使用滑块的页面不依赖条件内联的组件行为 JS。 */
      (function () {
        function sync(el) {
          var min = Number(el.min || 0),
            max = Number(el.max === "" ? 100 : el.max);
          var pct =
            max === min ? 0 : ((Number(el.value) - min) / (max - min)) * 100;
          el.style.setProperty("--slider-value", pct + "%");
        }
        document.querySelectorAll('input[type="range"]').forEach(sync);
        /* 事件委托：后插进来的滑块也照样跟着走 */
        document.addEventListener("input", function (e) {
          if (e.target.matches && e.target.matches('input[type="range"]'))
            sync(e.target);
        });
      })();

    <script>
      /* ── 代码工具条：换行 / 复制 ──
         给每个 pre > code 注入两个按钮。工具条带 data-md-skip，导出 Markdown 时不出现。
         复制走 navigator.clipboard，失败时退回 execCommand；反馈先行，不等 promise。 */
      (function () {
        function mk(label, title) {
          var b = document.createElement("button");
          b.type = "button";
          b.className = "btn";
          b.setAttribute("data-variant", "outline");
          b.title = title;
          b.textContent = label;
          return b;
        }
        function copyText(text) {
          try {
            return navigator.clipboard.writeText(text);
          } catch (e) {
            var ta = document.createElement("textarea");
            ta.value = text;
            ta.style.position = "fixed";
            ta.style.opacity = "0";
            document.body.appendChild(ta);
            ta.select();
            try {
              document.execCommand("copy");
            } catch (e2) {}
            ta.remove();
          }
        }
        document.querySelectorAll("pre > code").forEach(function (code) {
          var pre = code.parentNode;
          if (pre.querySelector(".code-tools")) return;
          var bar = document.createElement("div");
          bar.className = "code-tools";
          bar.setAttribute("data-md-skip", "");
          var wrap = mk("换行", "切换自动换行");
          wrap.setAttribute("aria-pressed", "false");
          wrap.addEventListener("click", function () {
            var on = pre.dataset.wrap !== "on";
            pre.dataset.wrap = on ? "on" : "off";
            wrap.setAttribute("aria-pressed", String(on));
          });
          var copy = mk("复制", "复制代码");
          copy.addEventListener("click", function () {
            copy.textContent = "已复制";
            setTimeout(function () {
              copy.textContent = "复制";
            }, 1600);
            copyText(code.textContent.replace(/\n$/, ""));
          });
          bar.appendChild(wrap);
          bar.appendChild(copy);
          pre.appendChild(bar);
        });
      })();

    <script>
      /* ── 主题三态切换 ── */
      (function () {
        var root = document.documentElement;
        var mq = matchMedia("(prefers-color-scheme: dark)");
        function apply(t) {
          root.dataset.theme = t;
          root.classList.toggle(
            "dark",
            t === "dark" || (t === "system" && mq.matches)
          );
          document.querySelectorAll("[data-theme-set]").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.themeSet === t));
          });
        }
        document.querySelectorAll("[data-theme-set]").forEach(function (b) {
          b.addEventListener("click", function () {
            var t = b.dataset.themeSet;
            try {
              t === "system"

            } catch (e) {}

      /* ── 复制为 Markdown ──
   遍历 #doc（或 [data-md-root]）生成 GFM。跳过 [data-md-skip] / [hidden] / 脚本 / 弹层。 */
      (function () {
        var SKIP = new Set([
          "SCRIPT",
          "STYLE",
          "TEMPLATE",
          "DIALOG",
          "NOSCRIPT",
          "SVG",
          "CANVAS",
        ]);
        var INLINE_ONLY = new Set([
          "A",
          "CODE",
          "STRONG",
          "B",
          "EM",
          "I",
          "DEL",
          "S",
          "SPAN",
          "KBD",
          "SMALL",
          "ABBR",
          "MARK",
          "SUP",
          "SUB",
          "BR",
          "IMG",
          "TIME",
          "MATH",
          "U",
          "Q",
          "LABEL",
          "OUTPUT",
        ]);

        function skipped(el) {
          return (
            SKIP.has(el.tagName.toUpperCase()) ||
            el.hasAttribute("data-md-skip") ||
            el.hasAttribute("hidden") ||
            el.getAttribute("aria-hidden") === "true"
          );
        }
        function txt(s) {
          return (s || "").replace(/\s+/g, " ");
        }

        function inline(node) {
          var out = "";
          node.childNodes.forEach(function (n) {
            if (n.nodeType === 3) {
              out += txt(n.nodeValue);
              return;
            }
            if (n.nodeType !== 1 || skipped(n)) return;
            var t = n.tagName.toUpperCase(),
              inner = inline(n);
            if (t === "MATH") {
              /* 公式导出 LaTeX 源：build 编译时留下的 annotation；没有就退回可读文本 */
              var ann = n.querySelector(
                'annotation[encoding="application/x-tex"]'
              );
              var tex = ann
                ? ann.textContent.trim()
                : txt(n.textContent).trim();
              out +=
                n.getAttribute("display") === "block"
                  ? "\n\n$$" + tex + "$$\n\n"
                  : "$" + tex + "$";
              return;
            }
            if (t === "BR") out += "  \n";
            else if (t === "IMG")
              out +=
                "![" +
                (n.alt || "") +
                "](" +
                (n.getAttribute("src") || "") +
                ")";
            else if (
              t === "CODE" ||
              t === "KBD" ||
              n.classList.contains("badge") ||
              n.classList.contains("kbd")
            )
              out += inner.trim() ? "`" + inner.trim() + "`" : "";
            else if (t === "A") {
              var href = n.getAttribute("href") || "";
              out +=
                href && !href.startsWith("#")
                  ? "[" + inner.trim() + "](" + href + ")"
                  : inner;
            } else if (t === "STRONG" || t === "B")
              out += inner.trim() ? "**" + inner.trim() + "**" : "";
            else if (t === "EM" || t === "I")
              out += inner.trim() ? "*" + inner.trim() + "*" : "";
            else if (t === "DEL" || t === "S")
              out += inner.trim() ? "~~" + inner.trim() + "~~" : "";
            else out += inner;
          });
          return out;
        }

        function cell(el) {
          return inline(el).trim().replace(/\|/g, "\\|").replace(/\n/g, " ");
        }

        function table(el) {
          var rows = Array.from(el.querySelectorAll("tr")).filter(function (r) {
            return !skipped(r);
          });
          if (!rows.length) return "";
          /* 没有表头行的表：全部行当数据，列名留空占位 ——
             否则第一行数据会被当成表头，语义就错了 */
          var hasTh = !!rows[0].querySelector("th");
          var head = rows[0],
            body = hasTh ? rows.slice(1) : rows;
          var cols = Array.from(head.children).map(function (c, i) {
            return hasTh ? cell(c) : "列" + (i + 1);
          });
          var out =
            "| " +
            cols.join(" | ") +
            " |\n|" +
            cols
              .map(function () {
                return " --- ";
              })
              .join("|") +
            "|\n";
          body.forEach(function (r) {
            out += "| " + Array.from(r.children).map(cell).join(" | ") + " |\n";
          });
          return out;
        }

        function list(el, depth) {
          var ordered = el.tagName === "OL",
            i = 0,
            out = "";
          Array.from(el.children).forEach(function (li) {
            if (li.tagName !== "LI" || skipped(li)) return;
            i++;
            var marker = ordered ? i + ". " : "- ";
            var pad = "  ".repeat(depth);
            var sub = "";
            var own = document.createElement("div");
            Array.from(li.childNodes).forEach(function (n) {
              if (
                n.nodeType === 1 &&
                (n.tagName === "UL" || n.tagName === "OL")
              )
                /* 深层嵌套拍平到本级：GFM 对超过 4–5 层的子列表解析不稳，保内容齐整优先 */
                sub += list(n, depth < 6 ? depth + 1 : depth);
              else own.appendChild(n.cloneNode(true));
            });
            var text = inline(own).trim();
            if (text) out += pad + marker + text + "\n";
            out += sub;
          });
          return out;
        }

        function block(el, depth) {
          var out = "";
          Array.from(el.children).forEach(function (n) {
            if (skipped(n)) return;
            var t = n.tagName.toUpperCase();
            if (t === "SUMMARY")
              return; /* DETAILS 分支已单独输出，这里再走一遍会裸文本重复 */
            if (/^H[1-6]$/.test(t)) {
              out += "\n" + "#".repeat(+t[1]) + " " + inline(n).trim() + "\n\n";
            } else if (t === "P") {
              var s = inline(n).trim();
              if (s) out += s + "\n\n";
            } else if (t === "UL" || t === "OL") {
              out += list(n, 0) + "\n";
            } else if (t === "PRE") {
              var code = n.querySelector("code");
              var lang =
                (code &&
                  (code.className.match(/language-([\w+-]+)/) || [])[1]) ||
                "";
              out +=
                "```" +
                lang +
                "\n" +
                /* 取 code 的文本而不是 pre 的：pre 里还有骨架注入的工具条 */
                ((code || n).textContent || "").replace(/\n+$/, "") +
                "\n```\n\n";
            } else if (t === "TABLE") {
              out += table(n) + "\n";
            } else if (t === "MATH") {
              var ann2 = n.querySelector(
                'annotation[encoding="application/x-tex"]'
              );
              out +=
                "$$" +
                (ann2 ? ann2.textContent.trim() : txt(n.textContent).trim()) +
                "$$\n\n";
            } else if (t === "HR") {
              out += "---\n\n";
            } else if (t === "BLOCKQUOTE" || n.classList.contains("alert")) {
              out +=
                block(n, depth)
                  .trim()
                  .split("\n")
                  .map(function (l) {
                    return l ? "> " + l : ">";
                  })
                  .join("\n") + "\n\n";
            } else if (n.classList.contains("tabs")) {
              /* Markdown 没有标签页：每个标签导出成小标题 + 它的面板，隐藏的面板也要出。 */
              n.querySelectorAll('[role="tablist"] > [role="tab"]').forEach(
                function (tab) {
                  out += "**" + inline(tab).trim() + "**\n\n";
                  var panel = document.getElementById(
                    tab.getAttribute("aria-controls")
                  );
                  if (panel) out += block(panel, depth);
                }
              );
            } else if (t === "DETAILS") {
              var sum = n.querySelector("summary");
              if (sum) out += "**" + inline(sum).trim() + "**\n\n";
              out += block(n, depth);
            } else if (t === "DL") {
              Array.from(n.children).forEach(function (d) {
                if (d.tagName === "DT")
                  out += "**" + inline(d).trim() + "** — ";
                else if (d.tagName === "DD") out += inline(d).trim() + "\n\n";
              });
            } else if (
              n.children.length === 0 ||
              Array.from(n.children).every(function (c) {
                return INLINE_ONLY.has(c.tagName);
              })
            ) {
              var s2 = inline(n).trim();
              if (s2) out += s2 + "\n\n";
            } else {
              out += block(n, depth);
            }
          });
          return out;
        }

        function toMarkdown() {
          var root =
            document.querySelector("[data-md-root]") ||
            document.getElementById("doc") ||
            document.body;
          var md = block(root, 0)
            .replace(/\n{3,}/g, "\n\n")
            .trim();
          var title = document.title;
          /* 正文里只要有一级标题就不再拼 <title>：否则 eyebrow 段落排在 h1 前时，
             导出会得到两个「# 」（anti-patterns.md #2）。 */
          var hasH1 = /^# /m.test(md);
          return (hasH1 ? "" : "# " + title + "\n\n") + md + "\n";
        }

        /* 暴露给页面用：需要「下载 .md」之类的额外入口时调用它，不要另写一份转换器。 */
        window.showMeMarkdown = toMarkdown;

        document.querySelectorAll("[data-copy-md]").forEach(function (btn) {
          var icons = btn.querySelectorAll("svg, i");
          btn.addEventListener("click", async function () {
            var md = toMarkdown();
            /* 反馈先行：剪贴板图标换成对勾 1.6s。不等待 writeText —— 权限 pending 时它可能永不 settle。
         SVG 没有 hidden 反射属性，必须操作属性本身 */
            if (icons.length >= 2) {
              icons[0].setAttribute("hidden", "");
              icons[1].removeAttribute("hidden");
            }
            btn.setAttribute("data-variant", "secondary");
            setTimeout(function () {
              if (icons.length >= 2) {
                icons[0].removeAttribute("hidden");
                icons[1].setAttribute("hidden", "");
              }
              btn.setAttribute("data-variant", "outline");

            try {
              await navigator.clipboard.writeText(md);
            } catch (e) {
              var ta = document.createElement("textarea");
              ta.value = md;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand("copy");
              } catch (e2) {}
              ta.remove();
            }

        });

      /* ── 右侧目录：扫描 #doc 的 h2/h3 生成条目，指示条随滚动滑动到当前节。
   移植自 VitePress 的 outline：scroll（throttle 100ms）+ 标题绝对位置比较。
   标题加 data-toc-skip 可豁免；点击时立即定位指示条，平滑滚动途中不跟跳。 ── */
      (function () {
        var doc = document.getElementById("doc");
        var aside = document.querySelector(".toc");
        if (!doc || !aside) return;
        var list = aside.querySelector(".toc-list");
        var marker = aside.querySelector(".toc-marker");
        var headings = Array.from(doc.querySelectorAll("h2, h3")).filter(
          function (h) {
            /* 组件容器内的标题不是节标题：卡片头的 h3、折叠面板的标题都不得进目录。
               否则统计数字写成标题时会产出「7」「91 → 39」这类孤儿条目（anti-patterns.md #1）。 */
            return (
              !h.closest("[data-toc-skip]") &&
              !h.closest("[data-md-skip]") &&
              !h.closest(
                ".card, .fig-box, .alert, .item, .accordion, .dialog, .empty"
              )
            );
          }
        );
        if (headings.length < 2) return;

        /* h3 嵌进前一个 h2 的子列表；没有前置 h2 的 h3 按顶层处理 */
        var n = 0,
          sub = null;
        headings.forEach(function (h) {
          if (!h.id) h.id = "toc-" + ++n;
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.className = "toc-link";
          a.href = "#" + h.id;
          a.textContent = a.title = h.textContent.trim();
          li.appendChild(a);
          if (h.tagName === "H2" || !sub) {
            list.appendChild(li);
            sub = null;
            if (h.tagName === "H2") {
              sub = document.createElement("ul");
              sub.className = "toc-list nested";
              li.appendChild(sub);
            }
          } else {
            sub.appendChild(li);
          }
        });
        document.body.classList.add("has-toc");

        var mq = matchMedia("(min-width: 80rem)");
        var prev = null,
          skipOnce = false;

        function topOf(el) {
          var t = 0;
          while (el !== document.body) {
            if (el === null)
              return NaN; /* display:none 的元素拿不到位置，自然被过滤 */
            t += el.offsetTop;
            el = el.offsetParent;
          }
          return t;
        }

        function activate(hash) {
          if (prev) prev.classList.remove("active");
          prev = null;
          if (hash) {
            var links = list.querySelectorAll("a");
            for (var i = 0; i < links.length; i++) {
              if (links[i].getAttribute("href") === hash) {
                prev = links[i];
                break;
              }
            }
          }
          if (prev) {
            prev.classList.add("active");
            /* 链接的 offsetParent 是 .toc-list，指示条的参照是 .toc-inner，两者原点要补齐 */
            marker.style.top =
              prev.offsetTop +
              (prev.offsetParent ? prev.offsetParent.offsetTop : 0) +
              (prev.offsetHeight - marker.offsetHeight) / 2 +
              "px";
            marker.style.opacity = "1";
          } else {
            marker.style.top = "";
            marker.style.opacity = "0";
          }
        }

        var geom =
          null; /* 缓存的标题几何：resize 后失效，滚动时不再逐个读 offsetTop */
        function measure() {
          geom = headings
            .map(function (h) {
              return {
                id: h.id,
                top: topOf(h),
                sm: parseFloat(getComputedStyle(h).scrollMarginTop) || 0,
              };
            })
            .filter(function (x) {
              return !isNaN(x.top);
            })
            .sort(function (a, b) {
              return a.top - b.top;
            });
        }

        function setActive() {
          if (!mq.matches) return;
          if (skipOnce) {
            skipOnce = false;
            return;
          }
          if (!geom) measure();
          var items = geom;
          if (!items.length) return activate(null);
          if (scrollY < 1) return activate(null); /* 页顶：无激活项 */
          if (
            Math.ceil(scrollY + innerHeight) >=
            document.documentElement.scrollHeight
          )
            return activate(
              "#" + items[items.length - 1].id
            ); /* 页底：激活最后一项 */
          var active = null;
          for (var i = 0; i < items.length; i++) {
            if (items[i].top > scrollY + items[i].sm + 4) break;
            active = items[i].id;
          }
          activate(active ? "#" + active : null);
        }

        aside.addEventListener("click", function (e) {
          var a = e.target instanceof Element ? e.target.closest("a") : null;
          if (a && a.hash) {
            skipOnce = true;
            activate(a.hash);
          }
        });
        var ticking = false;
        addEventListener(
          "scroll",
          function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {
              ticking = false;
              setActive();
            });
          },
          { passive: true }
        );
        addEventListener("resize", function () {
          geom = null;
          setActive();
        });
        addEventListener(
          "load",
          setActive
        ); /* 等浏览器恢复滚动位置后再定位一次 */
        mq.addEventListener("change", setActive);
        setActive();
      })();
    </script>
    <script>
      (() => {

        // ════ F13 · Nested Treemap ════
        (() => {
          // 嵌套矩形树图：squarify 布局，面积 = 工时。父组靠标题带和组间留白分开，叶子同一明度；主角 = 最大叶子描一圈橙边（整块涂橙会压过面积本身）。
          const GROUPS = [
            [
              "PRODUCT",
              [
                ["Core app", 260],
                ["Collaboration", 190],
                ["Search", 110],
                ["Mobile", 80],
              ],
            ],
            [
              "PLATFORM",
              [
                ["AI systems", 170],
                ["Data infra", 120],
                ["APIs", 105],
              ],
            ],
            [
              "GROWTH",
              [
                ["Acquisition", 90],
                ["Retention", 80],
                ["Onboarding", 75],
              ],
            ],
          ];
          const squarify = (items, x, y, w, h) => {
            // items:[name,value] 已按值降序；返回 [{name,value,x,y,w,h}]
            const out = [],
              total = items.reduce((a, d) => a + d[1], 0);
            let rest = [...items];
            const worst = (row, len) => {
              const s = row.reduce((a, d) => a + d.a, 0),
                mx = Math.max(...row.map((d) => d.a)),
                mn = Math.min(...row.map((d) => d.a));
              return Math.max(
                (len * len * mx) / (s * s),
                (s * s) / (len * len * mn)
              );
            };
            let cx = x,
              cy = y,
              cw = w,
              ch = h;
            while (rest.length) {
              const vert = cw >= ch,
                len = vert ? ch : cw;
              let row = [],
                i = 0;
              while (i < rest.length) {
                const a = (rest[i][1] / total) * w * h,
                  cand = [...row, { d: rest[i], a }];
                if (row.length && worst(cand, len) > worst(row, len)) break;
                row = cand;
                i++;
              }
              const s = row.reduce((a, d) => a + d.a, 0),
                thick = s / len;
              let off = 0;
              row.forEach(({ d, a }) => {
                const l = a / thick;
                out.push(
                  vert
                    ? {
                        name: d[0],
                        value: d[1],
                        x: cx,
                        y: cy + off,
                        w: thick,
                        h: l,
                      }
                    : {
                        name: d[0],
                        value: d[1],
                        x: cx + off,
                        y: cy,
                        w: l,
                        h: thick,
                      }
                );
                off += l;
              });
              if (vert) {
                cx += thick;
                cw -= thick;
              } else {
                cy += thick;
                ch -= thick;
              }
              rest = rest.slice(i);
            }
            return out;
          };
          reveal($("treemap"), (s) => {
            const TOTAL = GROUPS.flatMap((g) => g[1]).reduce(
                (a, d) => a + d[1],
                0
              ),
              W = 800,
              H = 320,
              GAP = 6,
              BAND = 18;
            const gs = squarify(
              GROUPS.map((g) => [
                g[0],
                g[1].reduce((a, d) => a + d[1], 0),
              ]).sort((a, b) => b[1] - a[1]),
              0,
              0,
              W,
              H
            );
            const heroLeaf = GROUPS.flatMap((g) => g[1]).sort(
              (a, b) => b[1] - a[1]
            )[0][0];
            gs.forEach((g, gi) => {
              const kids = GROUPS.find((x) => x[0] === g.name)[1]
                .slice()

              );

                kids,
                g.x + GAP / 2,

                  rx: 6,
                  fill: I70,
                  stroke: hero ? HERO : "none",
                  "stroke-width": hero ? 2.5 : 0,
                  class: "pop",
                  style: `transform-origin:${leaf.x + leaf.w / 2}px ${leaf.y + leaf.h / 2}px;animation-delay:${gi * 0.1 + li * 0.06}s`,
                });
                tip(
                  r,
                  `${g.name} / ${leaf.name} — ${leaf.value} h · ${((leaf.value / TOTAL) * 100).toFixed(1)}%`
                );
                if (leaf.w > 70 && leaf.h > 34) {
                  txt(

                      x: leaf.x + 10,
                      y: leaf.y + 18,
                      "font-size": 10,
                      "font-weight": 600,

        // ════ F14 · Rung Histogram ════
        (() => {
          // 直方图的 Lupi Basics 皮：连续数值分箱，一箱一把梯子，1 档 = 1 张工单
          // （百分之一）。箱界写在梯脚之间——直方图的箱是区间不是类目，
          // 这是它和 F1 Rung Bars 的本质区别。峰值箱标数，中位数落点小旗标注。
          const BIN = [6, 14, 22, 19, 13, 9, 6, 4, 3, 2, 1, 1]; // 2h bins, sums to 100
          reveal($("histo"), (s) => {
            const X0 = 44,

            el(s, "line", {

            let acc = 0,

            txt(

        // ════ F15 · Tick Box ════
        (() => {
          // 箱线图的 Basics 皮：发丝须线 + 胶囊箱体（IQR），纸色横档 = 中位数，

          const G = [

        // ════ F16 · Stream Ribbon ════
        (() => {
          // Streamgraph / ThemeRiver：多系列构成随时间此消彼长。轮廓对称于中轴
          // （silhouette 基线），带宽 = 该系列当周量，纸色缝分带（treemap 同法）。
          // 三带明度按当前份额排：现任霸主最黑。带名标在各自最宽处。
          const N = 48;
          const mk = (base, trend, w1, w2, seed) =>
            Array.from({ length: N }, (_, t) =>
              Math.max(
                2,
                base +
                  trend * t +
                  10 * Math.sin(t / w1 + seed) +
                  5 * Math.sin(t / w2 + seed * 2) +
                  rnd(t + 1, seed) * 6
              )
            );
          const SERIES = [
            ["LEGACY EDITOR", mk(46, -0.62, 9, 3.7, 2), I22],
            ["BOARDS", mk(26, 0.1, 11, 4.2, 5), I45],
            ["FLOWS", mk(12, 0.78, 10, 3.1, 8), INK],
          ];
          reveal($("stream"), (s) => {
            const X0 = 36,
              X1 = 744,
              CY = 138,
              SC = 1.15;
            const x = (t) => X0 + (t / (N - 1)) * (X1 - X0);
            const tot = Array.from({ length: N }, (_, t) =>
              SERIES.reduce((a, S) => a + S[1][t], 0)
            );
            // stacked offsets, silhouette baseline: top of stack starts at -total/2
            const y0 = Array.from(
              { length: N },
              (_, t) => CY - (tot[t] * SC) / 2
            );
            const smooth = (pts) => {
              let d = `M${pts[0][0].toFixed(1)} ${pts[0][1].toFixed(1)}`;
              for (let k = 1; k < pts.length - 1; k++) {
                const p = pts[k],
                  q = pts[k + 1];
                d += ` Q${p[0].toFixed(1)} ${p[1].toFixed(1)} ${((p[0] + q[0]) / 2).toFixed(1)} ${((p[1] + q[1]) / 2).toFixed(1)}`;
              }
              return (
                d +
                ` L${pts[pts.length - 1][0].toFixed(1)} ${pts[pts.length - 1][1].toFixed(1)}`
              );
            };
            let run = y0.slice();
            SERIES.forEach(([name, vals, shade], si) => {
              const top = run.map((v, t) => [x(t), v]);
              const bot = run.map((v, t) => [x(t), v + vals[t] * SC]);
              run = bot.map((p) => p[1]);
              const d =
                smooth(top) +
                " L " +
                [...bot]
                  .reverse()
                  .map((p) => `${p[0].toFixed(1)} ${p[1].toFixed(1)}`)
                  .join(" L ") +
                " Z";
              const band = el(s, "path", {
                d,
                fill: shade,
                stroke: PAPER,
                "stroke-width": 2,
                class: "fade",
                style: `animation-delay:${si * 0.16}s`,
              });
              tip(band, `${name} — weekly active accounts, 48 weeks`);
              // label at the band's widest week — clamped off both ends so the
              // paper-colored text never spills past the band onto paper (invisible)
              let wk = 4;
              vals.forEach((v, t) => {
                if (t >= 4 && t <= N - 6 && v > vals[wk]) wk = t;
              });
              const midY = (top[wk][1] + bot[wk][1]) / 2;
              const dark = shade === INK || shade === I70;
              txt(
                s,
                {
                  x: x(wk),
                  y: midY + 3,
                  "font-size": 9,
                  "font-weight": 600,
                  "text-anchor": "middle",
                  fill: dark ? PAPER : I70,
                  "letter-spacing": ".06em",
                  class: "fade",
                  style: `animation-delay:${0.5 + si * 0.14}s`,
                },
                name
              );
            });
            // month floor: barcode ticks + labels every 8 weeks
            const base = 252;
            el(s, "line", {
              x1: X0 - 6,
              y1: base,
              x2: X1 + 6,
              y2: base,
              stroke: GRID,
              "stroke-width": 0.8,
              class: "fade",
            });
            for (let t = 0; t < N; t++)
              el(s, "line", {
                x1: x(t),
                y1: base,
                x2: x(t),
                y2: base - (t % 8 === 0 ? 7 : 4),
                stroke: I14,
                "stroke-width": 0.6,
                class: "fade",
                style: `animation-delay:${t * 0.006}s`,
              });
            ["JAN", "MAR", "MAY", "JUL", "SEP", "NOV"].forEach((m, k) =>
              txt(
                s,
                {
                  x: x(k * 8),
                  y: base + 15,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "middle",
                  "letter-spacing": ".1em",
                  class: "fade",

            txt(
              s,
              {
                x: 390,
                y: 288,
                "font-size": 7,
                "font-weight": 600,
                fill: I30,
                "text-anchor": "middle",
                "letter-spacing": ".12em",
                class: "fade",
                style: "animation-delay:1.1s",

              "BAND WIDTH = WEEKLY ACTIVES · DARKEST = TODAY’S LEADER · THE RIVER IS THE TOTAL"
            );
          });
        })();

        // ════ F17 · Candlestick ════
        (() => {
          // K 线的 Mono 化：不用红绿——实心墨 = 收跌，空心（纸底墨框）= 收涨，
          // 和哑铃图 hollow/ink 的语义一脉。影线是发丝，柱体胶囊圆角。
          // OHLC 四值都是真实记录，最高/最低两日标数。30 个交易日。
          const N = 30;
          // deterministic random walk with a dip-and-recover arc
          const DAYS = [];
          let px = 52;
          for (let d = 0; d < N; d++) {
            const drift = d < 10 ? 0.4 : d < 18 ? -1.5 : 1.3;
            const open = px;
            const close = Math.max(
              30,
              open + drift + (rnd(d + 1, 3) - 0.5) * 4.6
            );
            const hi = Math.max(open, close) + rnd(d + 2, 7) * 2.6;
            const lo = Math.min(open, close) - rnd(d + 3, 11) * 2.6;
            DAYS.push([open, close, hi, lo]);
            px = close;
          }
          reveal($("candle"), (s) => {
            const X0 = 40,
              PW = 11.2,
              BASE = 258,
              TOP = 44;
            const vmin = Math.min(...DAYS.map((d) => d[3])),
              vmax = Math.max(...DAYS.map((d) => d[2]));
            const mapY = (v) =>
              BASE - ((v - vmin) / (vmax - vmin)) * (BASE - TOP);
            const x = (d) => X0 + d * PW + PW / 2;
            // price grid
            for (let g = 0; g <= 4; g++) {
              const v = vmin + (g / 4) * (vmax - vmin);
              el(s, "line", {
                x1: X0 - 4,
                y1: mapY(v),
                x2: X0 + N * PW + 4,
                y2: mapY(v),
                stroke: I8,
                "stroke-width": 0.8,
                class: "fade",
                style: `animation-delay:${g * 0.03}s`,
              });
              txt(
                s,
                {
                  x: X0 - 8,
                  y: mapY(v) + 3,
                  "font-size": 7.5,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "end",
                  class: "fade",
                  style: `animation-delay:${g * 0.03}s`,
                },
                "$" + Math.round(v)
              );
            }
            let hiD = 0,
              loD = 0;
            DAYS.forEach(([o, c, h, l], d) => {
              if (h > DAYS[hiD][2]) hiD = d;
              if (l < DAYS[loD][3]) loD = d;
            });
            DAYS.forEach(([o, c, h, l], d) => {
              const cx = x(d),
                up = c >= o;
              const yT = mapY(Math.max(o, c)),
                yB = mapY(Math.min(o, c));
              // wick: one hairline, full reach
              el(s, "line", {
                x1: cx,
                y1: mapY(h),
                x2: cx,
                y2: mapY(l),
                stroke: I60,
                "stroke-width": 0.7,
                class: "fade",
                style: `animation-delay:${d * 0.03}s`,
              });
              // body: capsule; hollow = up, ink = down
              const body = el(s, "rect", {
                x: cx - 3.4,
                y: yT,
                width: 6.8,
                height: Math.max(2.5, yB - yT),
                rx: 3,
                ...(up
                  ? { fill: PAPER, stroke: INK, "stroke-width": 1.1 }
                  : { fill: INK }),
                class: "fade",
                style: `animation-delay:${0.05 + d * 0.03}s`,
              });
              tip(
                body,
                `Day ${d + 1} — open $${o.toFixed(1)} · close $${c.toFixed(1)} · high $${h.toFixed(1)} · low $${l.toFixed(1)}`
              );
              // extremes, labeled with hairline flags
              if (d === hiD)
                txt(
                  s,
                  {
                    x: cx,
                    y: mapY(h) - 7,
                    "font-size": 8,
                    "font-weight": 600,
                    fill: INK,
                    "text-anchor": "middle",
                    style: `paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1s`,
                    class: "fade",
                  },
                  "$" + Math.round(h)
                );
              if (d === loD)
                txt(
                  s,
                  {
                    x: cx,
                    y: mapY(l) + 14,
                    "font-size": 8,
                    "font-weight": 600,
                    fill: I60,
                    "text-anchor": "middle",
                    style: `paint-order:stroke;stroke:${PAPER};stroke-width:3px;animation-delay:1s`,
                    class: "fade",
                  },
                  "$" + Math.round(l)
                );
            });
            // week ticks on the floor
            el(s, "line", {
              x1: X0 - 4,
              y1: BASE + 8,
              x2: X0 + N * PW + 4,
              y2: BASE + 8,
              stroke: GRID,
              "stroke-width": 0.8,
              class: "fade",
            });
            for (let d = 0; d < N; d++)
              el(s, "line", {
                x1: x(d),
                y1: BASE + 8,
                x2: x(d),
                y2: BASE + 8 - (d % 5 === 0 ? 6 : 3),
                stroke: I14,
                "stroke-width": 0.6,
                class: "fade",
                style: `animation-delay:${d * 0.008}s`,
              });
            ["W1", "W2", "W3", "W4", "W5", "W6"].forEach((w, k) =>
              txt(
                s,
                {
                  x: x(k * 5),
                  y: BASE + 21,
                  "font-size": 7,
                  "font-weight": 600,
                  fill: MUTED,
                  "text-anchor": "middle",
                  "letter-spacing": ".08em",
