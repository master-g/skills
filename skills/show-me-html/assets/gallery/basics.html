    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <!--SHOW-ME:JS-->
    <script>
      (() => {
        const { el, txt, tip, rnd, pol, sect, blob, reveal, fmt } = showMeChart;
        const $ = (id) => document.getElementById(id);
        const INK = "var(--ink)",
          PAPER = "var(--paper)",
          HERO = "var(--chart-hero)";
        const I90 = "var(--ink-90)",
          I70 = "var(--ink-70)",
          I60 = "var(--ink-60)",
          I45 = "var(--ink-45)",
          I30 = "var(--ink-30)",
          I22 = "var(--ink-22)",
          I14 = "var(--ink-14)",
          I8 = "var(--ink-8)";
        const MUTED = I45,
          GRID = I14,
          FAINT = I22;
        const LAD = [INK, I70, I45, I30, I22]; // 5 级：少系列
        const L = [INK, I90, I70, I60, I45, I30, I22]; // 7 级：多系列
        const D2R = Math.PI / 180;
        const dl = (s) => `animation-delay:${s.toFixed(3)}s`; // 交错入场延迟
        const halo =
          "paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round"; // 文字描边遮线

        // ════ F1 · Rung Bars ════
        (() => {
          // 梯档柱：一档 = 100 册，柱高 = 档数 × 档距，从零起不截断；每满 10 档那一档加长、用实墨，千册一数。
          // 档的横向长度带确定性抖动（不编码数据），档数与档距不抖。按借出量从高到低排，
          // 三个小馆正好相邻，一条虚线导轨把三馆合计抬到东湖柱旁，读者自己比高低。
          // 东湖本身最高，几何已凸显，不上主角色。6 根柱静态即可，整柱 hover 出读数。
          const { G, jit, tick, value, label } = showMeChart;
          const BRANCH = [
            ["东湖", 34],
            ["老城", 26],
            ["西山", 12],
            ["北岸", 11],
            ["南桥", 9],
            ["新港", 7],
          ];
          const TRIO = ["西山", "北岸", "南桥"],
            trio = BRANCH.filter(([n]) => TRIO.includes(n)).reduce(
              (a, b) => a + b[1],
              0
            );
          reveal($("loans"), (s) => {
            const X0 = 56,
              X1 = 380,
              BASE = 206,
              STEP = 5.2,
              HALF = 14;
            const slot = (X1 - X0) / BRANCH.length,
              cx = (i) => X0 + slot * (i + 0.5),
              y = (n) => BASE - n * STEP;
            for (let n = 10; n <= 30; n += 10) {
              el(s, "line", {
                x1: X0 - 4,
                x2: X1,
                y1: y(n),
                y2: y(n),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 8, y: y(n) + 2.2, "text-anchor": "end" }),
                fmt(n * 100)
              );
            }
            txt(s, tick({ x: X0 - 8, y: BASE + 2.2, "text-anchor": "end" }), 0);
            txt(
              s,
              tick({ x: X0 - 8, y: y(34) - 6, "text-anchor": "end" }),
              "册"
            );
            el(s, "line", {
              x1: X0 - 4,
              x2: X1,
              y1: BASE,
              y2: BASE,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            BRANCH.forEach(([name, n], i) => {
              const x = cx(i),
                g = el(s, "g", {
                  class: "rise",
                  style: `transform-origin:${x}px ${BASE}px;${dl(0.05 + i * 0.08)}`,
                });
              for (let k = 1; k <= n; k++) {
                const full = k % 10 === 0,
                  w =
                    HALF * (full ? 1.22 : 1 + jit(i * 60 + k, 5, G.jitter.len));
                el(g, "line", {
                  x1: x - w,
                  x2: x + w,
                  y1: y(k),
                  y2: y(k),
                  stroke: full ? G.ink.strong : G.ink.data,
                  "stroke-width": full ? G.line.base : G.line.data,
                });
              }
              const hit = el(s, "rect", {
                x: x - slot / 2,
                y: y(n) - 4,
                width: slot,
                height: n * STEP + 4,
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(hit, `${name}分馆 · 9 月借出 ${fmt(n * 100)} 册`);
              txt(
                s,
                value({ x, y: y(n) - 7, "text-anchor": "middle" }),
                fmt(n * 100)
              );
              txt(s, label({ x, y: BASE + 15, "text-anchor": "middle" }), name);
            });
            // 三馆合计导轨：从老城右侧拉到南桥右缘，东湖顶端高出它两档
            const gx0 = cx(0) + HALF + 6,
              gx1 = cx(4) + HALF;
            el(s, "line", {
              x1: gx0,
              x2: gx1,
              y1: y(trio),
              y2: y(trio),
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
              "stroke-dasharray": "4 3",
              class: "fade",
              style: dl(0.7),
            });
            txt(
              s,
              tick({
                x: gx1,
                y: y(trio) - 4,
                "text-anchor": "end",
                class: "fade",
                style: dl(0.7),
              }),
              `${TRIO.join(" + ")} = ${fmt(trio * 100)}`
            );
          });
        })();

        // ════ F2 · Hairline Line ════
        (() => {
          // 发丝折线：一点 = 一天的读数，横轴逐日等距，纵轴从零起、线性。实心点 = 工作日，空心点 = 周末。
          // 家具：底部日历刻度每天一根（周末短一截），每 100 通一道虚线网格，一条升级前工作日均值的虚线导轨。
          // 只标峰值一个数；峰值本身最高，几何已凸显，不上主角色。30 个点、两端有标注，静态即可，点上 hover 出读数。
          const { G, jit, tick, value } = showMeChart;
          const DAYS = 30,
            UPGRADE = 14; // 9 月 14 日（周一）系统升级
          // 9 月 1 日是周二：d % 7 为 5、6 的是周六、周日
          const calls = Array.from({ length: DAYS }, (_, i) => {
            const d = i + 1,
              off = d % 7 >= 5;
            const base = off ? 100 + rnd(d, 31) * 34 : 186 + rnd(d, 32) * 44;
            // 升级当天来电约为平日两倍多，超出部分按天指数消退
            const surge =
              d < UPGRADE ? 1 : 1 + 1.3 * Math.exp(-(d - UPGRADE) / 2.3);
            return { d, off, v: Math.round(base * surge) };
          });
          const before = calls.filter((c) => c.d < UPGRADE && !c.off),
            norm = Math.round(
              before.reduce((a, c) => a + c.v, 0) / before.length
            ),
            peak = calls.reduce((a, c) => (c.v > a.v ? c : a));
          reveal($("hotline"), (s) => {
            const X0 = 46,
              X1 = 350,
              Y0 = 252,
              TOP = 64,
              top = Math.ceil(peak.v / 100) * 100;
            const x = (d) => X0 + ((d - 1) * (X1 - X0)) / (DAYS - 1),
              y = (v) => Y0 - (v / top) * (Y0 - TOP);
            for (let v = 100; v <= top; v += 100) {
              el(s, "line", {
                x1: X0 - 6,
                x2: X1,
                y1: y(v),
                y2: y(v),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 10, y: y(v) + 2.2, "text-anchor": "end" }),
                v
              );
            }
            txt(s, tick({ x: X0 - 10, y: Y0 + 2.2, "text-anchor": "end" }), 0);
            txt(
              s,
              tick({ x: X0 - 10, y: TOP - 14, "text-anchor": "end" }),
              "通/天"
            );
            el(s, "line", {
              x1: X0 - 6,
              x2: X1 + 4,
              y1: Y0,
              y2: Y0,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            // 日历地板：没来电的日子也有一根，日历不会缺格
            calls.forEach((c) =>
              el(s, "line", {
                x1: x(c.d),
                x2: x(c.d),
                y1: Y0 + 3,
                y2:
                  Y0 + 3 + (c.off ? 3.5 : 7) * (1 + jit(c.d, 3, G.jitter.len)),
                stroke: G.ink.data,
                "stroke-width": G.line.data,
              })
            );
            [
              [1, "9/1"],
              [UPGRADE, "9/14 升级"],
              [DAYS, "9/30"],
            ].forEach(([d, t]) =>
              txt(s, tick({ x: x(d), y: Y0 + 22, "text-anchor": "middle" }), t)
            );
            // 升级日竖导轨：从地板到峰值下方
            el(s, "line", {
              x1: x(UPGRADE),
              x2: x(UPGRADE),
              y1: Y0,
              y2: y(peak.v) + 6,
              stroke: G.ink.guide,
              "stroke-width": G.line.grid,
              "stroke-dasharray": "1 3",
            });
            // 升级前工作日均值导轨：伸出数据区，读数写在右侧留白，不压数据点
            el(s, "line", {
              x1: X0,
              x2: X1 + 12,
              y1: y(norm),
              y2: y(norm),
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
              "stroke-dasharray": "4 3",
            });
            txt(s, tick({ x: X1 + 16, y: y(norm) - 2 }), "日均");
            txt(s, value({ x: X1 + 16, y: y(norm) + 7 }), norm);
            el(s, "path", {
              d:
                "M" +
                calls
                  .map((c) => `${x(c.d).toFixed(1)} ${y(c.v).toFixed(1)}`)
                  .join("L"),
              fill: "none",
              stroke: G.ink.strong,
              "stroke-width": G.line.data,
              "stroke-linejoin": "round",
              pathLength: 1,
              class: "draw",
            });
            calls.forEach((c, i) => {
              const isPeak = c === peak,
                dot = el(s, "circle", {
                  cx: x(c.d),
                  cy: y(c.v),
                  r: isPeak ? G.dot.head : G.dot.mark,
                  fill: c.off ? "var(--color-card)" : G.ink.strong,
                  stroke: G.ink.strong,
                  "stroke-width": G.line.data,
                  class: "pop",
                  style: dl(0.35 + i * 0.022),
                });
              tip(dot, `9 月 ${c.d} 日${c.off ? "（周末）" : ""} · ${c.v} 通`);
            });
            txt(
              s,
              value({
                x: x(peak.d),
                y: y(peak.v) - 8,
                "text-anchor": "middle",
              }),
              peak.v
            );
          });
        })();

        // ════ F3 · Hairline Area ════
        (() => {
          // 发丝面积：一根竖发丝 = 一天，从地面画到当天入园人数，面积由 48 根发丝排出来，不是填色。
          // 横轴逐日等距，纵轴从零起、线性；顶沿一条实墨折线把发丝头连起来，周末的发丝用实墨、平日用淡墨。
          // 闭园两天读数为 0，只留地面刻度，缺口本身就是事件。一条虚线导轨 = 闭园前周末均值，
          // 重开后第一个周末的两天标数，和导轨一比就是「只回来七成」。48 根发丝静态即可，发丝 hover 出读数。
          const { G, jit, tick, value, label } = showMeChart;
          const N = 48,
            SHUT = [19, 20]; // 7 月 29、30 日台风闭园
          const days = Array.from({ length: N }, (_, i) => {
            const dt = new Date(2026, 6, 10 + i),
              w = dt.getDay(),
              off = w === 0 || w === 6;
            let v = off ? 10.2 + rnd(i, 41) * 1.8 : 5.6 + rnd(i, 42) * 1.3;
            // 重开后客流按天指数回升
            if (i > SHUT[1]) v *= 1 - 0.5 * Math.exp(-(i - SHUT[1] - 1) / 2.4);
            if (SHUT.includes(i)) v = 0;
            return {
              i,
              m: dt.getMonth() + 1,
              d: dt.getDate(),
              off,
              v: +v.toFixed(1),
            };
          });
          const before = days.filter((c) => c.i < SHUT[0] && c.off),
            norm = before.reduce((a, c) => a + c.v, 0) / before.length,
            back = days.filter((c) => c.i > SHUT[1] && c.off).slice(0, 2);
          reveal($("wetland"), (s) => {
            const X0 = 42,
              X1 = 340,
              Y0 = 200,
              TOP = 30,
              MAX = 12;
            const x = (i) => X0 + (i * (X1 - X0)) / (N - 1),
              y = (v) => Y0 - (v / MAX) * (Y0 - TOP);
            for (let v = 4; v <= MAX; v += 4) {
              el(s, "line", {
                x1: X0 - 6,
                x2: X1,
                y1: y(v),
                y2: y(v),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 10, y: y(v) + 2.2, "text-anchor": "end" }),
                v
              );
            }
            txt(s, tick({ x: X0 - 10, y: Y0 + 2.2, "text-anchor": "end" }), 0);
            txt(
              s,
              tick({ x: X0 - 10, y: TOP - 14, "text-anchor": "end" }),
              "千人"
            );
            days.forEach((c) => {
              // 地面刻度：每天一根，月初加长
              el(s, "line", {
                x1: x(c.i),
                x2: x(c.i),
                y1: Y0 + 2,
                y2: Y0 + 2 + (c.d === 1 ? 8 : 3.5),
                stroke: G.ink.quiet,
                "stroke-width": G.line.grid,
              });
              const hit = el(s, "rect", {
                x: x(c.i) - 3.6,
                y: TOP,
                width: 7.2,
                height: Y0 - TOP,
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(
                hit,
                `${c.m} 月 ${c.d} 日${c.off ? "（周末）" : ""} · ${c.v ? c.v + " 千人" : "闭园"}`
              );
              if (!c.v) return;
              el(s, "line", {
                x1: x(c.i) + jit(c.i, 9, G.jitter.pos),
                x2: x(c.i) + jit(c.i, 9, G.jitter.pos),
                y1: Y0,
                y2: y(c.v),
                stroke: c.off ? G.ink.strong : G.ink.data,
                "stroke-width": G.line.data,
                class: "rise",
                style: `transform-origin:0 ${Y0}px;${dl(c.i * 0.014)}`,
              });
            });
            el(s, "line", {
              x1: X0 - 6,
              x2: X1 + 4,
              y1: Y0,
              y2: Y0,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            // 顶沿：闭园处断开，不把 0 连成一道深谷
            const seg = (a) =>
              "M" +
              a
                .map((c) => `${x(c.i).toFixed(1)} ${y(c.v).toFixed(1)}`)
                .join("L");
            [days.slice(0, SHUT[0]), days.slice(SHUT[1] + 1)].forEach((a) =>
              el(s, "path", {
                d: seg(a),
                fill: "none",
                stroke: G.ink.strong,
                "stroke-width": G.line.base,
                "stroke-linejoin": "round",
                pathLength: 1,
                class: "draw",
                style: dl(0.5),
              })
            );
            [
              [0, "7/10"],
              [22, "8/1"],
              [N - 1, "8/26"],
            ].forEach(([i, t]) =>
              txt(
                s,
                tick({
                  x: x(i),
                  y: Y0 + 20,
                  "text-anchor": i ? (i === N - 1 ? "end" : "middle") : "start",
                }),
                t
              )
            );
            const gap = (x(SHUT[0]) + x(SHUT[1])) / 2;
            txt(
              s,
              label({ x: gap, y: Y0 - 30, "text-anchor": "middle" }),
              "台风"
            );
            txt(
              s,
              label({ x: gap, y: Y0 - 20, "text-anchor": "middle" }),
              "闭园"
            );
            // 闭园前周末均值导轨
            el(s, "line", {
              x1: X0,
              x2: X1,
              y1: y(norm),
              y2: y(norm),
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
              "stroke-dasharray": "4 3",
            });
            txt(s, tick({ x: X1 + 8, y: y(norm) - 2 }), "闭园前");
            txt(
              s,
              tick({ x: X1 + 8, y: y(norm) + 7 }),
              `周末均 ${norm.toFixed(1)}`
            );
            back.forEach((c, k) =>
              txt(
                s,
                value({
                  x: x(c.i) + (k ? 5 : -5),
                  y: y(c.v) - 6,
                  "text-anchor": k ? "start" : "end",
                }),
                c.v
              )
            );
          });
        })();

        // ════ F4 · Tick Donut ════
        (() => {
          // 刻度环：100 根径向刻度 = 100%，一根 = 1% 的重量，从正上方顺时针排。
          // 类目按占比从大到小接续，墨色四级区分；每满 10% 在环外点一粒小点，好数。
          // 类目名与百分比写在各段中角的环外，发丝引线连回环；环心写标题所指的厨余占比。
          // 厨余占一半多，几何已凸显，不上主角色。100 根刻度静态即可，每段 hover 出重量与占比。
          const { G, jit, tick, value, label } = showMeChart;
          const KG = 1860; // 9 月全小区分出的生活垃圾，千克
          const PART = [
            ["厨余垃圾", 52, G.ink.strong],
            ["其他垃圾", 29, G.ink.data],
            ["可回收物", 17, G.ink.quiet],
            ["有害垃圾", 2, G.ink.strong],
          ];
          reveal($("sorting"), (s) => {
            const CX = 196,
              CY = 124,
              R0 = 70,
              R1 = 94;
            const ang = (k) => -90 + k * 3.6;
            let k0 = 0;
            PART.forEach(([name, pct, ink], p) => {
              for (let k = k0; k < k0 + pct; k++) {
                const a = ang(k + 0.5),
                  inner = R0 + jit(k, 13, 3);
                const [xa, ya] = pol(CX, CY, inner, a),
                  [xb, yb] = pol(CX, CY, R1, a);
                el(s, "line", {
                  x1: xa,
                  y1: ya,
                  x2: xb,
                  y2: yb,
                  stroke: ink,
                  "stroke-width": p === 3 ? G.line.heroData : G.line.data,
                  "stroke-dasharray": p === 3 ? "2 1.4" : null,
                  class: "fade",
                  style: dl(0.1 + k * 0.009),
                });
              }
              const hit = el(s, "path", {
                d: sect(CX, CY, R0 - 4, R1 + 4, ang(k0), ang(k0 + pct)),
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(hit, `${name} · ${pct}% · 约 ${fmt((KG * pct) / 100)} 千克`);
              // 环外标注：中角方向，左半边右对齐
              const mid = ang(k0 + pct / 2),
                right = Math.cos(mid * D2R) >= 0,
                [lx0, ly0] = pol(CX, CY, R1 + 4, mid),
                [lx1, ly1] = pol(CX, CY, R1 + 18, mid),
                ex = lx1 + (right ? 10 : -10);
              el(s, "path", {
                d: `M${lx0} ${ly0}L${lx1} ${ly1}H${ex}`,
                fill: "none",
                stroke: G.ink.quiet,
                "stroke-width": G.line.grid,
              });
              const anchor = right ? "start" : "end",
                tx = ex + (right ? 3 : -3);
              txt(
                s,
                label({ x: tx, y: ly1 - 1.5, "text-anchor": anchor }),
                name
              );
              txt(
                s,
                value({ x: tx, y: ly1 + 8.5, "text-anchor": anchor }),
                `${pct}%`
              );
              k0 += pct;
            });
            // 每满 10% 一粒点
            for (let k = 0; k < 100; k += 10) {
              const [x, y] = pol(CX, CY, R1 + 5, ang(k));
              el(s, "circle", {
                cx: x,
                cy: y,
                r: G.dot.tick,
                fill: G.ink.quiet,
              });
            }
            txt(
              s,
              value({
                x: CX,
                y: CY + 6,
                "text-anchor": "middle",
                "font-size": 22,
              }),
              `${PART[0][1]}%`
            );
            txt(
              s,
              tick({ x: CX, y: CY + 20, "text-anchor": "middle" }),
              "是厨余"
            );
          });
        })();

        // ════ F5 · Tick Rows ════
        (() => {
          // 刻度行：一行 = 一类志愿活动，一根竖刻度 = 办过的一场，从左往右排队，行长 = 场数 × 固定间距。
          // 每 5 场之后空半格，五根一组好数；类目名是长中文，单独占一行写在刻度上方，行尾写场数。
          // 刻度的高度带确定性抖动（不编码数据），场数与间距不抖。按场数从多到少排。
          // 第一行本身最长，几何已凸显，不上主角色。6 行静态即可，整行 hover 出读数。
          const { G, jit, tick, value, label } = showMeChart;
          const KIND = [
            ["独居老人陪伴与送餐", 38],
            ["社区垃圾分类督导", 19],
            ["儿童课后托管", 16],
            ["汛期河道巡查", 11],
            ["旧衣回收与整理", 9],
            ["义诊与健康讲座", 7],
          ];
          reveal($("volunteer"), (s) => {
            const X0 = 28,
              GAP = 7.6,
              TOP = 20,
              ROW = 40,
              TALL = 12;
            // 第 k 场（从 0 起）的横坐标：每满 5 场多空半格
            const x = (k) => X0 + k * GAP + Math.floor(k / 5) * GAP * 0.5;
            KIND.forEach(([name, n], r) => {
              const base = TOP + r * ROW + 24;
              txt(s, label({ x: X0, y: base - TALL - 5 }), name);
              for (let k = 0; k < n; k++) {
                const h = TALL * (1 + jit(r * 50 + k, 17, G.jitter.len));
                el(s, "line", {
                  x1: x(k),
                  x2: x(k),
                  y1: base,
                  y2: base - h,
                  stroke: G.ink.strong,
                  "stroke-width": G.line.data,
                  class: "fade",
                  style: dl(0.08 + r * 0.06 + k * 0.012),
                });
              }
              el(s, "line", {
                x1: X0 - 4,
                x2: x(n - 1) + 4,
                y1: base + 2,
                y2: base + 2,
                stroke: G.ink.quiet,
                "stroke-width": G.line.grid,
              });
              txt(s, value({ x: x(n - 1) + 9, y: base - 1 }), n);
              const hit = el(s, "rect", {
                x: X0 - 4,
                y: base - TALL - 16,
                width: 360,
                height: ROW - 4,
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(hit, `${name} · 本季度 ${n} 场`);
            });
          });
        })();

        // ════ F6 · Paired Rungs ════
        (() => {
          // 并肩梯：每家社区医院两架梯并排，左窄梯 = 2025 年、淡墨，右宽梯 = 2026 年、实墨；一档 = 200 人签约。
          // 梯高 = 档数 × 档距，从零起不截断，两年同一把尺；梯顶写今年人数，上方写今年减去年的档差折成人数。
          // 档宽带确定性抖动（不编码数据），档数不抖。标题所指的城西是五家里唯一下降的，
          // 它的今年一架在几何上并不显眼，整架与差值上主角色。10 架梯静态即可，每组 hover 出两年读数。
          const { G, jit, tick, value, label } = showMeChart;
          const UNIT = 200;
          // [社区医院, 2025 档数, 2026 档数]
          const SITE = [
            ["城东", 24, 31],
            ["城南", 18, 23],
            ["城北", 15, 21],
            ["城西", 22, 19],
            ["滨江", 12, 17],
          ];
          reveal($("gp"), (s) => {
            const X0 = 60,
              X1 = 384,
              BASE = 236,
              STEP = 5.4;
            const slot = (X1 - X0) / SITE.length,
              y = (n) => BASE - n * STEP;
            [10, 20, 30].forEach((n) => {
              el(s, "line", {
                x1: X0 - 4,
                x2: X1,
                y1: y(n),
                y2: y(n),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 8, y: y(n) + 2.2, "text-anchor": "end" }),
                fmt(n * UNIT)
              );
            });
            txt(s, tick({ x: X0 - 8, y: BASE + 2.2, "text-anchor": "end" }), 0);
            txt(s, tick({ x: X0 - 8, y: y(34), "text-anchor": "end" }), "人");
            el(s, "line", {
              x1: X0 - 4,
              x2: X1,
              y1: BASE,
              y2: BASE,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            const ladder = (cx, half, n, ink, w, seed, delay) => {
              const g = el(s, "g", {
                class: "rise",
                style: `transform-origin:${cx}px ${BASE}px;${dl(delay)}`,
              });
              for (let k = 1; k <= n; k++) {
                const hw = half * (1 + jit(seed + k, 21, G.jitter.len));
                el(g, "line", {
                  x1: cx - hw,
                  x2: cx + hw,
                  y1: y(k),
                  y2: y(k),
                  stroke: ink,
                  "stroke-width": w,
                });
              }
            };
            SITE.forEach(([name, a, b], i) => {
              const cx = X0 + slot * (i + 0.5),
                down = b < a,
                d = (b - a) * UNIT;
              ladder(
                cx - 10,
                5,
                a,
                G.ink.quiet,
                G.line.grid,
                i * 90,
                0.05 + i * 0.07
              );
              ladder(
                cx + 7,
                9,
                b,
                down ? HERO : G.ink.strong,
                down ? G.line.heroData : G.line.data,
                i * 90 + 45,
                0.15 + i * 0.07
              );
              txt(
                s,
                value({ x: cx + 7, y: y(b) - 6, "text-anchor": "middle" }),
                fmt(b * UNIT)
              );
              txt(
                s,
                value(
                  {
                    x: cx + 7,
                    y: y(Math.max(a, b)) - 17,
                    "text-anchor": "middle",
                  },
                  down
                ),
                (d > 0 ? "+" : "−") + fmt(Math.abs(d))
              );
              txt(
                s,
                label({ x: cx, y: BASE + 15, "text-anchor": "middle" }),
                name
              );
              const hit = el(s, "rect", {
                x: cx - slot / 2,
                y: y(Math.max(a, b)) - 24,
                width: slot,
                height: Math.max(a, b) * STEP + 24,
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(
                hit,
                `${name}社区医院 · 2025 年 ${fmt(a * UNIT)} 人 → 2026 年 ${fmt(b * UNIT)} 人`
              );
            });
            // 图例：一对小梯
            const lx = X1 - 92;
            [
              [0, "2025", G.ink.quiet, 5, G.line.grid],
              [46, "2026", G.ink.strong, 9, G.line.data],
            ].forEach(([dx, t, ink, half, w]) => {
              for (let k = 0; k < 4; k++)
                el(s, "line", {
                  x1: lx + dx - half,
                  x2: lx + dx + half,
                  y1: 12 + k * 3.4,
                  y2: 12 + k * 3.4,
                  stroke: ink,
                  "stroke-width": w,
                });
              txt(s, tick({ x: lx + dx + half + 4, y: 20 }), t);
            });
          });
        })();

        // ════ F7 · Stacked Rungs ════
        (() => {
          // 堆叠梯：一档 = 100 杯，每家店一架梯，自下而上依次是咖啡、茶、果汁三段，段高 = 档数，总高 = 当月杯数。
          // 三段用墨色三级区分（咖啡实墨、茶中灰、果汁浅墨），段与段之间不留空，总高不失真；
          // 类目名直接写在最右一架的各段旁。店按总杯数从多到少排。档宽带确定性抖动，档数不抖。
          // 标题所指的是校园店的茶这一段，几何上不突出，整段上主角色。4 架静态即可，每段 hover 出读数。
          const { G, jit, tick, value, label } = showMeChart;
          const KIND = [
            ["咖啡", G.ink.strong],
            ["茶", G.ink.quiet],
            ["果汁", G.ink.mass],
          ];
          const SHOP = [
            ["写字楼店", [42, 14, 6]],
            ["商场店", [20, 18, 13]],
            ["校园店", [12, 27, 9]],
            ["地铁站店", [31, 9, 4]],
          ];
          const STAR = ["校园店", 1];
          reveal($("drinks"), (s) => {
            const X0 = 52,
              X1 = 336,
              BASE = 234,
              STEP = 3.2,
              HALF = 17;
            const slot = (X1 - X0) / SHOP.length,
              y = (n) => BASE - n * STEP;
            [20, 40, 60].forEach((n) => {
              el(s, "line", {
                x1: X0 - 4,
                x2: X1,
                y1: y(n),
                y2: y(n),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 8, y: y(n) + 2.2, "text-anchor": "end" }),
                fmt(n * 100)
              );
            });
            txt(s, tick({ x: X0 - 8, y: BASE + 2.2, "text-anchor": "end" }), 0);
            txt(s, tick({ x: X0 - 8, y: y(66), "text-anchor": "end" }), "杯");
            el(s, "line", {
              x1: X0 - 4,
              x2: X1,
              y1: BASE,
              y2: BASE,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            SHOP.forEach(([shop, parts], i) => {
              const cx = X0 + slot * (i + 0.5),
                total = parts.reduce((a, b) => a + b, 0);
              let n0 = 0;
              parts.forEach((n, p) => {
                const star = shop === STAR[0] && p === STAR[1],
                  g = el(s, "g", {
                    class: "rise",
                    style: `transform-origin:${cx}px ${y(n0)}px;${dl(0.1 + i * 0.08 + p * 0.22)}`,
                  });
                for (let k = n0 + 1; k <= n0 + n; k++) {
                  const hw = HALF * (1 + jit(i * 100 + k, 23, G.jitter.len));
                  el(g, "line", {
                    x1: cx - hw,
                    x2: cx + hw,
                    y1: y(k),
                    y2: y(k),
                    stroke: star ? HERO : KIND[p][1],
                    "stroke-width": star ? G.line.heroData : G.line.data,
                  });
                }
                const hit = el(s, "rect", {
                  x: cx - HALF - 4,
                  y: y(n0 + n) - STEP / 2,
                  width: HALF * 2 + 8,
                  height: n * STEP,
                  fill: "none",
                  "pointer-events": "all",
                  class: "hit",
                });
                tip(
                  hit,
                  `${shop} · ${KIND[p][0]} ${fmt(n * 100)} 杯，占 ${Math.round((n / total) * 100)}%`
                );
                if (star)
                  txt(
                    s,
                    value({ x: cx + HALF + 5, y: y(n0 + n / 2) + 3 }, true),
                    fmt(n * 100)
                  );
                // 最右一架旁直接写类目名
                if (i === SHOP.length - 1)
                  txt(
                    s,
                    label({ x: cx + HALF + 6, y: y(n0 + n / 2) + 3 }),
                    KIND[p][0]
                  );
                n0 += n;
              });
              txt(
                s,
                value({ x: cx, y: y(total) - 7, "text-anchor": "middle" }),
                fmt(total * 100)
              );
              txt(
                s,
                label({ x: cx, y: BASE + 15, "text-anchor": "middle" }),
                shop
              );
            });
          });
        })();

        // ════ F8 · Plumb Scatter ════
        (() => {
          // 铅垂散点：一点 = 一家奶茶店，横轴 = 离最近地铁站的步行距离（米），纵轴 = 9 月日均单量，都从零起、线性。
          // 每个点垂一根发丝到地面，横向读距离就顺着线落到刻度上；一条虚线 = 其余 15 家的最小二乘趋势。
          // 标题所指的学府路店只是一点，几何上不突出，点、铅垂线和店名上主角色。
          // 16 个点静态即可，点上 hover 出店名与两项读数。
          const { G, jit, tick, value, label } = showMeChart;
          const DIST = [
            60, 120, 170, 240, 300, 370, 450, 520, 590, 680, 760, 830, 1040,
            1110, 1190,
          ];
          const shops = DIST.map((d, i) => ({
            name: `${i + 1} 号店`,
            d,
            v: Math.round(680 - 0.38 * d + (rnd(i + 3, 51) - 0.5) * 110),
          }));
          const STAR = { name: "学府路店", d: 920, v: 640 };
          const n = shops.length,
            mx = shops.reduce((a, c) => a + c.d, 0) / n,
            my = shops.reduce((a, c) => a + c.v, 0) / n,
            slope =
              shops.reduce((a, c) => a + (c.d - mx) * (c.v - my), 0) /
              shops.reduce((a, c) => a + (c.d - mx) ** 2, 0),
            fit = (d) => my + slope * (d - mx);
          reveal($("teashop"), (s) => {
            const X0 = 48,
              X1 = 380,
              Y0 = 230,
              TOP = 30,
              DMAX = 1200,
              VMAX = 800;
            const x = (d) => X0 + (d / DMAX) * (X1 - X0),
              y = (v) => Y0 - (v / VMAX) * (Y0 - TOP);
            for (let v = 200; v <= VMAX; v += 200) {
              el(s, "line", {
                x1: X0 - 4,
                x2: X1,
                y1: y(v),
                y2: y(v),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 8, y: y(v) + 2.2, "text-anchor": "end" }),
                v
              );
            }
            txt(s, tick({ x: X0 - 8, y: Y0 + 2.2, "text-anchor": "end" }), 0);
            txt(
              s,
              tick({ x: X0 - 8, y: TOP - 14, "text-anchor": "end" }),
              "单/天"
            );
            el(s, "line", {
              x1: X0 - 4,
              x2: X1 + 4,
              y1: Y0,
              y2: Y0,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            for (let d = 0; d <= DMAX; d += 300)
              txt(s, tick({ x: x(d), y: Y0 + 14, "text-anchor": "middle" }), d);
            txt(
              s,
              tick({ x: X1, y: Y0 + 26, "text-anchor": "end" }),
              "离地铁站步行距离 · 米"
            );
            el(s, "line", {
              x1: x(0),
              x2: x(DMAX),
              y1: y(fit(0)),
              y2: y(fit(DMAX)),
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
              "stroke-dasharray": "4 3",
              class: "fade",
              style: dl(0.6),
            });
            txt(
              s,
              tick({ x: x(20), y: y(130), class: "fade", style: dl(0.6) }),
              `其余 ${n} 家：每远 100 米少 ${Math.round(-slope * 100)} 单`
            );
            [...shops, STAR].forEach((c, i) => {
              const star = c === STAR;
              el(s, "line", {
                x1: x(c.d),
                x2: x(c.d),
                y1: y(c.v),
                y2: Y0,
                stroke: star ? HERO : G.ink.mass,
                "stroke-width": star ? G.line.heroThread : G.line.thread,
                "stroke-dasharray": star ? null : "1 2",
                class: "fade",
                style: dl(0.1 + i * 0.03),
              });
              const dot = el(s, "circle", {
                cx: x(c.d),
                cy: y(c.v),
                r: star
                  ? G.dot.head
                  : G.dot.mark * (1 + jit(i, 29, G.jitter.size)),
                fill: star ? HERO : G.ink.strong,
                class: "pop",
                style: dl(0.2 + i * 0.03),
              });
              tip(dot, `${c.name} · 离地铁站 ${c.d} 米 · 日均 ${c.v} 单`);
            });
            txt(
              s,
              value({ x: x(STAR.d) + 6, y: y(STAR.v) - 6 }, true),
              STAR.name
            );
            txt(
              s,
              tick({ x: x(STAR.d) + 6, y: y(STAR.v) + 5 }),
              "正对小学校门"
            );
          });
        })();

        // ════ F9 · Rung Waterfall ════
        (() => {
          // 梯档瀑布：一档 = 200 万立方米。首尾两架从零起画存量；中间每一级只画变化量，
          // 悬在上一级结束的水位上：流入的档是实线，从水位往上加；流出的档是虚线，从水位往下扣。
          // 年末存量由年初加各级增减算出，不另写数，保证自洽。一道虚线把相邻两级的水位接起来。
          // 灌溉是流出里最长的一段，几何已凸显，不上主角色。6 级静态即可，每级 hover 出读数。
          const { G, jit, tick, value, label } = showMeChart;
          const UNIT = 2; // 一档 = 2 百万立方米
          const START = 64;
          const FLOW = [
            ["降水入库", 46],
            ["城市供水", -22],
            ["农业灌溉", -30],
            ["蒸发渗漏", -24],
          ];
          const END = FLOW.reduce((a, [, v]) => a + v, START);
          // [名称, 起点水位, 终点水位, 类型]
          let lv = START;
          const COL = [
            ["年初蓄水", 0, START, "stock"],
            ...FLOW.map(([name, v]) => [
              name,
              lv,
              (lv += v),
              v > 0 ? "in" : "out",
            ]),
            ["年末蓄水", 0, END, "stock"],
          ];
          reveal($("reservoir"), (s) => {
            const X0 = 52,
              X1 = 384,
              BASE = 228,
              STEP = 3.5,
              HALF = 16;
            const slot = (X1 - X0) / COL.length,
              cx = (i) => X0 + slot * (i + 0.5),
              y = (m) => BASE - (m / UNIT) * STEP;
            [40, 80].forEach((m) => {
              el(s, "line", {
                x1: X0 - 4,
                x2: X1,
                y1: y(m),
                y2: y(m),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: X0 - 8, y: y(m) + 2.2, "text-anchor": "end" }),
                m
              );
            });
            txt(s, tick({ x: X0 - 8, y: BASE + 2.2, "text-anchor": "end" }), 0);
            txt(
              s,
              tick({ x: X0 - 8, y: y(120), "text-anchor": "end" }),
              "百万方"
            );
            el(s, "line", {
              x1: X0 - 4,
              x2: X1,
              y1: BASE,
              y2: BASE,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            COL.forEach(([name, a, b, kind], i) => {
              const x = cx(i),
                lo = Math.min(a, b),
                hi = Math.max(a, b),
                out = kind === "out";
              for (let m = lo + UNIT; m <= hi; m += UNIT) {
                const hw = HALF * (1 + jit(i * 80 + m, 31, G.jitter.len));
                el(s, "line", {
                  x1: x - hw,
                  x2: x + hw,
                  y1: y(m),
                  y2: y(m),
                  stroke: out
                    ? G.ink.quiet
                    : kind === "in"
                      ? G.ink.strong
                      : G.ink.data,
                  "stroke-width": G.line.data,
                  "stroke-dasharray": out ? "2 1.6" : null,
                  class: "fade",
                  style: dl(0.1 + i * 0.16 + (out ? hi - m : m - lo) * 0.004),
                });
              }
              // 水位接线：本级终点接到下一级
              if (i < COL.length - 1)
                el(s, "line", {
                  x1: x + HALF,
                  x2: cx(i + 1) - HALF,
                  y1: y(b),
                  y2: y(b),
                  stroke: G.ink.quiet,
                  "stroke-width": G.line.grid,
                  "stroke-dasharray": "2 2",
                });
              const d = b - a;
              txt(
                s,
                value({ x, y: y(hi) - 6, "text-anchor": "middle" }),
                kind === "stock" ? b : (d > 0 ? "+" : "−") + Math.abs(d)
              );
              txt(s, label({ x, y: BASE + 15, "text-anchor": "middle" }), name);
              const hit = el(s, "rect", {
                x: x - slot / 2,
                y: y(hi) - 14,
                width: slot,
                height: Math.max(y(lo) - y(hi) + 14, 20),
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(
                hit,
                kind === "stock"
                  ? `${name} ${b} 百万方`
                  : `${name} ${d > 0 ? "流入" : "流出"} ${Math.abs(d)} 百万方 · 水位 ${a} → ${b}`
              );
            });
          });
        })();

        // ════ F10 · Dot Heat ════
        (() => {
          // 点阵热力：7 行（周一到周日）× 16 列（6 点到 21 点，每列一小时），一格一粒实心点，
          // 点面积 = 该时段 9 月平均签到人次，半径按平方根换算，面积才和人次成正比。
          // 没人签到的格子留一个空心小圈，安静也看得见，不和「没数据」混淆。
          // 只标全表最大一格和周末最大一格；高峰本身最大，几何已凸显，不上主角色。112 格静态即可，格上 hover 出读数。
          const { G, jit, tick, value, label } = showMeChart;
          const DAY = ["周一", "周二", "周三", "周四", "周五", "周六", "周日"],
            H0 = 6,
            H1 = 21;
          const grid = DAY.map((_, d) => {
            const we = d >= 5;
            return Array.from({ length: H1 - H0 + 1 }, (_, j) => {
              const h = H0 + j,
                bump = (c, w) => Math.exp(-((h - c) ** 2) / (2 * w * w));
              if (we && h === H0) return 0; // 周末 7 点才开门
              const v = we
                ? 62 * bump(10, 1.6) + 30 * bump(16, 2.2) + 6
                : 24 * bump(7, 0.9) +
                  20 * bump(12.5, 0.8) +
                  70 * bump(19, 1.3) +
                  4;
              return Math.round(v * (0.85 + rnd(d * 31 + h, 43) * 0.3));
            });
          });
          const cells = grid.flatMap((row, d) =>
              row.map((v, j) => ({ d, h: H0 + j, v }))
            ),
            top = cells.reduce((a, c) => (c.v > a.v ? c : a)),
            weTop = cells
              .filter((c) => c.d >= 5)
              .reduce((a, c) => (c.v > a.v ? c : a));
          reveal($("gym"), (s) => {
            const X0 = 58,
              X1 = 380,
              Y0 = 40,
              ROW = 27,
              RMAX = 10;
            const x = (h) => X0 + ((h - H0) * (X1 - X0)) / (H1 - H0),
              y = (d) => Y0 + d * ROW,
              r = (v) => Math.sqrt(v / top.v) * RMAX;
            for (let h = H0; h <= H1; h += 3)
              txt(
                s,
                tick({ x: x(h), y: Y0 - 18, "text-anchor": "middle" }),
                `${h}:00`
              );
            // 工作日与周末之间一道细分隔
            el(s, "line", {
              x1: X0 - 36,
              x2: X1 + 10,
              y1: (y(4) + y(5)) / 2,
              y2: (y(4) + y(5)) / 2,
              stroke: G.ink.guide,
              "stroke-width": G.line.grid,
              "stroke-dasharray": "1 3",
            });
            DAY.forEach((name, d) =>
              txt(
                s,
                label({ x: X0 - 20, y: y(d) + 2.8, "text-anchor": "end" }),
                name
              )
            );
            cells.forEach((c, i) => {
              const dot = el(s, "circle", {
                cx: x(c.h) + jit(i, 37, G.jitter.pos),
                cy: y(c.d) + jit(i, 38, G.jitter.pos),
                r: c.v ? r(c.v) : 1.3,
                fill: c.v ? G.ink.strong : "none",
                stroke: c.v ? null : G.ink.quiet,
                "stroke-width": c.v ? null : G.line.grid,
                class: "pop",
                style: dl(0.05 + (c.h - H0) * 0.03 + c.d * 0.02),
              });
              tip(
                dot,
                `${DAY[c.d]} ${c.h}:00 · 平均 ${c.v} 人次${c.v ? "" : "（未开门）"}`
              );
            });
            [top, weTop].forEach((c) =>
              txt(
                s,
                value({
                  x: x(c.h),
                  y: y(c.d) + 2.8,
                  "text-anchor": "middle",
                  fill: "var(--color-card)",
                }),
                c.v
              )
            );
            // 峰值读数写在点里，不压邻格；点面积图例：三档
            [10, 40, 80].forEach((v, k) => {
              const lx = X0 + 40 + k * 52,
                ly = y(6) + 34;
              el(s, "circle", { cx: lx, cy: ly, r: r(v), fill: G.ink.strong });
              txt(s, tick({ x: lx + r(v) + 4, y: ly + 2.2 }), v);
            });
            txt(
              s,
              tick({ x: X0 + 26, y: y(6) + 36.2, "text-anchor": "end" }),
              "人次"
            );
          });
        })();

        // ════ F11 · Tick Gauge ════
        (() => {
          // 刻度表盘：270° 的弧上 100 根径向刻度，一根 = 全年目标的 1%，从左下起顺时针走到右下。
          // 已完成的刻度用实墨；按日历这时本该完成、实际还没完成的那几根上主角色 ——
          // 标题说的就是这段落差，它在几何上只是几根刻度，不上色读不出来；其余未完成的用浅墨。
          // 弧外一根指针标出时间进度，环心写完成率与株数。100 根刻度静态即可，刻度 hover 出百分位。
          const { G, jit, tick, value, label } = showMeChart;
          const TARGET = 50000,
            DONE = 34000,
            // 截至 9 月 23 日，全年已过去的比例
            pace = Math.round(
              ((new Date(2026, 8, 23) - new Date(2026, 0, 1)) / 864e5 + 1) /
                3.65
            ),
            pct = Math.round((DONE / TARGET) * 100);
          reveal($("trees"), (s) => {
            const CX = 200,
              CY = 128,
              R0 = 88,
              R1 = 108,
              A0 = 135,
              SPAN = 270;
            const ang = (k) => A0 + (k / 100) * SPAN;
            for (let k = 0; k < 100; k++) {
              const lag = k >= pct && k < pace,
                a = ang(k + 0.5),
                deca = k % 10 === 0,
                [xa, ya] = pol(CX, CY, R0 + (deca ? -5 : jit(k, 41, 2.5)), a),
                [xb, yb] = pol(CX, CY, R1, a),
                t = el(s, "line", {
                  x1: xa,
                  y1: ya,
                  x2: xb,
                  y2: yb,
                  stroke: lag ? HERO : k < pct ? G.ink.strong : G.ink.mass,
                  "stroke-width": lag ? G.line.heroData : G.line.data,
                  class: "fade",
                  style: dl(0.05 + k * 0.008),
                });
              tip(
                t,
                `第 ${k + 1} 个百分点 · ${k < pct ? "已种" : lag ? "按时间本该种完" : "未种"}`
              );
            }
            [0, 50, 100].forEach((k) => {
              const [x, y] = pol(CX, CY, R0 - 14, ang(k));
              txt(
                s,
                tick({
                  x,
                  y: y + 2.2,
                  "text-anchor": k ? (k === 100 ? "end" : "middle") : "start",
                }),
                `${k}%`
              );
            });
            // 时间进度指针
            const [px0, py0] = pol(CX, CY, R1 + 3, ang(pace)),
              [px1, py1] = pol(CX, CY, R1 + 16, ang(pace));
            el(s, "line", {
              x1: px0,
              y1: py0,
              x2: px1,
              y2: py1,
              stroke: G.ink.strong,
              "stroke-width": G.line.base,
            });
            txt(s, tick({ x: px1 + 4, y: py1 - 2 }), `时间过去 ${pace}%`);
            txt(
              s,
              value({
                x: CX,
                y: CY + 4,
                "text-anchor": "middle",
                "font-size": 26,
              }),
              `${pct}%`
            );
            txt(
              s,
              tick({ x: CX, y: CY + 20, "text-anchor": "middle" }),
              `已种 ${fmt(DONE)} / ${fmt(TARGET)} 株`
            );
            txt(
              s,
              value({ x: CX, y: CY + 62, "text-anchor": "middle" }, true),
              `落后 ${pace - pct} 个点`
            );
            txt(
              s,
              tick({ x: CX, y: CY + 74, "text-anchor": "middle" }),
              `≈ ${fmt(((pace - pct) * TARGET) / 100)} 株`
            );
          });
        })();

        // ════ F12 · Dumbbell Queue ════
        (() => {
          // 哑铃串珠：一行 = 一个办事项，横轴 = 平均等候分钟，从零起、线性。空心点 = 上线预约前，实心点 = 上线后，
          // 两点之间每一分钟的中点穿一粒珠子，珠子数 = 省下的分钟数，数得出来。两端各写分钟数。
          // 行按省下的分钟从多到少排；第一行的串最长，几何已凸显，不上主角色。
          // 6 行静态即可，整行 hover 出前后读数。
          const { G, jit, tick, value, label } = showMeChart;
          // [事项, 上线前, 上线后]
          const ITEM = [
            ["换领身份证", 41, 8],
            ["办理护照", 36, 12],
            ["公积金提取", 24, 9],
            ["营业执照", 32, 18],
            ["社保转移", 28, 15],
            ["户口迁移", 22, 16],
          ].sort((a, b) => b[1] - b[2] - (a[1] - a[2]));
          reveal($("counter"), (s) => {
            const X0 = 96,
              X1 = 380,
              TOP = 46,
              ROW = 34,
              MAX = 45;
            const x = (m) => X0 + (m / MAX) * (X1 - X0),
              y = (i) => TOP + i * ROW;
            for (let m = 0; m <= MAX; m += 15) {
              el(s, "line", {
                x1: x(m),
                x2: x(m),
                y1: TOP - 16,
                y2: y(ITEM.length - 1) + 12,
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(
                s,
                tick({ x: x(m), y: TOP - 22, "text-anchor": "middle" }),
                m
              );
            }
            txt(
              s,
              tick({ x: X0 - 12, y: TOP - 22, "text-anchor": "end" }),
              "分钟"
            );
            ITEM.forEach(([name, a, b], i) => {
              const yy = y(i);
              txt(
                s,
                label({ x: X0 - 12, y: yy + 2.8, "text-anchor": "end" }),
                name
              );
              el(s, "line", {
                x1: x(b),
                x2: x(a),
                y1: yy,
                y2: yy,
                stroke: G.ink.mass,
                "stroke-width": G.line.thread,
              });
              for (let m = b; m < a; m++)
                el(s, "circle", {
                  cx: x(m + 0.5),
                  cy: yy + jit(i * 60 + m, 43, G.jitter.pos),
                  r: G.dot.tick * (1 + jit(i * 60 + m, 44, G.jitter.size)),
                  fill: G.ink.data,
                  class: "pop",
                  style: dl(0.25 + i * 0.05 + (a - m) * 0.012),
                });
              el(s, "circle", {
                cx: x(a),
                cy: yy,
                r: G.dot.mark,
                fill: "var(--color-card)",
                stroke: G.ink.strong,
                "stroke-width": G.line.data,
                class: "pop",
                style: dl(0.1 + i * 0.05),
              });
              el(s, "circle", {
                cx: x(b),
                cy: yy,
                r: G.dot.mark,
                fill: G.ink.strong,
                class: "pop",
                style: dl(0.5 + i * 0.05),
              });
              txt(s, tick({ x: x(a) + 7, y: yy + 2.2 }), a);
              txt(
                s,
                value({ x: x(b) - 7, y: yy + 2.8, "text-anchor": "end" }),
                b
              );
              txt(
                s,
                tick({
                  x: (x(a) + x(b)) / 2,
                  y: yy - 6,
                  "text-anchor": "middle",
                }),
                `省 ${a - b}`
              );
              const hit = el(s, "rect", {
                x: 0,
                y: yy - ROW / 2,
                width: X1 + 20,
                height: ROW,
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(
                hit,
                `${name} · 上线前 ${a} 分钟 → 上线后 ${b} 分钟，省 ${a - b} 分钟`
              );
            });
          });
        })();

        // ════ F13 · Nested Treemap ════
        (() => {
          // 嵌套矩形树图：squarify 布局，面积 = 工时。父组靠标题带和组间留白分开，叶子同一明度；主角 = 最大叶子描一圈橙边（整块涂橙会压过面积本身）。
          const GROUPS = [
            [
              "PRODUCT",
              [
                ["Core app", 260],
                ["Collaboration", 190],
                ["Search", 110],
                ["Mobile", 80],
              ],
            ],
            [
              "PLATFORM",
              [
                ["AI systems", 170],
                ["Data infra", 120],
                ["APIs", 105],
              ],
            ],
            [
              "GROWTH",
              [
                ["Acquisition", 90],
                ["Retention", 80],
                ["Onboarding", 75],
              ],
            ],
          ];
          const squarify = (items, x, y, w, h) => {
            // items:[name,value] 已按值降序；返回 [{name,value,x,y,w,h}]
            const out = [],
              total = items.reduce((a, d) => a + d[1], 0);
            let rest = [...items];
            const worst = (row, len) => {
              const s = row.reduce((a, d) => a + d.a, 0),
                mx = Math.max(...row.map((d) => d.a)),
                mn = Math.min(...row.map((d) => d.a));
              return Math.max(
                (len * len * mx) / (s * s),
                (s * s) / (len * len * mn)
              );
            };
            let cx = x,
              cy = y,
              cw = w,
              ch = h;
            while (rest.length) {
              const vert = cw >= ch,
                len = vert ? ch : cw;
              let row = [],
                i = 0;
              while (i < rest.length) {
                const a = (rest[i][1] / total) * w * h,
                  cand = [...row, { d: rest[i], a }];
                if (row.length && worst(cand, len) > worst(row, len)) break;
                row = cand;
                i++;
              }
              const s = row.reduce((a, d) => a + d.a, 0),
                thick = s / len;
              let off = 0;
              row.forEach(({ d, a }) => {
                const l = a / thick;
                out.push(
                  vert
                    ? {
                        name: d[0],
                        value: d[1],
                        x: cx,
                        y: cy + off,
                        w: thick,
                        h: l,
                      }
                    : {
                        name: d[0],
                        value: d[1],
                        x: cx + off,
                        y: cy,
                        w: l,
                        h: thick,
                      }
                );
                off += l;
              });
              if (vert) {
                cx += thick;
                cw -= thick;
              } else {
                cy += thick;
                ch -= thick;
              }
              rest = rest.slice(i);
            }
            return out;
          };
          reveal($("treemap"), (s) => {
            const TOTAL = GROUPS.flatMap((g) => g[1]).reduce(
                (a, d) => a + d[1],
                0
              ),
              W = 800,
              H = 320,
              GAP = 6,
              BAND = 18;
            const gs = squarify(
              GROUPS.map((g) => [
                g[0],
                g[1].reduce((a, d) => a + d[1], 0),
              ]).sort((a, b) => b[1] - a[1]),
              0,
              0,
              W,
              H

            const heroLeaf = GROUPS.flatMap((g) => g[1]).sort(
              (a, b) => b[1] - a[1]

            gs.forEach((g, gi) => {

                .slice()
                .sort((a, b) => b[1] - a[1]);
              txt(
                s,
                {
                  x: g.x + GAP / 2 + 6,
                  y: g.y + GAP / 2 + 12,
                  "font-size": 9,
                  "font-weight": 600,
                  fill: I60,
                  "letter-spacing": ".1em",
                  class: "fade",
                  style: `animation-delay:${gi * 0.1}s`,
                },
                `${g.name} · ${Math.round((g.value / TOTAL) * 100)}%`
              );
              squarify(
                kids,
                g.x + GAP / 2,
                g.y + GAP / 2 + BAND,

                  class: "pop",
                  style: `transform-origin:${leaf.x + leaf.w / 2}px ${leaf.y + leaf.h / 2}px;animation-delay:${gi * 0.1 + li * 0.06}s`,
                });
                tip(
                  r,
                  `${g.name} / ${leaf.name} — ${leaf.value} h · ${((leaf.value / TOTAL) * 100).toFixed(1)}%`
                );
                if (leaf.w > 70 && leaf.h > 34) {

                      y: leaf.y + 18,
                      "font-size": 10,
                      "font-weight": 600,
                      fill: PAPER,
                      class: "fade",
                      style: `animation-delay:${0.3 + gi * 0.1 + li * 0.06}s`,
                    },
                    leaf.name

                      "font-size": 9,
                      fill: PAPER,
                      opacity: 0.75,
                      class: "fade",
                      style: `animation-delay:${0.3 + gi * 0.1 + li * 0.06}s`,
                    },
                    leaf.value + " h"
                  );
                }
              });
            });
          });
        })();

        (() => {

          // 发丝框 = 中间一半学生（Q1 到 Q3），框里粗实线 = 中位数，两侧须线伸到 1.5 倍四分距以内最远的学生，
          // 须线外的学生逐个画空心点 = 异常值；五数与异常值都由下面的样本算出，不另写。
          // 框下一排短刻度 = 每位学生一根，框压缩掉的分布形状在这里还看得到。
          // 标题比的是两条中位线，位置本身就能读，不上主角色。5 行静态即可，框与异常点 hover 出读数。
          const { G, jit, tick, value, label } = showMeChart;
          const GRADE = [
            ["初一", 48],
            ["初二", 62],
            ["初三", 96],
            ["高一", 88],
            ["高二", 110],
          ];
          const q = (xs, p) => {
            const pos = (xs.length - 1) * p,
              i = Math.floor(pos);
            return (
              xs[i] + (xs[Math.min(i + 1, xs.length - 1)] - xs[i]) * (pos - i)
            );
          };
          const rows = GRADE.map(([name, mid], k) => {

            const xs = Array.from({ length: 60 }, (_, i) => {
              const z = (rnd(i + 1, 50 + k) - 0.5) * 2;
              let v = mid * Math.exp(0.32 * z * Math.abs(z) ** 0.4);
              if (rnd(i + 1, 60 + k) > 0.965) v *= 1.9;
              return Math.round(v);
            }).sort((a, b) => a - b);
            const q1 = q(xs, 0.25),
              md = q(xs, 0.5),
              q3 = q(xs, 0.75),
              f = 1.5 * (q3 - q1),
              lo = xs.find((v) => v >= q1 - f),
              hi = xs.findLast((v) => v <= q3 + f);
            return {
              name,
              xs,
              q1,
              md,
              q3,
              lo,
              hi,
              out: xs.filter((v) => v < lo || v > hi),

              s,
              value({ x: x(FEST - 1) + 4, y: floor + 12 }),
              `${fmt(f.total)} 万 · 平时的 ${Math.round((f.total / usual) * 100)}%`
            );
            weeks.forEach((c, i) => {
              const hit = el(s, "rect", {
                x: x(i) - 7,
                y: 30,
                width: 14,
                height: 258,
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(
                hit,
                `第 ${c.w} 周 · 共 ${fmt(c.total)} 万人次 · ` +
                  MODE.map(([n], m) => `${n} ${fmt(c.v[m])}`).join(" · ") +
                  ` · 骑行占 ${Math.round(c.share * 100)}%`
              );
            });
          });
        })();

        // ════ F17 · Candlestick ════
        (() => {
          // K 线：一根 = 一个交易日。实体从开盘价画到收盘价，收涨空心、收跌实心；
          // 上下影线从实体伸到当日最高价与最低价。纵轴是价格、线性，只铺当期区间，K 线读的是相对涨跌不是柱高，
          // 所以不从零起；价格刻度写在右侧。OHLC 由逐日涨跌幅推出，并保证最高不低于开收、最低不高于开收。
          // 标题所指的止跌那一根只是 30 根里的一根，几何上不突出，实体、影线与标注上主角色。
          // 30 根静态即可，每根 hover 出日期与四个价。
          const { G, jit, tick, value, label } = showMeChart;
          // 逐日收盘涨跌幅（%）：前 12 天缓涨，第 13–18 天连跌六天，第 19 天止跌，之后回升
          const RET = [
            0.6, -0.3, 0.9, 0.4, -0.5, 1.1, 0.3, -0.2, 0.8, 0.5, -0.4, 0.7,
            -1.2, -0.9, -1.6, -0.8, -1.3, -1.0, 0.9, 1.2, 0.6, -0.3, 0.9, 1.4,
            -0.5, 0.8, 0.4, 1.0, -0.2, 0.7,
          ];
          const TURN = 18; // 止跌那天（从 0 起）
          let prev = 1000;
          const day0 = new Date(2026, 7, 10);
          const bars = [];
          for (let i = 0, d = 0; bars.length < RET.length; d++) {
            const dt = new Date(day0.getTime() + d * 864e5);
            if (dt.getDay() === 0 || dt.getDay() === 6) continue;
            const turn = i === TURN,
              o = prev * (1 + (turn ? -0.5 : (rnd(i, 71) - 0.5) * 0.4) / 100),
              c = prev * (1 + RET[i] / 100),
              h =
                Math.max(o, c) *
                (1 + (turn ? 0.1 : 0.1 + rnd(i, 72) * 0.5) / 100),
              l =
                Math.min(o, c) *
                (1 - (turn ? 3.2 : 0.1 + rnd(i, 73) * 0.5) / 100);
            bars.push({ i, m: dt.getMonth() + 1, d: dt.getDate(), o, h, l, c });
            prev = c;
            i++;
          }
          const run = bars.slice(TURN - 6, TURN),
            drop = (run.at(-1).c / bars[TURN - 7].c - 1) * 100;
          reveal($("candles"), (s) => {
            const X0 = 18,
              X1 = 350,
              TOP = 40,
              BOT = 230,
              P0 = 920,
              P1 = 1060;
            const slot = (X1 - X0) / bars.length,
              x = (i) => X0 + slot * (i + 0.5),
              y = (p) => BOT - ((p - P0) / (P1 - P0)) * (BOT - TOP);
            for (let p = P0; p <= P1; p += 20) {
              el(s, "line", {
                x1: X0,
                x2: X1 + 4,
                y1: y(p),
                y2: y(p),
                stroke: G.ink.guide,
                "stroke-width": G.line.grid,
                "stroke-dasharray": "1 3",
              });
              txt(s, tick({ x: X1 + 8, y: y(p) + 2.2 }), fmt(p));
            }
            txt(s, tick({ x: X1 + 8, y: TOP - 14 }), "点");
            bars.forEach((b, i) => {
              const up = b.c >= b.o,
                star = i === TURN,
                ink = star ? HERO : G.ink.strong,
                g = el(s, "g", { class: "fade", style: dl(0.05 + i * 0.03) });
              el(g, "line", {
                x1: x(i),
                x2: x(i),
                y1: y(b.h),
                y2: y(b.l),
                stroke: ink,
                "stroke-width": star ? G.line.heroData : G.line.data,
              });
              el(g, "rect", {
                x: x(i) - slot * 0.3,
                y: y(Math.max(b.o, b.c)),
                width: slot * 0.6,
                height: Math.max(Math.abs(y(b.o) - y(b.c)), 0.8),
                fill: up ? "var(--color-card)" : ink,
                stroke: ink,
                "stroke-width": star ? G.line.heroData : G.line.data,
              });
              const hit = el(s, "rect", {
                x: x(i) - slot / 2,
                y: TOP,
                width: slot,
                height: BOT - TOP,
                fill: "none",
                "pointer-events": "all",
                class: "hit",
              });
              tip(
                hit,
                `${b.m} 月 ${b.d} 日 · 开 ${fmt(b.o, 1)} · 高 ${fmt(b.h, 1)} · 低 ${fmt(b.l, 1)} · 收 ${fmt(b.c, 1)}`
              );
              if (i % 5 === 0)
                txt(
                  s,
                  tick({ x: x(i), y: BOT + 16, "text-anchor": "middle" }),
                  `${b.m}/${b.d}`
                );
            });
            el(s, "line", {
              x1: X0,
              x2: X1 + 4,
              y1: BOT,
              y2: BOT,
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            // 连跌六天：上方一道括线
            const top = Math.max(...run.map((b) => b.h)),
              bx0 = x(TURN - 6) - slot * 0.4,
              bx1 = x(TURN - 1) + slot * 0.4,
              by = y(top) - 8;
            el(s, "path", {
              d: `M${bx0} ${by + 4}V${by}H${bx1}V${by + 4}`,
              fill: "none",
              stroke: G.ink.quiet,
              "stroke-width": G.line.base,
            });
            txt(
              s,
              tick({ x: (bx0 + bx1) / 2, y: by - 5, "text-anchor": "middle" }),
              `连跌 6 天 −${fmt(-drop, 1)}%`
            );
            // 止跌那根：下影线旁标注
            const t = bars[TURN];
            txt(
              s,
              value({ x: x(TURN) + 7, y: y(t.l) + 3 }, true),
              `最低 ${fmt(t.l, 1)}`
            );
            txt(s, tick({ x: x(TURN) + 7, y: y(t.l) + 13 }), "收盘拉回，止跌");
          });
        })();
      })();
    </script>
  </body>
</html>
