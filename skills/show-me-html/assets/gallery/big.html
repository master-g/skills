    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript

        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>

    <!--SHOW-ME:JS-->
    <script>
      (() => {
        const { el, txt, tip, rnd, pol, sect, blob, reveal, fmt } = showMeChart;
        const $ = (id) => document.getElementById(id);
        const INK = "var(--ink)",
          PAPER = "var(--paper)",
          HERO = "var(--chart-hero)";
        const I90 = "var(--ink-90)",
          I70 = "var(--ink-70)",
          I60 = "var(--ink-60)",
          I45 = "var(--ink-45)",
          I30 = "var(--ink-30)",
          I22 = "var(--ink-22)",
          I14 = "var(--ink-14)",
          I8 = "var(--ink-8)";
        const MUTED = I45,
          GRID = I14,
          FAINT = I22;
        const LAD = [INK, I70, I45, I30, I22]; // 5 级：少系列
        const L = [INK, I90, I70, I60, I45, I30, I22]; // 7 级：多系列
        const D2R = Math.PI / 180;
        const dl = (s) => `animation-delay:${s.toFixed(3)}s`; // 交错入场延迟
        const halo =
          "paint-order:stroke;stroke:var(--paper);stroke-width:3px;stroke-linejoin:round"; // 文字描边遮线

        // ════ B1 · Circular Graph · Dense ════
        (() => {
          // 环形弦膜：60 个仓库按 5 个组织排成环，弦 = 共享贡献者。hover 一个仓库只留它的邻接，其余淡出；重播按钮重来。
          const ORGS = [
            ["platform", 16, INK],
            ["product", 14, I70],
            ["data", 12, I60],
            ["infra", 10, I45],
            ["labs", 8, I30],
          ];
          const nodes = [];
          ORGS.forEach(([org, count], oi) => {
            for (let i = 0; i < count; i++) {
              const heavy =
                i < 2
                  ? 30 + rnd(oi + 1, i + 2) * 45
                  : 4 + rnd(oi + 3, i + 7) * 16;
              nodes.push({
                name:
                  org +
                  "/" +
                  org.slice(0, 2) +
                  "-" +
                  String(i + 1).padStart(2, "0"),
                org: oi,
                value: Math.round(heavy),
              });
            }
          });
          const links = [];
          nodes.forEach((a, i) =>
            nodes.forEach((b, j) => {
              if (j <= i) return;
              const same = a.org === b.org;
              if (rnd(i + 1, j + 2) < (same ? 0.16 : 0.045))
                links.push({
                  s: i,
                  t: j,
                  w: 1 + Math.round(rnd(i + 2, j + 3) * 6),
                  same,
                });
            })
          );
          reveal($("bigcircular"), (s) => {
            const cx = 400,
              cy = 320,
              R = 232,
              N = nodes.length,
              P = nodes.map((n, i) => pol(cx, cy, R, -90 + (i * 360) / N));
            const gl = el(s, "g", {}),
              gn = el(s, "g", {});
            const les = links.map((l, k) => {
              const [xa, ya] = P[l.s],
                [xb, yb] = P[l.t];
              const p = el(gl, "path", {
                d: `M${xa} ${ya} Q${cx} ${cy} ${xb} ${yb}`,
                fill: "none",
                stroke: l.same ? I45 : I30,
                "stroke-width": 0.4 + l.w * 0.28,
                opacity: l.same ? 0.5 : 0.32,
                pathLength: 1,
                class: "draw net-link",
                style: `animation-delay:${0.2 + k * 0.006}s;animation-duration:1.2s`,
              });
              p.dataset.a = l.s;
              p.dataset.b = l.t;
              return p;
            });
            nodes.forEach((n, i) => {
              const [x, y] = P[i],
                a = -90 + (i * 360) / N,
                r = 2.5 + Math.sqrt(n.value) * 1.3;
              const g = el(gn, "g", { class: "net-node", tabindex: 0 });
              g.dataset.i = i;
              el(g, "circle", {
                cx: x,
                cy: y,
                r,
                fill: ORGS[n.org][2],
                class: "pop",
                style: `animation-delay:${i * 0.015}s`,
              });
              tip(g, `${n.name} — ${n.value} contributors`);
              if (n.value >= 26) {
                const [lx, ly] = pol(cx, cy, R + r + 6, a),
                  flip = Math.cos(a * D2R) < 0;
                txt(
                  g,
                  {
                    x: lx,
                    y: ly,
                    "font-size": 8.5,
                    "font-weight": 600,
                    fill: I60,
                    "text-anchor": flip ? "end" : "start",
                    "dominant-baseline": "middle",
                    transform: `rotate(${flip ? a + 180 : a} ${lx} ${ly})`,
                    class: "fade",
                    style: `animation-delay:${0.5 + i * 0.015}s`,
                  },
                  n.name
                );
              }
              const focus = () => {
                s.classList.add("focused");
                const adj = new Set([i]);
                les.forEach((p) => {
                  const hot = +p.dataset.a === i || +p.dataset.b === i;
                  p.classList.toggle("hot", hot);
                  if (hot) {
                    adj.add(+p.dataset.a);
                    adj.add(+p.dataset.b);
                  }
                });
                gn.querySelectorAll(".net-node").forEach((o) =>
                  o.classList.toggle("hot", adj.has(+o.dataset.i))
                );
              };
              const blur = () => {
                s.classList.remove("focused");
                s.querySelectorAll(".hot").forEach((o) =>
                  o.classList.remove("hot")
                );
              };
              g.addEventListener("mouseenter", focus);
              g.addEventListener("focus", focus);
              g.addEventListener("mouseleave", blur);
              g.addEventListener("blur", blur);
            });
            ORGS.forEach(([org, , shade], oi) => {
              el(s, "circle", { cx: 24, cy: 24 + oi * 16, r: 4, fill: shade });
              txt(
                s,
                {
                  x: 34,
                  y: 27 + oi * 16,
                  "font-size": 9,
                  "font-weight": 600,
                  fill: I60,
                },
                org
              );
            });
          });
        })();

        // ════ B2 · Force Graph · Dense ════
        (() => {
          // 力导向星系：8 个域中心各带一群服务，弹簧 + 斥力 + 向心，rAF 松弛；拖任何节点，星系会反抗。
          const DOMAINS = [
            ["auth", 26, INK],
            ["billing", 24, I90],
            ["content", 28, I70],
            ["search", 20, I60],
            ["notify", 22, I45],
            ["media", 20, I45],
            ["analytics", 18, I30],
            ["edge", 14, I30],
          ];
          const nodes = [],
            links = [];
          DOMAINS.forEach(([dom, count, shade], di) => {
            const hi = nodes.length;
            nodes.push({
              name: dom,
              value: 60 + Math.round(rnd(di + 1, 3) * 50),
              hub: true,
              shade,
              dom: di,
            });
            for (let i = 0; i < count; i++) {
              const v =
                i < 3
                  ? 14 + rnd(di + 2, i + 4) * 18
                  : 2 + rnd(di + 5, i + 9) * 9;
              const idx = nodes.length;
              nodes.push({
                name: dom + "-" + String(i + 1).padStart(2, "0"),
                value: Math.round(v),
                hub: false,
                shade,
                dom: di,
              });
              links.push([idx, hi, 0.5 + v * 0.05, I22, 0.5, 30]);
              if (i > 1 && rnd(di + 3, i + 11) < 0.22)
                links.push([
                  idx,
                  hi + 1 + Math.floor(rnd(di + 4, i + 13) * i),
                  0.5,
                  I14,
                  0.4,
                  26,
                ]);
            }
          });
          const H = DOMAINS.length,
            hubIdx = [];
          nodes.forEach((n, i) => {
            if (n.hub) hubIdx.push(i);
          });
          for (let a = 0; a < H; a++)
            for (let b = a + 1; b < H; b++)
              if (rnd(a + 7, b + 9) < 0.42)
                links.push([
                  hubIdx[a],
                  hubIdx[b],
                  1.6 + rnd(a + 2, b + 3) * 2.2,
                  I30,
                  0.65,
                  150,
                ]);
          for (let k = 0; k < 26; k++) {
            const a = 1 + Math.floor(rnd(k + 1, 17) * (nodes.length - 1)),
              b = 1 + Math.floor(rnd(k + 3, 23) * (nodes.length - 1));
            if (
              a !== b &&
              nodes[a].dom !== nodes[b].dom &&
              !nodes[a].hub &&
              !nodes[b].hub
            )
              links.push([a, b, 0.5, I14, 0.38, 120]);
          }
          reveal($("bigforce"), (s, { keep, motion }) => {
            const W = 900,
              H2 = 640;
            nodes.forEach((n, i) => {
              const [x, y] = pol(
                W / 2,
                H2 / 2,
                n.hub ? 170 : 190 + rnd(i, 5) * 60,
                n.dom * 45 + rnd(i, 9) * 40
              );
              n.x = x;
              n.y = y;
              n.vx = 0;
              n.vy = 0;
              n.r = n.hub
                ? 15 + Math.sqrt(n.value) * 0.9
                : 1.2 + Math.sqrt(n.value) * 0.75;
            });
            const gl = el(s, "g", {}),
              gn = el(s, "g", {});
            const les = links.map(([a, b, w, shade, op]) =>
              el(gl, "line", { stroke: shade, "stroke-width": w, opacity: op })
            );
            const ns = nodes.map((n) => {
              const g = el(gn, "g", {
                class: "force-node",
                tabindex: n.hub ? 0 : -1,
              });
              el(g, "circle", {
                r: n.r,
                fill: n.shade,
                stroke: n.hub ? PAPER : "none",
                "stroke-width": n.hub ? 2 : 0,
              });
              tip(g, `${n.name} — ${n.value}k calls/day`);
              if (n.hub)
                txt(
                  g,
                  {
                    y: 3.5,
                    "font-size": 9.5,
                    "font-weight": 600,
                    fill: PAPER,
                    "text-anchor": "middle",
                  },
                  n.name
                );
              return g;
            });
            const step = () => {
              // 斥力 ∝ 1/d²（沿单位向量），软化半径 30px，300px 外不算；中心节点斥力更大；向心 + 弹簧；限速防爆
              for (let i = 0; i < nodes.length; i++) {
                const a = nodes[i];
                for (let j = i + 1; j < nodes.length; j++) {
                  const b = nodes[j];
                  let dx = b.x - a.x,
                    dy = b.y - a.y;
                  const d2 = dx * dx + dy * dy + 900;
                  if (d2 > 90000) continue;
                  const f =
                    (a.hub || b.hub ? 20000 : 2000) / (d2 * Math.sqrt(d2));
                  dx *= f;
                  dy *= f;
                  a.vx -= dx;
                  a.vy -= dy;
                  b.vx += dx;
                  b.vy += dy;
                }
                a.vx += (W / 2 - a.x) * 0.012;
                a.vy += (H2 / 2 - a.y) * 0.012;
              }
              links.forEach(([a, b, , , , len]) => {
                const A = nodes[a],
                  B = nodes[b],
                  dx = B.x - A.x,
                  dy = B.y - A.y,
                  d = Math.hypot(dx, dy) || 1,
                  f = (d - len) * 0.02;
                A.vx += (dx / d) * f;
                A.vy += (dy / d) * f;
                B.vx -= (dx / d) * f;
                B.vy -= (dy / d) * f;
              });
              nodes.forEach((n) => {
                if (n.drag) return;
                n.vx *= 0.7;
                n.vy *= 0.7;
                const sp = Math.hypot(n.vx, n.vy);
                if (sp > 12) {
                  n.vx *= 12 / sp;
                  n.vy *= 12 / sp;
                }
                n.x = Math.min(W - 12, Math.max(12, n.x + n.vx));
                n.y = Math.min(H2 - 12, Math.max(12, n.y + n.vy));
              });
            };
            const draw = () => {
              les.forEach((l, k) => {
                const [a, b] = links[k];
                l.setAttribute("x1", nodes[a].x);
                l.setAttribute("y1", nodes[a].y);
                l.setAttribute("x2", nodes[b].x);
                l.setAttribute("y2", nodes[b].y);
              });
              ns.forEach((g, i) =>
                g.setAttribute(
                  "transform",
                  `translate(${nodes[i].x.toFixed(1)} ${nodes[i].y.toFixed(1)})`
                )
              );
            };
            let it = 0;
            const loop = () => {
              step();
              draw();
              if (++it < 320 || nodes.some((n) => n.drag))
                keep(requestAnimationFrame(loop));
            };
            if (motion) keep(requestAnimationFrame(loop));
            else {
              for (let k = 0; k < 320; k++) step();
              draw();
            }
            const pt = s.createSVGPoint();
            const toSvg = (e) => {
              pt.x = e.clientX;
              pt.y = e.clientY;
              return pt.matrixTransform(s.getScreenCTM().inverse());
            };
            ns.forEach((g, i) => {
              g.style.cursor = "grab";
              g.addEventListener("pointerdown", (e) => {
                nodes[i].drag = true;
                g.setPointerCapture(e.pointerId);
                it = 0;
                const mv = (ev) => {
                  const p = toSvg(ev);
                  nodes[i].x = p.x;
                  nodes[i].y = p.y;
                  if (!motion) draw();
                };
                const up = () => {
                  nodes[i].drag = false;
                  g.removeEventListener("pointermove", mv);
                  g.removeEventListener("pointerup", up);
                  if (motion) keep(requestAnimationFrame(loop));
                };
                g.addEventListener("pointermove", mv);
                g.addEventListener("pointerup", up);
                if (motion) keep(requestAnimationFrame(loop));
              });
            });
          });
        })();

        // ════ B3 · Threads ════
        (() => {
          // 丝线三联：一线 = 一条依赖路径（服务 → 内部库 → 基础设施）。每列节点等距排开，节点是一根发丝宽的竖结，
          // 高 ∝ 经过的路径数；线在结里按相邻一列的顺序排好再收拢，两列之间散开。主角 = 经过 legacy-auth 的一束。
          // 悬停单线看路径，悬停 / Tab 节点看整束，点击钉住，点空白或 Esc 释放；读数写在状态栏。
          const { G, jit, tick, label } = showMeChart;
          const SVC =
            "web ios android admin checkout cart search reco feed notify mail sms billing invoice report export import partner-api open-api webhook cron etl ml-train audit".split(
              " "
            );
          const INFRA = [
            "Postgres",
            "MySQL 旧库",
            "Redis",
            "Kafka",
            "S3",
            "Elasticsearch",
            "ClickHouse",
            "KMS",
            "SMTP",
            "推送网关",
          ];
          // [库名, 主落点, 次落点]，落点是 INFRA 序号；按主落点分组排列
          const LIB = [
            ["config", 0, 2],
            ["feature-flag", 2, 0],
            ["id-gen", 0, 2],
            ["orm", 0, 1],
            ["migrate", 0, 1],
            ["query-builder", 0, 6],
            ["money", 0, 1],
            ["tax", 0, 1],
            ["http-client", 2, 3],
            ["retry", 2, 3],
            ["rate-limit", 2, 2],
            ["cache", 2, 0],
            ["redis-wrap", 2, 2],
            ["auth-sdk", 0, 7],
            ["legacy-auth", 1, 2],
            ["session", 2, 1],
            ["rbac", 0, 1],
            ["crypto", 7, 0],
            ["kms-client", 7, 7],
            ["queue", 3, 2],
            ["event-bus", 3, 3],
            ["scheduler", 3, 0],
            ["logger", 3, 4],
            ["metrics", 6, 3],
            ["tracing", 6, 3],
            ["search-sdk", 5, 0],
            ["vector", 5, 4],
            ["geo", 5, 0],
            ["i18n", 4, 0],
            ["pdf", 4, 4],
            ["csv", 4, 6],
            ["image", 4, 4],
            ["s3-client", 4, 4],
            ["mailer", 8, 3],
            ["sms-gw", 9, 3],
            ["push", 9, 3],
          ];
          const LEG = LIB.findIndex((l) => l[0] === "legacy-auth");
          // 路径 = [服务, 库, 基础设施]。每个服务 4–8 条：27% 走 legacy-auth，否则落在按序号比例映射的就近库（±8），
          // 同一服务不重走同一个库；库到基础设施 72% 走主落点。种子选过：每个服务都经过 legacy-auth、没有空节点
          const paths = [];
          SVC.forEach((_, si) => {
            const n = 4 + Math.floor(rnd(si + 1, 60) * 5),
              near = Math.round((si / (SVC.length - 1)) * (LIB.length - 1)),
              used = new Set();
            for (let t = 0; used.size < n && t < 40; t++) {
              const li =
                rnd(si + 2, t + 61) < 0.27
                  ? LEG
                  : Math.max(
                      0,
                      Math.min(
                        LIB.length - 1,
                        near + Math.round((rnd(si + 3, t + 62) - 0.5) * 16)
                      )
                    );
              if (used.has(li)) continue;
              used.add(li);
              paths.push([si, li, LIB[li][rnd(si + 4, t + 63) < 0.72 ? 1 : 2]]);
            }
          });
          const COLS = [SVC, LIB.map((l) => l[0]), INFRA],
            HEADS = ["服务", "内部库", "基础设施"];
          // via[列][节点] = 经过该节点的路径下标
          const via = COLS.map((names) => names.map(() => []));
          paths.forEach((p, i) => p.forEach((j, c) => via[c][j].push(i)));
          const legPaths = via[1][LEG],
            legSvc = new Set(legPaths.map((i) => paths[i][0])).size,
            legMysql = legPaths.filter((i) => paths[i][2] === 1).length;
          const halo =
            "paint-order:stroke;stroke:var(--color-card);stroke-width:2px;stroke-linejoin:round";
          // Esc 释放钉住；监听只挂一次，reveal 重画时换掉 release
          let release = () => {};
          document.addEventListener("keydown", (e) => {
            if (e.key === "Escape") release();
          });
          reveal($("threads"), (s) => {
            const X = [130, 400, 670],
              Y0 = 40,
              Y1 = 540,
              STEP = 0.3; // 每条路径在结里占的高度
            // 每列等距排开，首尾各留半步；不按人数堆叠
            const yAt = (c, j) => Y0 + ((j + 0.5) * (Y1 - Y0)) / COLS[c].length;
            // 结内槽位：[左端, 中列入, 中列出, 右端]。线按相邻一列的顺序排，交叉少
            const slot = paths.map(() => [0, 0, 0, 0]);
            const place = (c, key, at) =>
              via[c].forEach((ids, j) => {
                const top = yAt(c, j) - (ids.length * STEP) / 2;
                [...ids]
                  .sort((a, b) => key(a) - key(b))
                  .forEach((i, r) => (slot[i][at] = top + (r + 0.5) * STEP));
              });
            place(0, (i) => paths[i][1] * 10 + paths[i][2], 0);
            place(1, (i) => paths[i][0], 1);
            place(1, (i) => paths[i][2] * 100 + paths[i][0], 2);
            place(2, (i) => paths[i][1] * 100 + paths[i][0], 3);
            // 控制点水平偏移 = 半个列距，±28% 抖动让每条弯得略有不同；端点落在结上，不抖
            const half = (X[1] - X[0]) / 2,
              bend = (i, k) => half * (1 + jit(i, k, G.jitter.bend * 2)),
              f = (v) => v.toFixed(2);
            const ds = paths.map((p, i) => {
              const [a, b, c, e] = slot[i],
                h1 = bend(i, 1),
                h2 = bend(i, 2);
              return (
                `M${X[0]} ${f(a)}C${f(X[0] + h1)} ${f(a)} ${f(X[1] - h1)} ${f(b)} ${X[1]} ${f(b)}` +
                `L${X[1]} ${f(c)}C${f(X[1] + h2)} ${f(c)} ${f(X[2] - h2)} ${f(e)} ${X[2]} ${f(e)}`
              );
            });
            // 线色放在分组上：路径自己不带 stroke，.thread.hot 的主角色才盖得上
            const layer = (stroke, w) =>
              el(s, "g", {
                fill: "none",
                stroke,
                "stroke-width": w,
                "pointer-events": "none",
              });
            const gMass = layer(G.ink.mass, G.line.thread),
              gQuiet = layer(G.ink.quiet, G.line.thread),
              gHero = layer(HERO, G.line.heroThread);
            // 热区：不画出来，只接指针
            const gHit = el(s, "g", {
              fill: "none",
              stroke: "none",
              "stroke-width": 8,
              "pointer-events": "stroke",
            });
            const threads = paths.map((p, i) =>
              el(
                p[1] === LEG
                  ? gHero
                  : rnd(i + 5, 71) < G.jitter.accent
                    ? gQuiet
                    : gMass,
                "path",
                {
                  d: ds[i],
                  pathLength: 1,
                  class: "draw thread",
                  style: dl(0.1 + i * 0.004),
                }
              )
            );
            const hits = ds.map((d) => el(gHit, "path", { d, class: "hit" }));
            const nodes = COLS.map((names, c) =>
              names.map((name, j) => {
                const x = X[c],
                  y = yAt(c, j),
                  n = via[c][j].length,
                  h = Math.max(n * STEP, G.line.hero),
                  hero = c === 1 && j === LEG,
                  side = c === 0 ? -1 : 1;
                const node = el(s, "g", { class: "nodelab", tabindex: 0 });
                // 入场淡入放在内层：动画的 opacity 会盖过聚焦态的淡出
                const g = el(node, "g", {
                  class: "fade",
                  style: dl(0.3 + c * 0.1),
                });
                el(g, "line", {
                  x1: x,
                  x2: x,
                  y1: y - h / 2,
                  y2: y + h / 2,
                  stroke: G.ink.strong,
                  "stroke-width": G.line.hero,
                });
                const at = {
                  x: x + side * 5,
                  "text-anchor": side < 0 ? "end" : "start",
                };
                if (names.length > 12) {
                  // 单行「名字 数量」，下垫卡片色小块，穿过的线不会像连字符
                  const bg = el(g, "rect", {
                    rx: 1.5,
                    fill: "var(--color-card)",
                  });
                  const t = txt(
                    g,
                    tick({
                      ...at,
                      y,
                      "dominant-baseline": "central",
                      fill: hero ? HERO : G.ink.quiet,
                      style: halo,
                    }),
                    name
                  );
                  el(t, "tspan", {
                    dx: 3,
                    fill: hero ? HERO : G.ink.mass,
                  }).textContent = n;
                  const b = t.getBBox();
                  bg.setAttribute("x", b.x - 1.5);
                  bg.setAttribute("y", b.y - 1);
                  bg.setAttribute("width", b.width + 3);
                  bg.setAttribute("height", b.height + 2);
                } else {
                  txt(g, label({ ...at, y: y + 1, style: halo }), name);
                  txt(g, tick({ ...at, y: y + 9, style: halo }), n);
                }
                return node;
              })
            );
            COLS.forEach((names, c) =>
              txt(
                s,
                tick({
                  x: X[c],
                  y: 16,
                  "text-anchor": "middle",
                  "letter-spacing": G.type.track * 4,
                }),
                `${HEADS[c]} · ${names.length}`
              )
            );

            // ── 交互：cur = 钉住优先，其次悬停；["p", 路径] 或 ["n", 列, 节点]
            const bar = s.closest("figure").querySelector(".fig-status"),
              sText = bar.querySelector("[data-text]"),
              sPin = bar.querySelector("[data-pin]");
            // 状态栏用 DOM 构造：数字加粗，其余是文本
            const put = (...parts) =>
              sText.replaceChildren(
                ...parts.map((v) =>
                  typeof v === "number"
                    ? Object.assign(document.createElement("b"), {
                        textContent: v,
                      })
                    : v
                )
              );
            // 某列计数前三名：「MySQL 旧库 20、Redis 3、Postgres 1」
            const top3 = (ids, c) => {
              const m = new Map();
              ids.forEach((i) =>
                m.set(paths[i][c], (m.get(paths[i][c]) || 0) + 1)
              );
              return [...m]
                .sort((a, b) => b[1] - a[1] || a[0] - b[0])
                .slice(0, 3)
                .map(([j, k]) => `${COLS[c][j]} ${k}`)
                .join("、");
            };
            let hov = null,
              pin = null;
            const show = () => {
              const cur = pin || hov;
              s.classList.toggle("focused", !!cur);
              sPin.textContent = pin ? "已钉住 · 点空白或 Esc 释放" : "";
              const ids = !cur
                ? []
                : cur[0] === "p"
                  ? [cur[1]]
                  : via[cur[1]][cur[2]];
              const lit = COLS.map(() => new Set());
              ids.forEach((i) => paths[i].forEach((j, c) => lit[c].add(j)));
              threads.forEach((t, i) =>
                t.classList.toggle("hot", ids.includes(i))
              );
              nodes.forEach((col, c) =>
                col.forEach((g, j) => g.classList.toggle("hot", lit[c].has(j)))
              );
              if (!cur)
                put(
                  legSvc,
                  " 个服务全部经过 legacy-auth · 其中 ",
                  legMysql,
                  ` 条路径最后落到 MySQL 旧库 · 共 ${paths.length} 条路径`
                );
              else if (cur[0] === "p")
                put(paths[cur[1]].map((j, c) => COLS[c][j]).join(" → "));
              else
                put(
                  `${COLS[cur[1]][cur[2]]} `,
                  ids.length,
                  ` 条路径 · ${cur[1] === 2 ? "经由" : "落到"}：${top3(ids, cur[1] === 2 ? 1 : 2)}`
                );
            };
            const bind = (node, key) => {
              node.addEventListener("mouseenter", () => ((hov = key), show()));
              node.addEventListener("mouseleave", () => ((hov = null), show()));
              node.addEventListener("click", (e) => {
                e.stopPropagation();
                pin = key;
                show();
              });
            };
            hits.forEach((p, i) => bind(p, ["p", i]));
            nodes.forEach((col, c) =>
              col.forEach((g, j) => {
                const key = ["n", c, j];
                bind(g, key);
                g.addEventListener("focus", () => ((hov = key), show()));
                g.addEventListener("blur", () => ((hov = null), show()));
                g.addEventListener("keydown", (e) => {
                  if (e.key !== "Enter" && e.key !== " ") return;
                  e.preventDefault();
                  pin = key;
                  show();
                });
              })
            );
            release = () => {
              pin = null;
              show();
            };
            s.onclick = release; // 点空白释放；重画时覆盖，不叠监听
            show();
          });
        })();
      })();
    </script>
  </body>
</html>
