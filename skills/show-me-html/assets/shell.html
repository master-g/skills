<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PAGE TITLE</title>
    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500;600&amp;family=IBM+Plex+Sans:wght@400;500;600;700&amp;family=Newsreader:opsz,wght@6..72,400;6..72,500;6..72,600&amp;family=Noto+Serif+SC:wght@500;700&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!--SHOW-ME:CSS-->
  </head>
  <body data-recipe="choose-a-recipe">
    <header class="page-chrome" data-md-skip>
      <div class="chrome-inner">
        <span class="chrome-title">PAGE TITLE</span>
        <div class="chrome-actions">
          <button
            type="button"
            class="btn"
            data-variant="outline"
            data-size="icon-sm"
            data-copy-md
            title="复制为 Markdown"
            aria-label="复制为 Markdown"
          >
            <i data-lucide="clipboard"></i><i data-lucide="check" hidden></i>
          </button>
          <div class="button-group theme-switch" role="group" aria-label="主题">
            <button
              type="button"
              class="btn"
              data-variant="outline"
              data-size="icon-sm"
              data-theme-set="light"
              title="浅色"
              aria-label="浅色"
            >
              <i data-lucide="sun"></i>
            </button>
            <button
              type="button"
              class="btn"
              data-variant="outline"
              data-size="icon-sm"
              data-theme-set="system"
              title="跟随系统"
              aria-label="跟随系统"
            >
              <i data-lucide="monitor"></i>
            </button>
            <button
              type="button"
              class="btn"
              data-variant="outline"
              data-size="icon-sm"
              data-theme-set="dark"
              title="深色"
              aria-label="深色"
            >
              <i data-lucide="moon"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <main id="doc">
        <!-- 页面内容写在这里。#doc 的内容就是「复制为 Markdown」导出的范围。 -->
      </main>
      <!-- 右侧目录：骨架 JS 自动生成条目；条目不足 2 个时整块不出现，不要手写 -->
      <aside class="toc" data-md-skip aria-labelledby="toc-title">
        <nav class="toc-inner">
          <div class="toc-marker"></div>
          <div class="toc-title" id="toc-title" role="heading" aria-level="2">
            本页目录
          </div>
          <ul class="toc-list root"></ul>
        </nav>
      </aside>
    </div>

    <!-- 骨架行为脚本（主题切换、目录、Markdown 导出、代码工具条等）在 assets/shell.js，build.py 每次构建注入到这里 -->
    <!--SHOW-ME:JS-->
  </body>
</html>
