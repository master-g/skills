<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>PAGE TITLE</title>
    <!-- ── 网络字体：本骨架唯一允许的外部资源 ─────────────────────────────────
         **异步加载**（media="print" + onload 换回 all）。fonts.googleapis.com 在
         部分网络下不可达，同步 <link> 会把首屏卡在请求超时上；这样写则首屏立刻用
         兜底字体渲染，字体取到了再换上去。

         取不到时页面完全正常，只是落到系统字体 —— `--font-serif` / `--font-mono`
         的后半段就是为这种情况准备的，**别把它们删短**。

         CJK 只请求 500/700，不请求 400：正文请求 400 时 CSS 的字体匹配会挑最近的可用面
         （400→500），中文因此自动比拉丁重一档 —— 中西配平就这么来的，不用写技巧。
         少要一个 600 是有意的：Google 把中文切成上百个 unicode-range 分片，每多一个字重
         就多约 31 KB 的声明（三个字重 93 KB，两个 63 KB）；h3 的 600 会落到 700，是真字重
         不是合成粗体。详见 references/components.md 的「字体」。 -->
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      rel="stylesheet"
      media="print"
      onload="this.media = 'all'"
      href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&amp;family=Noto+Serif+SC:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
    />
    <noscript
      ><link
        rel="stylesheet"
        href="https://fonts.googleapis.com/css2?family=Merriweather:wght@400;700&amp;family=Noto+Serif+SC:wght@500;700&amp;family=JetBrains+Mono:wght@400;500;600&amp;display=swap"
    /></noscript>
    <script>
      /* 主题：在首次绘制前决定，避免闪烁。三态 light / dark / system。 */
      (function () {
        var t = null;
        try {
          t = localStorage.getItem("show-me-theme");
        } catch (e) {}
        if (t !== "light" && t !== "dark") t = "system";
        var dark =
          t === "dark" ||
          (t === "system" &&
            matchMedia("(prefers-color-scheme: dark)").matches);
        document.documentElement.classList.toggle("dark", dark);
        document.documentElement.dataset.theme = t;
      })();
    </script>
    <!--SHOW-ME:CSS-->
    <style data-show-me="palette">
      /* ── Anthropic 调色板。整块不要改，页面自己的样式写到下一个 <style> 里。 ──
     色值来自 anthropic.design.md。浅色一栏是原值；深色一栏是推导值 ——
     design.md 只描述了浅色的 marketing 面，没有暗色梯度。
     这段 CSS 不在 @layer 里，所以优先于 basecoat 分层定义的中性灰。 */
      :root {
        /* 8 色强调面板（research / news 子页的分类色）。页面用 data-tone 取用。 */
        --tone-clay: #d97757;
        --tone-fig: #c46686;
        --tone-sky: #6a9bcc;
        --tone-cactus: #bcd1ca;
        --tone-olive: #788c5d;
        --tone-heather: #cbcadb;
        --tone-kraft: #d4a27f;
        --tone-manilla: #ebdbbc;
        --ink-fixed: #141413; /* 两种主题下都不变，给反白文字用 */
        /* 拉丁在前，中文在后 —— 字体栈按字符逐个回落，Georgia 没有汉字自然让给后面。
           "Han Serif Balanced" 是下面 @font-face 拼出来的配平家族，装了思源宋体才生效；
           没装就继续往后落。**家族名写错一个字母的表现是静默回退**（"Source Han Serif SC"
           少了 " VF" 就一直落在 Songti SC 上，只表现为「怎么这么细」），build.py 有闸门守着。 */
        --font-serif:
          /* 网络字体 */
          Merriweather, "Noto Serif SC", /* 拉丁兜底 */ Georgia,
          "Iowan Old Style", "Times New Roman",
          /* 中文兜底 */ "Han Serif Balanced", "Source Han Serif SC VF",
          "Source Han Serif SC", "Noto Serif CJK SC", "Songti SC", STSong,
          SimSun, serif;

        --background: #faf9f5; /* canvas */
        --foreground: #141413; /* ink */
        --card: #f0eee6; /* surface-secondary：卡片比页面底深一步，不靠阴影 */
        --card-foreground: #141413;
        --popover: #faf9f5;
        --popover-foreground: #141413;
        --primary: #d97757; /* clay。ink 字在其上 5.9:1 */
        --primary-foreground: #141413;
        --secondary: #f0eee6;
        --secondary-foreground: #141413;
        --muted: #f0eee6;
        --muted-foreground: #5e5d59; /* text-muted。design.md 的 #b0aea5 只有 2.1:1，仅够做装饰线 */
        --accent: #e8e6dc; /* surface-secondary-hover：悬停面要比 muted 再深一步才看得出 */
        --accent-foreground: #141413;
        --destructive: #9d3c5c; /* 推导：fig 压暗。白字 6.5:1，作文字在卡片上 5.6:1 */
        --border: #d1cfc5; /* hairline */
        --input: #d1cfc5;
        --ring: #d97757;
        /* 图表色在浅底上压暗到 ≥3.4:1，深底上用原色 */
        --chart-1: #c96442;
        --chart-2: #4f7fb3;
        --chart-3: #6a7d4f;
        --chart-4: #b1567a;
        --chart-5: #87867f;
        --link-accent: #a8422a; /* 推导：clay 压暗到 5.7:1，正文链接的悬停色 */
        /* 语法高亮。chart 色是按色块的 3:1 调的，当代码文字用在浅底上只有 3.2–4.0:1，
           所以另推一组：在代码块底（--color-muted）上实测 4.62–5.67:1 */
        --syn-comment: #5e5d59;
        --syn-keyword: #a65337;
        --syn-string: #5f7047;
        --syn-type: #446d9a;
        --syn-number: #a34f71;
      }
      .dark {
        --background: #191817; /* 暖黑，不是纯黑：整页长文用 #000 太硬 */
        --foreground: #faf9f5;
        --card: #232120;
        --card-foreground: #faf9f5;
        --popover: #232120;
        --popover-foreground: #faf9f5;
        --primary: #d97757;
        --primary-foreground: #141413;
        --secondary: #2b2926;
        --secondary-foreground: #faf9f5;
        --muted: #232120;
        --muted-foreground: #a3a099;
        --accent: #332f2c;
        --accent-foreground: #faf9f5;
        --destructive: #e08099; /* 亮玫红：作文字在卡片上 5.9:1 */
        --border: #faf9f524;
        --input: #faf9f533;
        --ring: #d97757;
        --chart-1: #d97757;
        --chart-2: #6a9bcc;
        --chart-3: #9ab07a;
        --chart-4: #c46686;
        --chart-5: #a3a099;
        --link-accent: #e8926f;
        --syn-comment: #a3a099;
        --syn-keyword: #d97757;
        --syn-string: #9ab07a;
        --syn-type: #6a9bcc;
        --syn-number: #cd6a8c;
      }

      /* 分类色：任意元素写 data-tone="clay|fig|sky|cactus|olive|heather|kraft|manilla"，
     拿到 --tone / --tone-surface / --tone-edge / --tone-ink 四个变量。
     色调面上的 --tone-ink 两种主题都 ≥5:1，正文色（--color-foreground）≥11:1。 */
      [data-tone="clay"] {
        --tone: var(--tone-clay);
      }
      [data-tone="fig"] {
        --tone: var(--tone-fig);
      }
      [data-tone="sky"] {
        --tone: var(--tone-sky);
      }
      [data-tone="cactus"] {
        --tone: var(--tone-cactus);
      }
      [data-tone="olive"] {
        --tone: var(--tone-olive);
      }
      [data-tone="heather"] {
        --tone: var(--tone-heather);
      }
      [data-tone="kraft"] {
        --tone: var(--tone-kraft);
      }
      [data-tone="manilla"] {
        --tone: var(--tone-manilla);
      }
      [data-tone] {
        --tone-surface: color-mix(
          in oklab,
          var(--tone) 16%,
          var(--color-background)
        );
        --tone-edge: color-mix(
          in oklab,
          var(--tone) 34%,
          var(--color-background)
        );
        --tone-ink: color-mix(
          in oklab,
          var(--color-foreground) 55%,
          var(--tone)
        );
      }
      .dark [data-tone] {
        --tone-surface: color-mix(
          in oklab,
          var(--tone) 20%,
          var(--color-background)
        );
        --tone-edge: color-mix(
          in oklab,
          var(--tone) 38%,
          var(--color-background)
        );
        --tone-ink: color-mix(
          in oklab,
          var(--tone) 78%,
          var(--color-foreground)
        );
      }
      .card[data-tone],
      .alert[data-tone],
      .item[data-tone] {
        background-color: var(--tone-surface);
        border-color: var(--tone-edge);
      }
      .badge[data-tone] {
        background-color: var(--tone-surface);
        color: var(--tone-ink);
        border-color: var(--tone-edge);
      }
    </style>

    <style>
      /* ── 页面级排版。组件外观全部来自 basecoat，这里只写版式。 ── */
      :root {
        --font-sans:
          ui-sans-serif, system-ui, -apple-system, "Segoe UI", Roboto,
          "PingFang SC", "Hiragino Sans GB", "Microsoft YaHei", sans-serif;
        /* 中文没有好的系统等宽，交给正文那支 sans —— 代码块里真正需要等宽对齐的是
           拉丁与符号，中文只出现在注释与眉标上。不写就会落到某支度量不同的字体上。 */
        --font-mono:
          /* 网络字体 */
          "JetBrains Mono", /* 兜底 */ ui-monospace, SFMono-Regular, "SF Mono",
          Menlo, Consolas, "Liberation Mono", "PingFang SC", "Microsoft YaHei",
          monospace;
        /* 缓动。两条就够，别再造第三条。
           expo：Calligraph 的默认曲线，冲出去然后长长地收住，适合位移与淡入淡出。
           spring：ζ=0.72 的阻尼弹簧采样成 linear()，约 3.8% 过冲，适合数字与尺寸变化。
           JS 里要一样的手感就照抄 interactions.md 的 EASE，两边是同一条曲线。 */
        --ease-expo: cubic-bezier(0.19, 1, 0.22, 1);
        --ease-spring: linear(
          0,
          0.0533,
          0.1781,
          0.3335,
          0.492,
          0.6367,
          0.7591,
          0.856,
          0.9282,
          0.9785,
          1.0107,
          1.0289,
          1.037,
          1.0382,
          1.0352,
          1.0299,
          1.0238,
          1.0179,
          1.0125,
          1.0081,
          1.0046,
          1.0021,
          1.0004,
          0.9993,
          0.9988,
          0.9985,
          0.9986,
          0.9987,
          0.9989,
          0.9992,
          1
        );
        --page: 60rem; /* 常规页宽；读多写少的长文改 46rem */
        --gutter: 1.5rem;
        --toc-w: 15rem; /* 右侧目录列宽 */
      }
      /* ── 中西配平 ────────────────────────────────────────────────────────
         思源宋体的笔画比 Georgia 细，同一 font-weight 下并排会显得虚。CSS 没法在一条
         font-family 栈里给不同字体指定不同字重，于是给中文单起一个家族，用单值字重面
         把它整体推重一档：请求 400 落到 500，600 落到 600，700 落到 700。

         **单值范围（`500 500`）是必须的**：写成 `500 900` 浏览器会按请求的字重去实例化
         可变轴，配平当场失效。

         src 全是 `local()` —— 页面不联网，装了哪支用哪支，一支都没有时整个 @font-face
         被忽略，`--font-serif` 继续往后落到系统宋体。这是渐进增强，不是保证。
         想调深浅就动这三个数（思源 wght 轴 250~900，一档 50 看得出来）。 */
      @font-face {
        font-family: "Han Serif Balanced";
        src:
          local("Source Han Serif SC VF"), local("Source Han Serif SC"),
          local("Noto Serif CJK SC"), local("Noto Serif SC");
        font-weight: 500 500;
      }
      @font-face {
        font-family: "Han Serif Balanced";
        src:
          local("Source Han Serif SC VF"), local("Source Han Serif SC"),
          local("Noto Serif CJK SC"), local("Noto Serif SC");
        font-weight: 600 600;
      }
      @font-face {
        font-family: "Han Serif Balanced";
        src:
          local("Source Han Serif SC VF"), local("Source Han Serif SC"),
          local("Noto Serif CJK SC"), local("Noto Serif SC");
        font-weight: 700 700;
      }

      html {
        scroll-behavior: smooth;
      }
      /* 运动敏感用户：关掉平滑滚动与所有骨架过渡（页面自己的动效由 interactions.md 管） */
      @media (prefers-reduced-motion: reduce) {
        html {
          scroll-behavior: auto;
        }
        *,
        *::before,
        *::after {
          transition-duration: 0.01ms !important;
          animation-duration: 0.01ms !important;
        }
      }
      body {
        min-height: 100vh;
        text-rendering: optimizeLegibility;
        -webkit-font-smoothing: antialiased;
        -moz-osx-font-smoothing: grayscale;
      }
      /* 断词交给作者，不交给算法：auto 会在中英混排里断出莫名其妙的位置 */
      main {
        -webkit-hyphens: manual;
        hyphens: manual;
      }
      [hidden] {
        display: none !important;
      }
      /* 版心：工具条内层与内容容器共用同一组几何，左右缘因此始终对齐 */
      .chrome-inner,
      .layout {
        max-width: var(--page);
        margin-inline: auto;
        padding-inline: var(--gutter);
      }
      main {
        padding-block: 2.5rem 6rem;
      }
      /* ≥80rem 且目录存在（body.has-toc，由骨架 JS 开门）时：版心向右扩出目录列，内容列宽度不变 */
      @media (min-width: 80rem) {
        body.has-toc .chrome-inner,
        body.has-toc .layout {
          max-width: calc(var(--page) + var(--toc-w) + 3rem);
        }
        body.has-toc .layout {
          display: grid;
          grid-template-columns: minmax(0, 1fr) var(--toc-w);
          gap: 3rem;
        }
      }
      main > section {
        margin-block-start: 3.5rem;
        scroll-margin-top: 5rem;
      }
      main > section:first-of-type {
        margin-block-start: 0;
      }
      #doc h2,
      #doc h3 {
        scroll-margin-top: 5rem;
      } /* 目录锚点跳转别被 sticky 工具条盖住 */

      /* 标题走衬线、字重 400 —— Anthropic 的层级靠字号和留白，不靠加粗 */
      /* balance：标题不许出现一个字单独占一行。pretty：段末不许留孤字。
         都是纯排版收尾，不支持的浏览器忽略即可。 */
      h1,
      h2,
      h3,
      h4 {
        text-wrap: balance;
      }
      main p,
      main li,
      figcaption,
      blockquote {
        text-wrap: pretty;
      }
      /* 表格里的数字要能按位对齐，这是表格的本分，不该让每个页面自己加行内样式 */
      .table {
        font-variant-numeric: tabular-nums;
      }

      /* ── 滑块 ────────────────────────────────────────────────────────────
         **三种选择器一起写，缺一不可。** basecoat 只管 `.field > input[type=range]`
         和 `.input[type=range]`；页面自造一个 `.knob` 之类的壳把滑块包进去，两个都不命中，
         滑块就退回操作系统外观 —— macOS 上是一条亮蓝色粗轨道，跟任何调色板都不搭。
         它不报错，只是难看。所以这里连裸 `input[type=range]` 一起兜住。 */
      input[type="range"],
      .field > input[type="range"],
      .input[type="range"] {
        appearance: none;
        -webkit-appearance: none;
        width: 100%;
        height: 1.25rem; /* 命中区，不是视觉高度；视觉高度在 track 上 */
        padding: 0;
        background: transparent;
        cursor: pointer;
      }
      input[type="range"]::-webkit-slider-runnable-track,
      .field > input[type="range"]::-webkit-slider-runnable-track,
      .input[type="range"]::-webkit-slider-runnable-track {
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(
          to right,
          var(--color-primary) var(--slider-value, 0%),
          var(--color-border) var(--slider-value, 0%)
        );
      }
      input[type="range"]::-webkit-slider-thumb,
      .field > input[type="range"]::-webkit-slider-thumb,
      .input[type="range"]::-webkit-slider-thumb {
        appearance: none;
        -webkit-appearance: none;
        width: 0.75rem;
        height: 0.75rem;
        margin-top: -0.25rem; /* (4px − 12px) / 2，把圆点压回轨道中线 */
        border: 0;
        border-radius: 999px;
        background: var(--color-primary);
      }
      input[type="range"]::-moz-range-track,
      .field > input[type="range"]::-moz-range-track,
      .input[type="range"]::-moz-range-track {
        height: 4px;
        border-radius: 999px;
        background: linear-gradient(
          to right,
          var(--color-primary) var(--slider-value, 0%),
          var(--color-border) var(--slider-value, 0%)
        );
      }
      input[type="range"]::-moz-range-thumb,
      .field > input[type="range"]::-moz-range-thumb,
      .input[type="range"]::-moz-range-thumb {
        width: 0.75rem;
        height: 0.75rem;
        border: 0;
        border-radius: 999px;
        background: var(--color-primary);
      }
      input[type="range"]:focus-visible {
        outline: 2px solid var(--color-ring);
        outline-offset: 2px;
      }
      h1 {
        font-family: var(--font-serif);
        font-size: 2.125rem;
        font-weight: 400;
        letter-spacing: -0.01em;
        line-height: 1.2;
      }
      h2 {
        font-family: var(--font-serif);
        font-size: 1.5rem;
        font-weight: 400;
        line-height: 1.3;
        margin-block-end: 1.25rem;
      }
      h3 {
        font-size: 1rem;
        font-weight: 600;
      }
      p {
        line-height: 1.7;
      }
      /* ── 间距节奏：四级 56 / 40 / 20 / 12，层级靠间距读出来，不靠分隔线 ──
         56 大节之间 · 40 新小节开始 · 20 不同类型的块之间 · 12 同一组内
         四条规则优先级相同（0,0,3），**顺序即胜负**，不要重排。 */
      main > section > * + * {
        margin-block-start: 1.25rem; /* 块与块：段落→表格、段落→代码、卡片网格前后 */
      }
      main p + p {
        margin-block-start: 0.75rem; /* 连续段落属于同一组，比块间距紧 */
      }
      main > section > * + h3 {
        margin-block-start: 2.5rem; /* 新小节开始。h3 与正文同字号，层级全靠这段空隙 */
      }
      main > section > h3 + * {
        margin-block-start: 0.75rem; /* 标题与它的第一块内容是一组 */
      }
      /* basecoat 的 .alert > section 是 grid，其内 p 自带 margin-bottom，
         与 gap 叠加后会比正文段落还松 —— 容器内不该比容器外松 */
      .alert > section > p {
        margin-block-end: 0;
      }
      .alert > section > p + p {
        margin-block-start: 0.5rem;
      }
      /* 眉标：mono 大写小字。放在 [data-tone] 里会跟着拿分类色 */
      .eyebrow {
        font-family: var(--font-mono);
        font-size: 0.75rem;
        letter-spacing: 0.08em;
        text-transform: uppercase;
        color: var(--tone-ink, var(--color-muted-foreground));
      }
      /* 链接是正文色 + clay 下划线：clay 直接当文字色只有 2.9:1。只管正文，目录与 chrome 不吃这套 */
      main a:not(.btn):not(.item) {
        color: var(--color-foreground);
        text-decoration: underline;
        text-decoration-color: var(--tone-clay);
        text-underline-offset: 2px;
        text-decoration-thickness: 1px;
      }
      main a:not(.btn):not(.item):hover {
        color: var(--link-accent);
        text-decoration-color: var(--link-accent);
      }
      main a:not(.btn):not(.item):focus-visible {
        outline: 2px solid var(--color-ring);
        outline-offset: 2px;
      }
      ul,
      ol {
        padding-inline-start: 1.25rem;
        line-height: 1.7;
      }
      ul {
        list-style: disc;
      }
      ol {
        list-style: decimal;
      }
      li + li {
        margin-block-start: 0.25rem;
      }
      pre {
        overflow-x: auto;
        padding: 1rem;
        border-radius: var(--radius);
        background: var(--color-muted);
        font-size: 0.8125rem;
        line-height: 1.6;
      }
      pre code {
        font-family: var(--font-mono);
      }
      /* 语法高亮：class 由 build.py 内联的分词器在运行时发，配色在这里给。
         运算符（shj-syn-oper）和变量（shj-syn-var）刻意不上色 —— 全上会花。 */
      .shj-syn-cmnt {
        color: var(--syn-comment);
        font-style: italic;
      }
      .shj-syn-kwd,
      .shj-syn-bool {
        color: var(--syn-keyword);
      }
      .shj-syn-str,
      .shj-syn-insert {
        color: var(--syn-string);
      }
      .shj-syn-type,
      .shj-syn-class,
      .shj-syn-func,
      .shj-syn-section {
        color: var(--syn-type);
      }
      .shj-syn-num {
        color: var(--syn-number);
      }
      .shj-syn-err,
      .shj-syn-deleted {
        color: var(--color-destructive);
      }
      /* 行内 code 用 manilla 淡底，卡片（--color-card）里也分得出来 */
      :not(pre) > code {
        font-family: var(--font-mono);
        font-size: 0.8125rem;
        background: color-mix(
          in oklab,
          var(--tone-manilla) 30%,
          var(--color-background)
        );
        padding: 0.125rem 0.375rem;
        border-radius: calc(var(--radius) - 2px);
      }
      /* 只管正文里的分隔线；组件内部的 hr（.item-group、菜单、按钮组）交给 basecoat */
      main > section > hr {
        border: 0;
        border-top: 1px solid var(--color-border);
        margin-block: 2rem;
      }
      blockquote {
        border-inline-start: 2px solid var(--color-border);
        padding-inline-start: 1rem;
        color: var(--color-muted-foreground);
      }
      /* 内容里的长标识符不得撑破栅格 */
      .grid,
      [class*="cols-"] {
        min-width: 0;
      }
      .grid > *,
      main > * {
        min-width: 0;
      }
      code,
      .kbd {
        overflow-wrap: anywhere;
      }

      /* ── 页眉工具条：背景和 hairline 全宽，内容靠 .chrome-inner 与版心对齐 ── */
      .page-chrome {
        position: sticky;
        top: 0;
        z-index: 40;
        background: color-mix(
          in oklab,
          var(--color-background) 88%,
          transparent
        );
        backdrop-filter: blur(8px);
        border-block-end: 1px solid var(--color-border);
      }
      .chrome-inner {
        display: flex;
        align-items: center;
        gap: 0.75rem;
        padding-block: 0.625rem;
      }
      .page-chrome .chrome-title {
        font-size: 0.8125rem;
        font-weight: 500;
        color: var(--color-muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        flex: 1 1 auto;
        min-width: 0; /* 没有这两条，工具条会把整页撑宽 */
      }
      .page-chrome .chrome-actions {
        margin-inline-start: auto;
        display: flex;
        align-items: center;
        gap: 0.5rem;
      }
      /* 选中态用 primary 而不是 accent：accent 在浅色主题下与白底几乎同色，看不出选了哪个 */
      .theme-switch button[aria-pressed="true"] {
        background: var(--color-primary);
        color: var(--color-primary-foreground);
        border-color: var(--color-primary);
      }

      /* ── 右侧目录。结构参考 VitePress outline：hairline 轨道 + 滑动指示条 + 嵌套链接。
     骨架 JS 扫描 #doc 的 h2/h3 生成条目；≥80rem 且条目 ≥2 时出现，否则整块不存在。 ── */
      .toc {
        display: none;
      }
      @media (min-width: 80rem) {
        body.has-toc .toc {
          display: block;
        }
      }
      .toc-inner {
        position: sticky;
        top: 4.5rem;
        max-height: calc(100vh - 6rem);
        overflow-y: auto;
        border-inline-start: 1px solid var(--color-border);
        padding-inline-start: 1rem;
      }
      .toc-marker {
        position: absolute;
        top: 2rem;
        left: -1px;
        width: 2px;
        height: 1.125rem;
        border-radius: 2px;
        background: var(--color-primary);
        opacity: 0;
        transition:
          top 0.25s cubic-bezier(0, 1, 0.5, 1),
          opacity 0.25s;
      }
      .toc-title {
        font-size: 0.8125rem;
        font-weight: 600;
        line-height: 2rem;
      }
      .toc-list {
        position: relative;
        z-index: 1;
        list-style: none;
        padding-inline-start: 0;
        line-height: inherit;
      }
      .toc-list .toc-list {
        padding-inline-start: 1rem;
      }
      .toc-list li + li {
        margin-block-start: 0;
      }
      .toc-link {
        display: block;
        line-height: 1.875rem;
        font-size: 0.8125rem;
        color: var(--color-muted-foreground);
        white-space: nowrap;
        overflow: hidden;
        text-overflow: ellipsis;
        transition: color 0.5s;
      }
      .toc-link:hover,
      .toc-link.active {
        color: var(--color-foreground);
        transition: color 0.25s;
      }
      @media (max-width: 640px) {
        :root {
          --gutter: 1rem;
        }
        main {
          padding-block-start: 1.75rem;
        }
      }
      @media print {
        .page-chrome,
        .toc {
          display: none;
        }
        /* 打印永远用浅色纸：深色主题的前景 token 是浅色，不重置会变成浅字印白纸 */
        :root,
        .dark {
          --background: #fff;
          --foreground: #141413;
          --card: #fff;
          --card-foreground: #141413;
          --muted: #fff;
          --muted-foreground: #5e5d59;
          --border: #d1cfc5;
          background: #fff;
        }
        .layout {
          max-width: none;
          padding: 0;
          display: block;
        }
        main {
          padding: 0;
        }
        /* 纸质副本能追链接：正文链接后附 href */
        main a[href^="http"]::after {
          content: " (" attr(href) ")";
          font-size: 0.75em;
          word-break: break-all;
        }
      }
    </style>
  </head>
  <body>
    <header class="page-chrome" data-md-skip>
      <div class="chrome-inner">
        <span class="chrome-title">PAGE TITLE</span>
        <div class="chrome-actions">
          <button
            type="button"
            class="btn"
            data-variant="outline"
            data-size="icon-sm"
            data-copy-md
            title="复制为 Markdown"
            aria-label="复制为 Markdown"
          >
            <i data-lucide="clipboard"></i><i data-lucide="check" hidden></i>
          </button>
          <div class="button-group theme-switch" role="group" aria-label="主题">
            <button
              type="button"
              class="btn"
              data-variant="outline"
              data-size="icon-sm"
              data-theme-set="light"
              title="浅色"
              aria-label="浅色"
            >
              <i data-lucide="sun"></i>
            </button>
            <button
              type="button"
              class="btn"
              data-variant="outline"
              data-size="icon-sm"
              data-theme-set="system"
              title="跟随系统"
              aria-label="跟随系统"
            >
              <i data-lucide="monitor"></i>
            </button>
            <button
              type="button"
              class="btn"
              data-variant="outline"
              data-size="icon-sm"
              data-theme-set="dark"
              title="深色"
              aria-label="深色"
            >
              <i data-lucide="moon"></i>
            </button>
          </div>
        </div>
      </div>
    </header>

    <div class="layout">
      <main id="doc">
        <!-- 页面内容写在这里。#doc 的内容就是「复制为 Markdown」导出的范围。 -->
      </main>
      <!-- 右侧目录：骨架 JS 自动生成条目；条目不足 2 个时整块不出现，不要手写 -->
      <aside class="toc" data-md-skip aria-labelledby="toc-title">
        <nav class="toc-inner">
          <div class="toc-marker"></div>
          <div class="toc-title" id="toc-title" role="heading" aria-level="2">
            本页目录
          </div>
          <ul class="toc-list root"></ul>
        </nav>
      </aside>
    </div>

    <!--SHOW-ME:JS-->
    <script>
      /* ── 滑块填充 ──────────────────────────────────────────────────────
         轨道的已填充部分由 --slider-value 驱动。basecoat 只在它自己的 JS 里更新这个变量，
         而那份 JS 只有页面用到 tabs / dropdown 时才会被内联 —— 只有滑块的页面就会看到
         一条永远停在 20% 的填充。所以骨架自己管，与 basecoat JS 在不在无关。 */
      (function () {
        function sync(el) {
          var min = Number(el.min || 0),
            max = Number(el.max === "" ? 100 : el.max);
          var pct =
            max === min ? 0 : ((Number(el.value) - min) / (max - min)) * 100;
          el.style.setProperty("--slider-value", pct + "%");
        }
        document.querySelectorAll('input[type="range"]').forEach(sync);
        /* 事件委托：后插进来的滑块也照样跟着走 */
        document.addEventListener("input", function (e) {
          if (e.target.matches && e.target.matches('input[type="range"]'))
            sync(e.target);
        });
      })();
    </script>
    <script>
      /* ── 主题三态切换 ── */
      (function () {
        var root = document.documentElement;
        var mq = matchMedia("(prefers-color-scheme: dark)");
        function apply(t) {
          root.dataset.theme = t;
          root.classList.toggle(
            "dark",
            t === "dark" || (t === "system" && mq.matches)
          );
          document.querySelectorAll("[data-theme-set]").forEach(function (b) {
            b.setAttribute("aria-pressed", String(b.dataset.themeSet === t));
          });
        }
        document.querySelectorAll("[data-theme-set]").forEach(function (b) {
          b.addEventListener("click", function () {
            var t = b.dataset.themeSet;
            try {
              t === "system"
                ? localStorage.removeItem("show-me-theme")
                : localStorage.setItem("show-me-theme", t);
            } catch (e) {}
            apply(t);
          });
        });
        mq.addEventListener("change", function () {
          if (root.dataset.theme === "system") apply("system");
        });
        apply(root.dataset.theme || "system");
      })();

      /* ── 复制为 Markdown ──
   遍历 #doc（或 [data-md-root]）生成 GFM。跳过 [data-md-skip] / [hidden] / 脚本 / 弹层。 */
      (function () {
        var SKIP = new Set([
          "SCRIPT",
          "STYLE",
          "TEMPLATE",
          "DIALOG",
          "NOSCRIPT",
          "SVG",
          "CANVAS",
        ]);
        var INLINE_ONLY = new Set([
          "A",
          "CODE",
          "STRONG",
          "B",
          "EM",
          "I",
          "DEL",
          "S",
          "SPAN",
          "KBD",
          "SMALL",
          "ABBR",
          "MARK",
          "SUP",
          "SUB",
          "BR",
          "IMG",
          "TIME",
          "U",
          "Q",
          "LABEL",
          "OUTPUT",
        ]);

        function skipped(el) {
          return (
            SKIP.has(el.tagName) ||
            el.hasAttribute("data-md-skip") ||
            el.hasAttribute("hidden") ||
            el.getAttribute("aria-hidden") === "true"
          );
        }
        function txt(s) {
          return (s || "").replace(/\s+/g, " ");
        }

        function inline(node) {
          var out = "";
          node.childNodes.forEach(function (n) {
            if (n.nodeType === 3) {
              out += txt(n.nodeValue);
              return;
            }
            if (n.nodeType !== 1 || skipped(n)) return;
            var t = n.tagName,
              inner = inline(n);
            if (t === "BR") out += "  \n";
            else if (t === "IMG")
              out +=
                "![" +
                (n.alt || "") +
                "](" +
                (n.getAttribute("src") || "") +
                ")";
            else if (
              t === "CODE" ||
              t === "KBD" ||
              n.classList.contains("badge") ||
              n.classList.contains("kbd")
            )
              out += inner.trim() ? "`" + inner.trim() + "`" : "";
            else if (t === "A") {
              var href = n.getAttribute("href") || "";
              out +=
                href && !href.startsWith("#")
                  ? "[" + inner.trim() + "](" + href + ")"
                  : inner;
            } else if (t === "STRONG" || t === "B")
              out += inner.trim() ? "**" + inner.trim() + "**" : "";
            else if (t === "EM" || t === "I")
              out += inner.trim() ? "*" + inner.trim() + "*" : "";
            else if (t === "DEL" || t === "S")
              out += inner.trim() ? "~~" + inner.trim() + "~~" : "";
            else out += inner;
          });
          return out;
        }

        function cell(el) {
          return inline(el).trim().replace(/\|/g, "\\|").replace(/\n/g, " ");
        }

        function table(el) {
          var rows = Array.from(el.querySelectorAll("tr")).filter(function (r) {
            return !skipped(r);
          });
          if (!rows.length) return "";
          /* 没有表头行的表：全部行当数据，列名留空占位 ——
             否则第一行数据会被当成表头，语义就错了 */
          var hasTh = !!rows[0].querySelector("th");
          var head = rows[0],
            body = hasTh ? rows.slice(1) : rows;
          var cols = Array.from(head.children).map(function (c, i) {
            return hasTh ? cell(c) : "列" + (i + 1);
          });
          var out =
            "| " +
            cols.join(" | ") +
            " |\n|" +
            cols
              .map(function () {
                return " --- ";
              })
              .join("|") +
            "|\n";
          body.forEach(function (r) {
            out += "| " + Array.from(r.children).map(cell).join(" | ") + " |\n";
          });
          return out;
        }

        function list(el, depth) {
          var ordered = el.tagName === "OL",
            i = 0,
            out = "";
          Array.from(el.children).forEach(function (li) {
            if (li.tagName !== "LI" || skipped(li)) return;
            i++;
            var marker = ordered ? i + ". " : "- ";
            var pad = "  ".repeat(depth);
            var sub = "";
            var own = document.createElement("div");
            Array.from(li.childNodes).forEach(function (n) {
              if (
                n.nodeType === 1 &&
                (n.tagName === "UL" || n.tagName === "OL")
              )
                /* 深层嵌套拍平到本级：GFM 对超过 4–5 层的子列表解析不稳，保内容齐整优先 */
                sub += list(n, depth < 6 ? depth + 1 : depth);
              else own.appendChild(n.cloneNode(true));
            });
            var text = inline(own).trim();
            if (text) out += pad + marker + text + "\n";
            out += sub;
          });
          return out;
        }

        function block(el, depth) {
          var out = "";
          Array.from(el.children).forEach(function (n) {
            if (skipped(n)) return;
            var t = n.tagName;
            if (t === "SUMMARY")
              return; /* DETAILS 分支已单独输出，这里再走一遍会裸文本重复 */
            if (/^H[1-6]$/.test(t)) {
              out += "\n" + "#".repeat(+t[1]) + " " + inline(n).trim() + "\n\n";
            } else if (t === "P") {
              var s = inline(n).trim();
              if (s) out += s + "\n\n";
            } else if (t === "UL" || t === "OL") {
              out += list(n, 0) + "\n";
            } else if (t === "PRE") {
              var code = n.querySelector("code");
              var lang =
                (code &&
                  (code.className.match(/language-([\w+-]+)/) || [])[1]) ||
                "";
              out +=
                "```" +
                lang +
                "\n" +
                (n.textContent || "").replace(/\n+$/, "") +
                "\n```\n\n";
            } else if (t === "TABLE") {
              out += table(n) + "\n";
            } else if (t === "HR") {
              out += "---\n\n";
            } else if (t === "BLOCKQUOTE" || n.classList.contains("alert")) {
              out +=
                block(n, depth)
                  .trim()
                  .split("\n")
                  .map(function (l) {
                    return l ? "> " + l : ">";
                  })
                  .join("\n") + "\n\n";
            } else if (n.classList.contains("tabs")) {
              /* Markdown 没有标签页：每个标签导出成小标题 + 它的面板，隐藏的面板也要出。 */
              n.querySelectorAll('[role="tablist"] > [role="tab"]').forEach(
                function (tab) {
                  out += "**" + inline(tab).trim() + "**\n\n";
                  var panel = document.getElementById(
                    tab.getAttribute("aria-controls")
                  );
                  if (panel) out += block(panel, depth);
                }
              );
            } else if (t === "DETAILS") {
              var sum = n.querySelector("summary");
              if (sum) out += "**" + inline(sum).trim() + "**\n\n";
              out += block(n, depth);
            } else if (t === "DL") {
              Array.from(n.children).forEach(function (d) {
                if (d.tagName === "DT")
                  out += "**" + inline(d).trim() + "** — ";
                else if (d.tagName === "DD") out += inline(d).trim() + "\n\n";
              });
            } else if (
              n.children.length === 0 ||
              Array.from(n.children).every(function (c) {
                return INLINE_ONLY.has(c.tagName);
              })
            ) {
              var s2 = inline(n).trim();
              if (s2) out += s2 + "\n\n";
            } else {
              out += block(n, depth);
            }
          });
          return out;
        }

        function toMarkdown() {
          var root =
            document.querySelector("[data-md-root]") ||
            document.getElementById("doc") ||
            document.body;
          var md = block(root, 0)
            .replace(/\n{3,}/g, "\n\n")
            .trim();
          var title = document.title;
          /* 正文里只要有一级标题就不再拼 <title>：否则 eyebrow 段落排在 h1 前时，
             导出会得到两个「# 」（anti-patterns.md #2）。 */
          var hasH1 = /^# /m.test(md);
          return (hasH1 ? "" : "# " + title + "\n\n") + md + "\n";
        }

        /* 暴露给页面用：需要「下载 .md」之类的额外入口时调用它，不要另写一份转换器。 */
        window.showMeMarkdown = toMarkdown;

        document.querySelectorAll("[data-copy-md]").forEach(function (btn) {
          var icons = btn.querySelectorAll("svg, i");
          btn.addEventListener("click", async function () {
            var md = toMarkdown();
            /* 反馈先行：剪贴板图标换成对勾 1.6s。不等待 writeText —— 权限 pending 时它可能永不 settle。
         SVG 没有 hidden 反射属性，必须操作属性本身 */
            if (icons.length >= 2) {
              icons[0].setAttribute("hidden", "");
              icons[1].removeAttribute("hidden");
            }
            btn.setAttribute("data-variant", "secondary");
            setTimeout(function () {
              if (icons.length >= 2) {
                icons[0].removeAttribute("hidden");
                icons[1].setAttribute("hidden", "");
              }
              btn.setAttribute("data-variant", "outline");
            }, 1600);
            try {
              await navigator.clipboard.writeText(md);
            } catch (e) {
              var ta = document.createElement("textarea");
              ta.value = md;
              ta.style.position = "fixed";
              ta.style.opacity = "0";
              document.body.appendChild(ta);
              ta.select();
              try {
                document.execCommand("copy");
              } catch (e2) {}
              ta.remove();
            }
          });
        });
      })();

      /* ── 右侧目录：扫描 #doc 的 h2/h3 生成条目，指示条随滚动滑动到当前节。
   移植自 VitePress 的 outline：scroll（throttle 100ms）+ 标题绝对位置比较。
   标题加 data-toc-skip 可豁免；点击时立即定位指示条，平滑滚动途中不跟跳。 ── */
      (function () {
        var doc = document.getElementById("doc");
        var aside = document.querySelector(".toc");
        if (!doc || !aside) return;
        var list = aside.querySelector(".toc-list");
        var marker = aside.querySelector(".toc-marker");
        var headings = Array.from(doc.querySelectorAll("h2, h3")).filter(
          function (h) {
            /* 组件容器内的标题不是节标题：卡片头的 h3、折叠面板的标题都不得进目录。
               否则统计数字写成标题时会产出「7」「91 → 39」这类孤儿条目（anti-patterns.md #1）。 */
            return (
              !h.closest("[data-toc-skip]") &&
              !h.closest("[data-md-skip]") &&
              !h.closest(
                ".card, .fig-box, .alert, .item, .accordion, .dialog, .empty"
              )
            );
          }
        );
        if (headings.length < 2) return;

        /* h3 嵌进前一个 h2 的子列表；没有前置 h2 的 h3 按顶层处理 */
        var n = 0,
          sub = null;
        headings.forEach(function (h) {
          if (!h.id) h.id = "toc-" + ++n;
          var li = document.createElement("li");
          var a = document.createElement("a");
          a.className = "toc-link";
          a.href = "#" + h.id;
          a.textContent = a.title = h.textContent.trim();
          li.appendChild(a);
          if (h.tagName === "H2" || !sub) {
            list.appendChild(li);
            sub = null;
            if (h.tagName === "H2") {
              sub = document.createElement("ul");
              sub.className = "toc-list nested";
              li.appendChild(sub);
            }
          } else {
            sub.appendChild(li);
          }
        });
        document.body.classList.add("has-toc");

        var mq = matchMedia("(min-width: 80rem)");
        var prev = null,
          skipOnce = false;

        function topOf(el) {
          var t = 0;
          while (el !== document.body) {
            if (el === null)
              return NaN; /* display:none 的元素拿不到位置，自然被过滤 */
            t += el.offsetTop;
            el = el.offsetParent;
          }
          return t;
        }

        function activate(hash) {
          if (prev) prev.classList.remove("active");
          prev = null;
          if (hash) {
            var links = list.querySelectorAll("a");
            for (var i = 0; i < links.length; i++) {
              if (links[i].getAttribute("href") === hash) {
                prev = links[i];
                break;
              }
            }
          }
          if (prev) {
            prev.classList.add("active");
            /* 链接的 offsetParent 是 .toc-list，指示条的参照是 .toc-inner，两者原点要补齐 */
            marker.style.top =
              prev.offsetTop +
              (prev.offsetParent ? prev.offsetParent.offsetTop : 0) +
              (prev.offsetHeight - marker.offsetHeight) / 2 +
              "px";
            marker.style.opacity = "1";
          } else {
            marker.style.top = "";
            marker.style.opacity = "0";
          }
        }

        var geom =
          null; /* 缓存的标题几何：resize 后失效，滚动时不再逐个读 offsetTop */
        function measure() {
          geom = headings
            .map(function (h) {
              return {
                id: h.id,
                top: topOf(h),
                sm: parseFloat(getComputedStyle(h).scrollMarginTop) || 0,
              };
            })
            .filter(function (x) {
              return !isNaN(x.top);
            })
            .sort(function (a, b) {
              return a.top - b.top;
            });
        }

        function setActive() {
          if (!mq.matches) return;
          if (skipOnce) {
            skipOnce = false;
            return;
          }
          if (!geom) measure();
          var items = geom;
          if (!items.length) return activate(null);
          if (scrollY < 1) return activate(null); /* 页顶：无激活项 */
          if (
            Math.ceil(scrollY + innerHeight) >=
            document.documentElement.scrollHeight
          )
            return activate(
              "#" + items[items.length - 1].id
            ); /* 页底：激活最后一项 */
          var active = null;
          for (var i = 0; i < items.length; i++) {
            if (items[i].top > scrollY + items[i].sm + 4) break;
            active = items[i].id;
          }
          activate(active ? "#" + active : null);
        }

        aside.addEventListener("click", function (e) {
          var a = e.target instanceof Element ? e.target.closest("a") : null;
          if (a && a.hash) {
            skipOnce = true;
            activate(a.hash);
          }
        });
        var ticking = false;
        addEventListener(
          "scroll",
          function () {
            if (ticking) return;
            ticking = true;
            requestAnimationFrame(function () {
              ticking = false;
              setActive();
            });
          },
          { passive: true }
        );
        addEventListener("resize", function () {
          geom = null;
          setActive();
        });
        addEventListener(
          "load",
          setActive
        ); /* 等浏览器恢复滚动位置后再定位一次 */
        mq.addEventListener("change", setActive);
        setActive();
      })();
    </script>
  </body>
</html>
