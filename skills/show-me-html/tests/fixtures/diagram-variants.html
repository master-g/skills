<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>宽窄两版图夹具</title>
    <!--SHOW-ME:CSS-->
  </head>
  <body data-recipe="flowchart">
    <header class="page-chrome" data-md-skip>
      <div class="chrome-inner">
        <span class="chrome-title">宽窄两版图夹具</span>
      </div>
    </header>
    <div class="layout">
      <main id="doc">
        <section>
          <h1>一次改动的路径</h1>
          <p>横向流程图在窄屏换成纵向版，两版各自命名、id 前缀不同。</p>
          <figure class="fig">
            <div class="fig-box">
              <div class="fig-head">
                <span class="fig-title">四道检查，一道人工</span>
              </div>
              <svg
                class="diagram-wide"
                viewBox="0 0 720 120"
                role="img"
                aria-labelledby="flow-title flow-desc"
              >
                <title id="flow-title">改动经过四道检查后合入</title>
                <desc id="flow-desc">
                  本地验证、AI 评审、自动检查、人工批准，依次连接。
                </desc>
                <defs>
                  <marker
                    id="flow-arrow"
                    viewBox="0 0 10 10"
                    refX="8"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto-start-reverse"
                  >
                    <path
                      d="M 0,1 L 9,5 L 0,9 z"
                      style="fill: var(--color-muted-foreground)"
                    />
                  </marker>
                </defs>
                <g
                  style="stroke: var(--color-muted-foreground)"
                  stroke-width="1.2"
                  marker-end="url(#flow-arrow)"
                >
                  <line x1="150" y1="60" x2="186" y2="60" />
                  <line x1="330" y1="60" x2="366" y2="60" />
                  <line x1="510" y1="60" x2="546" y2="60" />
                </g>
                <g
                  style="fill: var(--color-card); stroke: var(--color-border)"
                  stroke-width="1.2"
                >
                  <rect x="10" y="36" width="140" height="48" rx="8" />
                  <rect x="190" y="36" width="140" height="48" rx="8" />
                  <rect x="370" y="36" width="140" height="48" rx="8" />
                  <rect x="550" y="36" width="140" height="48" rx="8" />
                </g>
                <g
                  class="flow-wide-label"
                  font-size="12"
                  text-anchor="middle"
                  style="fill: var(--color-foreground)"
                >
                  <text x="80" y="64">本地验证</text>
                  <text x="260" y="64">AI 评审</text>
                  <text x="440" y="64">自动检查</text>
                  <text x="620" y="64">人工批准</text>
                </g>
              </svg>
              <svg
                class="diagram-narrow"
                viewBox="0 0 320 300"
                role="img"
                aria-labelledby="flow-n-title flow-n-desc"
              >
                <title id="flow-n-title">改动经过四道检查后合入</title>
                <desc id="flow-n-desc">
                  本地验证、AI 评审、自动检查、人工批准，自上而下依次连接。
                </desc>
                <defs>
                  <marker
                    id="flow-n-arrow"
                    viewBox="0 0 10 10"
                    refX="8"
                    refY="5"
                    markerWidth="7"
                    markerHeight="7"
                    orient="auto-start-reverse"
                  >
                    <path
                      d="M 0,1 L 9,5 L 0,9 z"
                      style="fill: var(--color-muted-foreground)"
                    />
                  </marker>
                </defs>
                <g
                  style="stroke: var(--color-muted-foreground)"
                  stroke-width="1.2"
                  marker-end="url(#flow-n-arrow)"
                >
                  <line x1="160" y1="58" x2="160" y2="78" />
                  <line x1="160" y1="138" x2="160" y2="158" />
                  <line x1="160" y1="218" x2="160" y2="238" />
                </g>
                <g
                  style="fill: var(--color-card); stroke: var(--color-border)"
                  stroke-width="1.2"
                >
                  <rect x="70" y="10" width="180" height="48" rx="8" />
                  <rect x="70" y="90" width="180" height="48" rx="8" />
                  <rect x="70" y="170" width="180" height="48" rx="8" />
                  <rect x="70" y="250" width="180" height="40" rx="8" />
                </g>
                <g
                  class="flow-narrow-label"
                  font-size="13"
                  text-anchor="middle"
                  style="fill: var(--color-foreground)"
                >
                  <text x="160" y="38">本地验证</text>
                  <text x="160" y="118">AI 评审</text>
                  <text x="160" y="198">自动检查</text>
                  <text x="160" y="274">人工批准</text>
                </g>
              </svg>
            </div>
            <figcaption>人工只出现在最后一道。</figcaption>
          </figure>
        </section>
      </main>
    </div>
    <!--SHOW-ME:JS-->
  </body>
</html>
