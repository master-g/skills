[project]
name = "exportkit"
version = "0.4.2"
description = "把业务库里的记录按条件导出成 CSV 的小服务"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "uvicorn>=0.30",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "httpx>=0.27"]

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = ["integration: 需要本地 Postgres 的用例"]
addopts = "-m 'not integration'"

[tool.ruff]
line-length = 100
target-version = "py312"
