[project]
name = "settlekit"
version = "1.8.0"
description = "按日给商户生成结算文件并推送到银行 SFTP 的服务"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115",
  "sqlalchemy>=2.0.30",
  "psycopg[binary]>=3.2",
  "alembic>=1.13",
  "paramiko>=3.4",
  "hvac>=2.3",
]

[dependency-groups]
dev = ["pytest>=8.2", "ruff>=0.6", "mypy>=1.11"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.mypy]
strict = true
packages = ["settlekit"]
